<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch3spArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">Literals are pooled and shared. new String() always allocates a fresh object.</text>

  <!-- variables -->
  <rect x="14" y="42" width="210" height="182" rx="11" fill="#3b82f6" fill-opacity=".08" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="30" y="64" font-size="11.5" font-weight="700" fill="#3b82f6">variables (stack)</text>
  <g font-size="11" fill="currentColor">
    <rect x="30" y="76" width="178" height="30" rx="6" fill="#3b82f6" fill-opacity=".16"/>
    <text x="42" y="96">String a = "hi";</text>
    <rect x="30" y="112" width="178" height="30" rx="6" fill="#3b82f6" fill-opacity=".16"/>
    <text x="42" y="132">String b = "hi";</text>
    <rect x="30" y="148" width="178" height="30" rx="6" fill="#3b82f6" fill-opacity=".16"/>
    <text x="42" y="168">String c = new String("hi");</text>
    <rect x="30" y="184" width="178" height="30" rx="6" fill="#3b82f6" fill-opacity=".16"/>
    <text x="42" y="204">String d = c.intern();</text>
  </g>

  <!-- pool -->
  <rect x="290" y="42" width="230" height="92" rx="11" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-width="1.4"/>
  <text x="306" y="64" font-size="11.5" font-weight="700" fill="#10b981">String pool</text>
  <text x="306" y="80" font-size="10" fill="currentColor" opacity=".65">(a region of the heap since Java 7)</text>
  <rect x="306" y="88" width="198" height="34" rx="7" fill="#10b981" fill-opacity=".26" class="gf-pulse"/>
  <text x="322" y="110" font-size="12" font-weight="600" fill="currentColor">"hi"  @a01</text>

  <!-- heap object -->
  <rect x="290" y="158" width="230" height="66" rx="11" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="306" y="180" font-size="11.5" font-weight="700" fill="#f59e0b">ordinary heap</text>
  <rect x="306" y="188" width="198" height="28" rx="7" fill="#f59e0b" fill-opacity=".22"/>
  <text x="322" y="207" font-size="12" font-weight="600" fill="currentColor">"hi"  @b72</text>

  <path d="M212 90  C 250 90, 260 100, 300 102" fill="none" stroke="#f43f5e" stroke-width="1.4" marker-end="url(#ch3spArrow)"/>
  <path d="M212 126 C 250 126, 262 112, 300 108" fill="none" stroke="#f43f5e" stroke-width="1.4" marker-end="url(#ch3spArrow)"/>
  <path d="M212 162 C 250 162, 262 186, 300 198" fill="none" stroke="#f43f5e" stroke-width="1.4" marker-end="url(#ch3spArrow)"/>
  <path d="M212 198 C 244 198, 250 140, 300 114" fill="none" stroke="#f43f5e" stroke-width="1.4" marker-end="url(#ch3spArrow)" class="gf-dash"/>

  <!-- results -->
  <rect x="540" y="42" width="206" height="182" rx="11" fill="currentColor" fill-opacity=".04" stroke="currentColor" stroke-opacity=".18"/>
  <g font-size="11" fill="currentColor">
    <text x="556" y="66"><tspan font-weight="700" fill="#10b981">a == b</tspan>        true</text>
    <text x="556" y="90" opacity=".7">both point at the pool</text>
    <text x="556" y="120"><tspan font-weight="700" fill="#f43f5e">a == c</tspan>        false</text>
    <text x="556" y="144" opacity=".7">c is its own object</text>
    <text x="556" y="174"><tspan font-weight="700" fill="#10b981">a == d</tspan>        true</text>
    <text x="556" y="198" opacity=".7">intern() returns the</text>
    <text x="556" y="212" opacity=".7">pooled instance</text>
  </g>

  <text x="14" y="256" font-size="11.5" fill="currentColor" opacity=".8">a.equals(c) is <tspan font-weight="700" fill="#10b981">true</tspan> in every case — the characters are identical. Only identity differs.</text>
  <text x="14" y="276" font-size="11.5" fill="currentColor" opacity=".8">This is the entire reason "never compare strings with ==" is drilled into every Java course.</text>
</svg>
