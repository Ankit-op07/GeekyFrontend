<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch3cgArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">Concatenating in a loop: every iteration allocates and copies the whole string</text>

  <!-- bad -->
  <rect x="14" y="38" width="360" height="248" rx="12" fill="#f43f5e" fill-opacity=".07" stroke="#f43f5e" stroke-width="1.4"/>
  <text x="32" y="60" font-size="12" font-weight="700" fill="#f43f5e">✘ String s = s + item;   inside a loop</text>

  <g class="gf-seq gf-s1">
    <rect x="32" y="72" width="120" height="30" rx="6" fill="#f43f5e" fill-opacity=".2"/>
    <text x="44" y="92" font-size="11" fill="currentColor">"a"</text>
  </g>
  <g class="gf-seq gf-s2">
    <rect x="32" y="110" width="160" height="30" rx="6" fill="#f43f5e" fill-opacity=".2"/>
    <text x="44" y="130" font-size="11" fill="currentColor">"ab"</text>
  </g>
  <g class="gf-seq gf-s3">
    <rect x="32" y="148" width="200" height="30" rx="6" fill="#f43f5e" fill-opacity=".2"/>
    <text x="44" y="168" font-size="11" fill="currentColor">"abc"</text>
  </g>
  <g class="gf-seq gf-s4">
    <rect x="32" y="186" width="240" height="30" rx="6" fill="#f43f5e" fill-opacity=".2"/>
    <text x="44" y="206" font-size="11" fill="currentColor">"abcd"</text>
  </g>

  <text x="32" y="240" font-size="10.5" fill="currentColor" opacity=".8">Each line is a NEW object. The previous one becomes garbage</text>
  <text x="32" y="256" font-size="10.5" fill="currentColor" opacity=".8">immediately, and every character is copied again.</text>
  <text x="32" y="276" font-size="11" font-weight="700" fill="#f43f5e">n iterations → O(n²) copying</text>

  <!-- good -->
  <rect x="394" y="38" width="352" height="248" rx="12" fill="#10b981" fill-opacity=".07" stroke="#10b981" stroke-width="1.4"/>
  <text x="412" y="60" font-size="12" font-weight="700" fill="#10b981">✔ StringBuilder sb; sb.append(item);</text>

  <rect x="412" y="80" width="316" height="76" rx="8" fill="#10b981" fill-opacity=".16" stroke="#10b981" stroke-width="1.1"/>
  <text x="428" y="100" font-size="11" font-weight="600" fill="currentColor">one mutable char buffer</text>
  <g font-size="11" fill="currentColor">
    <rect x="428" y="110" width="34" height="30" rx="5" fill="#10b981" fill-opacity=".3" class="gf-seq gf-s1"/><text x="440" y="130">a</text>
    <rect x="466" y="110" width="34" height="30" rx="5" fill="#10b981" fill-opacity=".3" class="gf-seq gf-s2"/><text x="478" y="130">b</text>
    <rect x="504" y="110" width="34" height="30" rx="5" fill="#10b981" fill-opacity=".3" class="gf-seq gf-s3"/><text x="516" y="130">c</text>
    <rect x="542" y="110" width="34" height="30" rx="5" fill="#10b981" fill-opacity=".3" class="gf-seq gf-s4"/><text x="554" y="130">d</text>
    <rect x="580" y="110" width="130" height="30" rx="5" fill="currentColor" fill-opacity=".07" stroke="currentColor" stroke-opacity=".2" stroke-dasharray="3 3"/>
    <text x="596" y="130" opacity=".55">spare capacity</text>
  </g>

  <path d="M570 168 L570 196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ch3cgArrow)"/>
  <text x="412" y="186" font-size="10.5" fill="currentColor" opacity=".8">Appends write into the existing buffer. It doubles only</text>
  <text x="412" y="202" font-size="10.5" fill="currentColor" opacity=".8">when full, so growth is amortised.</text>

  <rect x="412" y="212" width="316" height="34" rx="7" fill="#10b981" fill-opacity=".22"/>
  <text x="428" y="234" font-size="11" font-weight="600" fill="currentColor">toString() — one String, built once</text>

  <text x="412" y="276" font-size="11" font-weight="700" fill="#10b981">n iterations → O(n) copying</text>
</svg>
