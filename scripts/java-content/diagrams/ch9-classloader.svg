<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch9clUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/>
    </marker>
    <marker id="ch9clDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">Parent delegation: ask your parent first, load it yourself only if nobody above can</text>

  <g class="gf-seq gf-s1">
    <rect x="240" y="36" width="280" height="50" rx="10" fill="#8b5cf6" fill-opacity=".2" stroke="#8b5cf6" stroke-width="1.3"/>
    <text x="256" y="58" font-size="11.5" font-weight="700" fill="#8b5cf6">Bootstrap</text>
    <text x="256" y="76" font-size="9.5" fill="currentColor" opacity=".8">java.lang.*, core JDK — native, no parent</text>
  </g>
  <g class="gf-seq gf-s2">
    <rect x="240" y="106" width="280" height="50" rx="10" fill="#3b82f6" fill-opacity=".2" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="256" y="128" font-size="11.5" font-weight="700" fill="#3b82f6">Platform</text>
    <text x="256" y="146" font-size="9.5" fill="currentColor" opacity=".8">JDK modules outside the core (was "Extension")</text>
  </g>
  <g class="gf-seq gf-s3">
    <rect x="240" y="176" width="280" height="50" rx="10" fill="#10b981" fill-opacity=".2" stroke="#10b981" stroke-width="1.3"/>
    <text x="256" y="198" font-size="11.5" font-weight="700" fill="#10b981">Application</text>
    <text x="256" y="216" font-size="9.5" fill="currentColor" opacity=".8">your classes, from the classpath</text>
  </g>

  <path d="M232 196 L232 136" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#ch9clUp)" class="gf-dash"/>
  <path d="M232 126 L232 66" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#ch9clUp)" class="gf-dash"/>
  <text x="60" y="130" font-size="10.5" font-weight="700" fill="#f43f5e">1 · delegate UP</text>
  <text x="60" y="148" font-size="9.5" fill="currentColor" opacity=".75">"can you load it?"</text>

  <path d="M528 66 L528 126" stroke="#10b981" stroke-width="1.8" marker-end="url(#ch9clDown)"/>
  <path d="M528 136 L528 196" stroke="#10b981" stroke-width="1.8" marker-end="url(#ch9clDown)"/>
  <text x="548" y="130" font-size="10.5" font-weight="700" fill="#10b981">2 · load on the way DOWN</text>
  <text x="548" y="148" font-size="9.5" fill="currentColor" opacity=".75">the lowest loader that can, does</text>

  <rect x="14" y="242" width="360" height="54" rx="9" fill="#10b981" fill-opacity=".1" stroke="#10b981" stroke-width="1.1"/>
  <text x="30" y="262" font-size="10.5" font-weight="700" fill="#10b981">Why delegation exists: security</text>
  <text x="30" y="280" font-size="10" fill="currentColor" opacity=".85">You cannot replace java.lang.String — Bootstrap always wins.</text>

  <rect x="386" y="242" width="360" height="54" rx="9" fill="#f59e0b" fill-opacity=".1" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="402" y="262" font-size="10.5" font-weight="700" fill="#f59e0b">Class identity = name + loader</text>
  <text x="402" y="280" font-size="10" fill="currentColor" opacity=".85">Same class, two loaders → ClassCastException that reads like nonsense.</text>
</svg>
