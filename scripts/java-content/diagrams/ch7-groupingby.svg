<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch7gbArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">groupingBy: a classifier picks the key, a downstream collector shapes the value</text>

  <!-- input -->
  <rect x="14" y="36" width="190" height="180" rx="11" fill="#3b82f6" fill-opacity=".1" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="30" y="58" font-size="11" font-weight="700" fill="#3b82f6">employees</text>
  <g font-size="10" fill="currentColor">
    <rect x="30" y="68" width="158" height="26" rx="5" fill="#3b82f6" fill-opacity=".2"/><text x="40" y="85">Asha · ENG · 90</text>
    <rect x="30" y="98" width="158" height="26" rx="5" fill="#3b82f6" fill-opacity=".2"/><text x="40" y="115">Ben · ENG · 70</text>
    <rect x="30" y="128" width="158" height="26" rx="5" fill="#3b82f6" fill-opacity=".2"/><text x="40" y="145">Chen · SALES · 60</text>
    <rect x="30" y="158" width="158" height="26" rx="5" fill="#3b82f6" fill-opacity=".2"/><text x="40" y="175">Dia · SALES · 80</text>
  </g>

  <path d="M210 126 L246 126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ch7gbArrow)" class="gf-dash"/>
  <text x="204" y="116" font-size="9.5" fill="currentColor" opacity=".6">classifier</text>
  <text x="204" y="150" font-size="9.5" fill="currentColor" opacity=".6">::dept</text>

  <!-- variant 1 -->
  <g class="gf-seq gf-s1">
    <rect x="252" y="36" width="240" height="82" rx="10" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-width="1.2"/>
    <text x="266" y="56" font-size="10.5" font-weight="700" fill="#10b981">groupingBy(Employee::dept)</text>
    <text x="266" y="76" font-size="10" fill="currentColor" opacity=".8">default downstream = toList()</text>
    <text x="266" y="96" font-size="10" fill="currentColor">ENG   → [Asha, Ben]</text>
    <text x="266" y="110" font-size="10" fill="currentColor">SALES → [Chen, Dia]</text>
  </g>

  <g class="gf-seq gf-s2">
    <rect x="252" y="126" width="240" height="72" rx="10" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="266" y="146" font-size="10.5" font-weight="700" fill="#f59e0b">…, counting()</text>
    <text x="266" y="166" font-size="10" fill="currentColor">ENG   → 2</text>
    <text x="266" y="182" font-size="10" fill="currentColor">SALES → 2</text>
  </g>

  <g class="gf-seq gf-s3">
    <rect x="504" y="36" width="242" height="82" rx="10" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="518" y="56" font-size="10.5" font-weight="700" fill="#8b5cf6">…, averagingInt(::salary)</text>
    <text x="518" y="80" font-size="10" fill="currentColor">ENG   → 80.0</text>
    <text x="518" y="96" font-size="10" fill="currentColor">SALES → 70.0</text>
  </g>

  <g class="gf-seq gf-s4">
    <rect x="504" y="126" width="242" height="72" rx="10" fill="#f43f5e" fill-opacity=".12" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="518" y="146" font-size="10.5" font-weight="700" fill="#f43f5e">…, mapping(::name, toList())</text>
    <text x="518" y="166" font-size="10" fill="currentColor">ENG   → [Asha, Ben]</text>
    <text x="518" y="182" font-size="10" fill="currentColor">SALES → [Chen, Dia]</text>
  </g>

  <rect x="14" y="212" width="732" height="56" rx="10" fill="currentColor" fill-opacity=".04" stroke="currentColor" stroke-opacity=".18"/>
  <text x="30" y="234" font-size="10.5" fill="currentColor" opacity=".85">Downstream collectors <tspan font-weight="700">nest</tspan>: groupingBy(::dept, groupingBy(::role, counting())) gives a Map&lt;String, Map&lt;String, Long&gt;&gt;.</text>
  <text x="30" y="254" font-size="10.5" fill="currentColor" opacity=".85">⚠ <tspan font-weight="700">toMap</tspan> throws IllegalStateException on a duplicate key unless you pass a merge function. groupingBy never does — that is the difference.</text>
</svg>
