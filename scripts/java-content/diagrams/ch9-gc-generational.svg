<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch9gcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">The weak generational hypothesis: most objects die young — so collect the young often</text>

  <!-- flow -->
  <g class="gf-seq gf-s1">
    <rect x="14" y="38" width="150" height="64" rx="10" fill="#10b981" fill-opacity=".2" stroke="#10b981" stroke-width="1.3"/>
    <text x="30" y="60" font-size="11" font-weight="700" fill="#10b981">Eden</text>
    <text x="30" y="78" font-size="9.5" fill="currentColor" opacity=".8">every new object</text>
    <text x="30" y="94" font-size="9.5" fill="currentColor" opacity=".8">allocated by pointer bump</text>
  </g>
  <path d="M168 70 L200 70" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ch9gcArrow)" class="gf-dash"/>
  <text x="166" y="62" font-size="9" fill="currentColor" opacity=".6">minor GC</text>

  <g class="gf-seq gf-s2">
    <rect x="204" y="38" width="170" height="64" rx="10" fill="#3b82f6" fill-opacity=".2" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="220" y="60" font-size="11" font-weight="700" fill="#3b82f6">Survivor S0 ⇄ S1</text>
    <text x="220" y="78" font-size="9.5" fill="currentColor" opacity=".8">live objects copied back</text>
    <text x="220" y="94" font-size="9.5" fill="currentColor" opacity=".8">and forth, age++ each time</text>
  </g>
  <path d="M378 70 L410 70" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ch9gcArrow)" class="gf-dash"/>
  <text x="374" y="62" font-size="9" fill="currentColor" opacity=".6">age &gt; threshold</text>

  <g class="gf-seq gf-s3">
    <rect x="414" y="38" width="170" height="64" rx="10" fill="#f59e0b" fill-opacity=".2" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="430" y="60" font-size="11" font-weight="700" fill="#f59e0b">Old generation</text>
    <text x="430" y="78" font-size="9.5" fill="currentColor" opacity=".8">long-lived objects</text>
    <text x="430" y="94" font-size="9.5" fill="currentColor" opacity=".8">major GC — expensive</text>
  </g>
  <path d="M588 70 L620 70" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ch9gcArrow)" class="gf-dash"/>

  <g class="gf-seq gf-s4">
    <rect x="624" y="38" width="122" height="64" rx="10" fill="#f43f5e" fill-opacity=".18" stroke="#f43f5e" stroke-width="1.3"/>
    <text x="640" y="60" font-size="11" font-weight="700" fill="#f43f5e">full GC</text>
    <text x="640" y="78" font-size="9.5" fill="currentColor" opacity=".8">longest pause</text>
    <text x="640" y="94" font-size="9.5" fill="currentColor" opacity=".8">avoid at all costs</text>
  </g>

  <text x="14" y="128" font-size="10.5" fill="currentColor" opacity=".85">Typically <tspan font-weight="700">~90-98% of objects die in Eden</tspan> — so a minor GC copies only the few survivors and reclaims the rest for free.</text>
  <text x="14" y="146" font-size="10.5" fill="currentColor" opacity=".85">That is why allocation is cheap and why "avoid creating objects" is largely obsolete advice on a modern JVM.</text>

  <!-- collectors -->
  <rect x="14" y="162" width="732" height="128" rx="11" fill="currentColor" fill-opacity=".04" stroke="currentColor" stroke-opacity=".18"/>
  <text x="30" y="184" font-size="11" font-weight="700" fill="currentColor">Choosing a collector</text>
  <g font-size="10" fill="currentColor">
    <rect x="30" y="194" width="170" height="82" rx="8" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-width="1"/>
    <text x="42" y="212" font-weight="700" fill="#10b981">G1 — the default</text>
    <text x="42" y="230" opacity=".85">region-based, since Java 9</text>
    <text x="42" y="246" opacity=".85">pause target: -XX:MaxGCPauseMillis</text>
    <text x="42" y="264" opacity=".85">good general balance</text>

    <rect x="210" y="194" width="170" height="82" rx="8" fill="#3b82f6" fill-opacity=".12" stroke="#3b82f6" stroke-width="1"/>
    <text x="222" y="212" font-weight="700" fill="#3b82f6">ZGC / Shenandoah</text>
    <text x="222" y="230" opacity=".85">sub-millisecond pauses</text>
    <text x="222" y="246" opacity=".85">mostly concurrent</text>
    <text x="222" y="264" opacity=".85">large heaps, latency-critical</text>

    <rect x="390" y="194" width="170" height="82" rx="8" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-width="1"/>
    <text x="402" y="212" font-weight="700" fill="#f59e0b">Parallel</text>
    <text x="402" y="230" opacity=".85">throughput over latency</text>
    <text x="402" y="246" opacity=".85">longer stop-the-world pauses</text>
    <text x="402" y="264" opacity=".85">batch jobs</text>

    <rect x="570" y="194" width="176" height="82" rx="8" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-width="1"/>
    <text x="582" y="212" font-weight="700" fill="#8b5cf6">Serial</text>
    <text x="582" y="230" opacity=".85">one thread, small heaps</text>
    <text x="582" y="246" opacity=".85">containers, CLI tools</text>
    <text x="582" y="264" opacity=".85">CMS was removed in Java 14</text>
  </g>
</svg>
