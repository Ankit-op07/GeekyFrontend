<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch2ccUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/>
    </marker>
    <marker id="ch2ccDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">Constructor chaining: every constructor runs, top of the hierarchy first</text>
  <text x="14" y="40" font-size="11" fill="currentColor" opacity=".7">new Manager("Asha") — the call goes UP the chain before any body executes</text>

  <!-- Object -->
  <rect x="410" y="56" width="240" height="52" rx="10" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="428" y="78" font-size="12" font-weight="700" fill="#8b5cf6">Object()</text>
  <text x="428" y="96" font-size="10.5" fill="currentColor" opacity=".7">the implicit root of every hierarchy</text>

  <!-- Employee -->
  <rect x="410" y="128" width="240" height="52" rx="10" fill="#3b82f6" fill-opacity=".14" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="428" y="150" font-size="12" font-weight="700" fill="#3b82f6">Employee(String)</text>
  <text x="428" y="168" font-size="10.5" fill="currentColor" opacity=".7">super() inserted automatically</text>

  <!-- Manager -->
  <rect x="410" y="200" width="240" height="52" rx="10" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="428" y="222" font-size="12" font-weight="700" fill="#f59e0b">Manager(String)</text>
  <text x="428" y="240" font-size="10.5" fill="currentColor" opacity=".7">super(name); then its own body</text>

  <!-- up arrows (calls) -->
  <path d="M400 216 L400 168" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#ch2ccUp)" class="gf-dash"/>
  <path d="M400 144 L400 96" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#ch2ccUp)" class="gf-dash"/>
  <text x="248" y="150" font-size="11" font-weight="600" fill="#f43f5e">1. calls go UP</text>
  <text x="248" y="168" font-size="10.5" fill="currentColor" opacity=".7">super(...) is the FIRST</text>
  <text x="248" y="184" font-size="10.5" fill="currentColor" opacity=".7">statement, always</text>

  <!-- down arrows (bodies execute) -->
  <path d="M666 96 L666 144" stroke="#10b981" stroke-width="1.8" marker-end="url(#ch2ccDown)" class="gf-dash"/>
  <path d="M666 168 L666 216" stroke="#10b981" stroke-width="1.8" marker-end="url(#ch2ccDown)" class="gf-dash"/>
  <text x="686" y="132" font-size="11" font-weight="600" fill="#10b981">2. bodies</text>
  <text x="686" y="148" font-size="11" font-weight="600" fill="#10b981">run DOWN</text>

  <g class="gf-seq gf-s1"><circle cx="392" cy="82" r="7" fill="#10b981"/><text x="378" y="86" font-size="9" font-weight="700" fill="#fff">1</text></g>
  <g class="gf-seq gf-s2"><circle cx="392" cy="154" r="7" fill="#10b981"/><text x="378" y="158" font-size="9" font-weight="700" fill="#fff">2</text></g>
  <g class="gf-seq gf-s3"><circle cx="392" cy="226" r="7" fill="#10b981"/><text x="378" y="230" font-size="9" font-weight="700" fill="#fff">3</text></g>

  <text x="14" y="278" font-size="11.5" fill="currentColor" opacity=".78">This is why a superclass constructor must never call an overridable method: the subclass body has not run yet,</text>
  <text x="14" y="294" font-size="11.5" fill="currentColor" opacity=".78">so the override it dispatches to sees fields that are still at their default values.</text>
</svg>
