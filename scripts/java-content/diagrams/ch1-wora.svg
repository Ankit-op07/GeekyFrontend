<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch1woraArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="24" font-size="13" font-weight="700" fill="currentColor">Write once, run anywhere — the bytecode is portable, the JVM is not</text>

  <rect x="270" y="46" width="220" height="58" rx="10" fill="#8b5cf6" fill-opacity=".16" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="290" y="70" font-size="12.5" font-weight="600" fill="#8b5cf6">Main.class</text>
  <text x="290" y="90" font-size="11" fill="currentColor" opacity=".75">One artefact. Byte-for-byte identical.</text>

  <path d="M340 108 L150 142" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ch1woraArrow)" class="gf-dash"/>
  <path d="M380 108 L380 142" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ch1woraArrow)" class="gf-dash"/>
  <path d="M420 108 L610 142" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ch1woraArrow)" class="gf-dash"/>

  <g class="gf-seq gf-s1">
    <rect x="34" y="148" width="200" height="80" rx="10" fill="#3b82f6" fill-opacity=".12" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="52" y="172" font-size="12" font-weight="600" fill="#3b82f6">JVM for Windows</text>
    <text x="52" y="192" font-size="11" fill="currentColor" opacity=".7">Different binary,</text>
    <text x="52" y="208" font-size="11" fill="currentColor" opacity=".7">same bytecode contract</text>
  </g>
  <g class="gf-seq gf-s2">
    <rect x="280" y="148" width="200" height="80" rx="10" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-width="1.3"/>
    <text x="298" y="172" font-size="12" font-weight="600" fill="#10b981">JVM for Linux</text>
    <text x="298" y="192" font-size="11" fill="currentColor" opacity=".7">Different binary,</text>
    <text x="298" y="208" font-size="11" fill="currentColor" opacity=".7">same bytecode contract</text>
  </g>
  <g class="gf-seq gf-s3">
    <rect x="526" y="148" width="200" height="80" rx="10" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="544" y="172" font-size="12" font-weight="600" fill="#f59e0b">JVM for macOS</text>
    <text x="544" y="192" font-size="11" fill="currentColor" opacity=".7">Different binary,</text>
    <text x="544" y="208" font-size="11" fill="currentColor" opacity=".7">same bytecode contract</text>
  </g>

  <text x="14" y="128" font-size="11" fill="currentColor" opacity=".65">The portability lives in the SPEC, not in magic:</text>
  <text x="14" y="242" font-size="11" fill="currentColor" opacity=".65">every vendor ships a JVM that promises to execute the same bytecode the same way.</text>
</svg>
