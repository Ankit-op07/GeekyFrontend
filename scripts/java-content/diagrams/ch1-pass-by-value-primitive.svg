<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch1pbvpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">Passing a primitive: the callee gets a COPY of the number</text>
  <text x="14" y="42" font-size="11.5" fill="currentColor" opacity=".7">void bump(int n) { n = n + 1; }  —  called as bump(count);</text>

  <!-- caller frame -->
  <rect x="14" y="60" width="300" height="120" rx="11" fill="#3b82f6" fill-opacity=".10" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="32" y="84" font-size="12" font-weight="700" fill="#3b82f6">main() frame</text>
  <rect x="32" y="98" width="180" height="46" rx="8" fill="#3b82f6" fill-opacity=".2" stroke="#3b82f6" stroke-width="1"/>
  <text x="48" y="118" font-size="11.5" font-weight="600" fill="currentColor">count</text>
  <rect x="140" y="106" width="56" height="30" rx="6" fill="#10b981" fill-opacity=".35"/>
  <text x="160" y="126" font-size="13" font-weight="700" fill="currentColor">3</text>
  <text x="32" y="166" font-size="11" fill="#10b981" font-weight="600">still 3 after the call</text>

  <path d="M320 120 L392 120" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ch1pbvpArrow)" class="gf-dash"/>
  <text x="316" y="110" font-size="10.5" fill="currentColor" opacity=".65">copy the bits</text>

  <!-- callee frame -->
  <rect x="400" y="60" width="346" height="120" rx="11" fill="#f59e0b" fill-opacity=".10" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="418" y="84" font-size="12" font-weight="700" fill="#f59e0b">bump() frame</text>
  <rect x="418" y="98" width="180" height="46" rx="8" fill="#f59e0b" fill-opacity=".2" stroke="#f59e0b" stroke-width="1"/>
  <text x="434" y="118" font-size="11.5" font-weight="600" fill="currentColor">n</text>
  <rect x="526" y="106" width="56" height="30" rx="6" fill="#f43f5e" fill-opacity=".35" class="gf-pulse"/>
  <text x="546" y="126" font-size="13" font-weight="700" fill="currentColor">4</text>
  <text x="418" y="166" font-size="11" fill="currentColor" opacity=".75">n is a separate slot. Incrementing it touches nothing outside this frame.</text>

  <text x="14" y="206" font-size="11.5" fill="currentColor" opacity=".78">The frame is discarded when bump() returns and the 4 goes with it. This is why Java has no swap(a, b).</text>
</svg>
