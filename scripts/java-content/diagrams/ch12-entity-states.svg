<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch12esArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">JPA entity states — and why a managed entity saves itself without a save() call</text>

  <g class="gf-seq gf-s1">
    <rect x="14" y="40" width="150" height="54" rx="10" fill="#94a3b8" fill-opacity=".2" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="30" y="62" font-size="11" font-weight="700" fill="currentColor">TRANSIENT</text>
    <text x="30" y="80" font-size="9.5" fill="currentColor" opacity=".8">new Order() — no id, unknown</text>
  </g>
  <path d="M168 67 L212 67" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ch12esArrow)" class="gf-dash"/>
  <text x="168" y="58" font-size="9" fill="currentColor" opacity=".65">persist()</text>

  <g class="gf-seq gf-s2">
    <rect x="216" y="40" width="180" height="54" rx="10" fill="#10b981" fill-opacity=".22" stroke="#10b981" stroke-width="1.3"/>
    <text x="232" y="62" font-size="11" font-weight="700" fill="#10b981">MANAGED</text>
    <text x="232" y="80" font-size="9.5" fill="currentColor" opacity=".8">tracked by the persistence context</text>
  </g>
  <path d="M400 67 L444 67" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ch12esArrow)" class="gf-dash"/>
  <text x="398" y="58" font-size="9" fill="currentColor" opacity=".65">remove()</text>

  <g class="gf-seq gf-s3">
    <rect x="448" y="40" width="150" height="54" rx="10" fill="#f43f5e" fill-opacity=".18" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="464" y="62" font-size="11" font-weight="700" fill="#f43f5e">REMOVED</text>
    <text x="464" y="80" font-size="9.5" fill="currentColor" opacity=".8">deleted at flush</text>
  </g>

  <path d="M306 98 L306 132" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ch12esArrow)" class="gf-dash"/>
  <text x="312" y="118" font-size="9" fill="currentColor" opacity=".65">close / clear / detach</text>

  <g class="gf-seq gf-s4">
    <rect x="216" y="136" width="180" height="54" rx="10" fill="#f59e0b" fill-opacity=".2" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="232" y="158" font-size="11" font-weight="700" fill="#f59e0b">DETACHED</text>
    <text x="232" y="176" font-size="9.5" fill="currentColor" opacity=".8">has an id, no longer tracked</text>
  </g>
  <path d="M212 163 C 160 163, 160 100, 216 80" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ch12esArrow)"/>
  <text x="100" y="150" font-size="9" fill="currentColor" opacity=".65">merge() → returns a</text>
  <text x="100" y="164" font-size="9" fill="currentColor" opacity=".65">NEW managed copy</text>

  <rect x="448" y="118" width="298" height="90" rx="10" fill="#10b981" fill-opacity=".1" stroke="#10b981" stroke-width="1.2"/>
  <text x="464" y="138" font-size="10.5" font-weight="700" fill="#10b981">Dirty checking — the thing people miss</text>
  <text x="464" y="158" font-size="10" fill="currentColor" opacity=".85">order.setStatus(SHIPPED);   // inside a @Transactional</text>
  <text x="464" y="174" font-size="10" fill="currentColor" opacity=".85">// no save() call anywhere…</text>
  <text x="464" y="194" font-size="10" fill="currentColor" opacity=".85">…and an UPDATE is issued at commit. The context compares</text>
  <text x="464" y="204" font-size="10" fill="currentColor" opacity=".85">every managed entity against its loaded snapshot.</text>

  <rect x="14" y="220" width="732" height="52" rx="9" fill="#f43f5e" fill-opacity=".08" stroke="#f43f5e" stroke-width="1.1"/>
  <text x="30" y="240" font-size="10.5" font-weight="700" fill="#f43f5e">The two consequences that cause bugs</text>
  <text x="30" y="258" font-size="10.5" fill="currentColor" opacity=".85">Accidental update: mutating a managed entity you only meant to read still writes.  ·  <tspan font-weight="600">merge() returns a copy</tspan> — keep using the argument and your changes vanish.</text>
</svg>
