<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch2ioArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">Initialisation order — statics once per class, instance parts once per object</text>

  <!-- static phase -->
  <rect x="14" y="38" width="360" height="128" rx="12" fill="#8b5cf6" fill-opacity=".09" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="32" y="60" font-size="12" font-weight="700" fill="#8b5cf6">ONCE — when the class is first initialised</text>

  <g class="gf-seq gf-s1">
    <rect x="32" y="72" width="324" height="36" rx="8" fill="#8b5cf6" fill-opacity=".18"/>
    <text x="46" y="88" font-size="11" font-weight="600" fill="currentColor">1 · static field initialisers</text>
    <text x="46" y="103" font-size="10" fill="currentColor" opacity=".7">static int LIMIT = 10;</text>
  </g>
  <g class="gf-seq gf-s2">
    <rect x="32" y="114" width="324" height="36" rx="8" fill="#8b5cf6" fill-opacity=".18"/>
    <text x="46" y="130" font-size="11" font-weight="600" fill="currentColor">2 · static initialiser blocks</text>
    <text x="46" y="145" font-size="10" fill="currentColor" opacity=".7">static { … }   — in source order with the fields above</text>
  </g>

  <path d="M194 172 L194 196" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ch2ioArrow)"/>

  <!-- instance phase -->
  <rect x="14" y="200" width="360" height="110" rx="12" fill="#10b981" fill-opacity=".09" stroke="#10b981" stroke-width="1.4"/>
  <text x="32" y="222" font-size="12" font-weight="700" fill="#10b981">EVERY TIME — on each new</text>

  <g class="gf-seq gf-s3">
    <rect x="32" y="232" width="324" height="30" rx="8" fill="#10b981" fill-opacity=".18"/>
    <text x="46" y="252" font-size="11" font-weight="600" fill="currentColor">3 · instance field initialisers + { } blocks</text>
  </g>
  <g class="gf-seq gf-s4">
    <rect x="32" y="268" width="324" height="30" rx="8" fill="#10b981" fill-opacity=".18"/>
    <text x="46" y="288" font-size="11" font-weight="600" fill="currentColor">4 · the constructor body</text>
  </g>

  <!-- with inheritance -->
  <rect x="394" y="38" width="352" height="272" rx="12" fill="#f59e0b" fill-opacity=".07" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="412" y="60" font-size="12" font-weight="700" fill="#f59e0b">With inheritance, the full order is:</text>
  <g font-size="11" fill="currentColor">
    <text x="412" y="88">1.  Parent static fields + static blocks</text>
    <text x="412" y="110">2.  Child static fields + static blocks</text>
    <text x="412" y="132" opacity=".55">— everything above happens ONCE —</text>
    <text x="412" y="158">3.  Parent instance initialisers</text>
    <text x="412" y="180">4.  Parent constructor body</text>
    <text x="412" y="202">5.  Child instance initialisers</text>
    <text x="412" y="224">6.  Child constructor body</text>
  </g>
  <rect x="412" y="240" width="316" height="56" rx="8" fill="#f43f5e" fill-opacity=".12" stroke="#f43f5e" stroke-width="1"/>
  <text x="426" y="260" font-size="10.5" font-weight="600" fill="#f43f5e">Why step 4 before step 5 is dangerous:</text>
  <text x="426" y="277" font-size="10.5" fill="currentColor" opacity=".8">a parent constructor calling an overridden method runs</text>
  <text x="426" y="291" font-size="10.5" fill="currentColor" opacity=".8">the child's version while the child's fields are still 0/null.</text>
</svg>
