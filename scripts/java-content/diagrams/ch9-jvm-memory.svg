<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">JVM runtime data areas — what is shared, what is per-thread, what is outside the heap</text>

  <!-- heap -->
  <rect x="14" y="34" width="440" height="160" rx="12" fill="#10b981" fill-opacity=".08" stroke="#10b981" stroke-width="1.4"/>
  <text x="30" y="56" font-size="12" font-weight="700" fill="#10b981">Heap — shared by all threads, garbage-collected</text>
  <text x="30" y="72" font-size="9.5" fill="currentColor" opacity=".65">sized by -Xms / -Xmx</text>

  <rect x="30" y="82" width="270" height="98" rx="9" fill="#10b981" fill-opacity=".14" stroke="#10b981" stroke-width="1.1"/>
  <text x="44" y="102" font-size="11" font-weight="700" fill="currentColor">Young generation</text>
  <g font-size="10" fill="currentColor">
    <rect x="44" y="112" width="120" height="26" rx="5" fill="#10b981" fill-opacity=".26" class="gf-seq gf-s1"/><text x="82" y="129">Eden</text>
    <rect x="170" y="112" width="58" height="26" rx="5" fill="#10b981" fill-opacity=".2" class="gf-seq gf-s2"/><text x="186" y="129">S0</text>
    <rect x="232" y="112" width="54" height="26" rx="5" fill="#10b981" fill-opacity=".2" class="gf-seq gf-s2"/><text x="246" y="129">S1</text>
  </g>
  <text x="44" y="158" font-size="9.5" fill="currentColor" opacity=".75">new objects land in Eden · minor GC is</text>
  <text x="44" y="172" font-size="9.5" fill="currentColor" opacity=".75">frequent and fast (most objects die here)</text>

  <rect x="312" y="82" width="128" height="98" rx="9" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="326" y="102" font-size="11" font-weight="700" fill="currentColor">Old gen</text>
  <text x="326" y="122" font-size="9.5" fill="currentColor" opacity=".75">survivors promoted</text>
  <text x="326" y="136" font-size="9.5" fill="currentColor" opacity=".75">after N collections</text>
  <text x="326" y="158" font-size="9.5" fill="currentColor" opacity=".75">major GC — rarer,</text>
  <text x="326" y="172" font-size="9.5" fill="currentColor" opacity=".75">much more expensive</text>

  <!-- per thread -->
  <rect x="466" y="34" width="280" height="160" rx="12" fill="#3b82f6" fill-opacity=".08" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="482" y="56" font-size="12" font-weight="700" fill="#3b82f6">Per thread — not GC'd</text>
  <g font-size="10" fill="currentColor">
    <rect x="482" y="68" width="248" height="30" rx="6" fill="#3b82f6" fill-opacity=".18"/>
    <text x="494" y="88">JVM stack — frames, locals (-Xss)</text>
    <rect x="482" y="104" width="248" height="30" rx="6" fill="#3b82f6" fill-opacity=".18"/>
    <text x="494" y="124">PC register — current instruction</text>
    <rect x="482" y="140" width="248" height="30" rx="6" fill="#3b82f6" fill-opacity=".18"/>
    <text x="494" y="160">Native method stack — JNI</text>
  </g>
  <text x="482" y="186" font-size="9.5" fill="currentColor" opacity=".7">reclaimed when the frame pops / thread ends</text>

  <!-- native -->
  <rect x="14" y="206" width="732" height="100" rx="12" fill="#8b5cf6" fill-opacity=".08" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="30" y="228" font-size="12" font-weight="700" fill="#8b5cf6">Native memory — OUTSIDE the heap, and outside -Xmx</text>
  <g font-size="10" fill="currentColor">
    <rect x="30" y="238" width="228" height="26" rx="5" fill="#8b5cf6" fill-opacity=".18"/><text x="42" y="255">Metaspace — class metadata, statics</text>
    <rect x="266" y="238" width="228" height="26" rx="5" fill="#8b5cf6" fill-opacity=".18"/><text x="278" y="255">Code cache — JIT-compiled native code</text>
    <rect x="502" y="238" width="228" height="26" rx="5" fill="#8b5cf6" fill-opacity=".18"/><text x="514" y="255">Direct buffers, thread stacks, GC data</text>
  </g>
  <text x="30" y="284" font-size="10.5" fill="currentColor" opacity=".85">This row is why a container gets OOM-killed while the heap graph looks healthy: the kernel counts all of it,</text>
  <text x="30" y="300" font-size="10.5" fill="currentColor" opacity=".85">and none of it is bounded by -Xmx. Metaspace replaced the fixed-size PermGen in Java 8.</text>
</svg>
