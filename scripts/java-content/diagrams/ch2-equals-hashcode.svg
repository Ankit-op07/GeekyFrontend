<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch2ehRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/>
    </marker>
    <marker id="ch2ehGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">Override equals() without hashCode() and your object vanishes inside a HashMap</text>

  <!-- broken -->
  <text x="14" y="48" font-size="12" font-weight="700" fill="#f43f5e">✘ equals() overridden, hashCode() inherited from Object</text>

  <rect x="14" y="60" width="180" height="46" rx="9" fill="#f43f5e" fill-opacity=".12" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="30" y="80" font-size="11" fill="currentColor">put(new Key("A"), 1)</text>
  <text x="30" y="98" font-size="10.5" fill="currentColor" opacity=".7">hashCode() → 8812</text>

  <rect x="14" y="118" width="180" height="46" rx="9" fill="#f43f5e" fill-opacity=".12" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="30" y="138" font-size="11" fill="currentColor">get(new Key("A"))</text>
  <text x="30" y="156" font-size="10.5" fill="currentColor" opacity=".7">hashCode() → 4471</text>

  <path d="M198 82 L266 82" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#ch2ehRed)"/>
  <path d="M198 140 L266 140" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#ch2ehRed)" class="gf-dash"/>

  <!-- buckets broken -->
  <rect x="274" y="56" width="230" height="112" rx="10" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".2"/>
  <text x="288" y="76" font-size="10.5" font-weight="600" fill="currentColor" opacity=".7">buckets</text>
  <rect x="288" y="84" width="202" height="24" rx="5" fill="#10b981" fill-opacity=".25"/>
  <text x="300" y="101" font-size="10.5" fill="currentColor">bucket 12  →  Key("A") = 1</text>
  <rect x="288" y="114" width="202" height="24" rx="5" fill="#f43f5e" fill-opacity=".2"/>
  <text x="300" y="131" font-size="10.5" fill="currentColor">bucket 7   →  (empty)</text>
  <text x="288" y="158" font-size="10.5" fill="#f43f5e" font-weight="600">different hash → different bucket → never even compared</text>

  <rect x="524" y="90" width="222" height="46" rx="9" fill="#f43f5e" fill-opacity=".16" stroke="#f43f5e" stroke-width="1.3" class="gf-pulse"/>
  <text x="540" y="110" font-size="12" font-weight="700" fill="#f43f5e">returns null</text>
  <text x="540" y="128" font-size="10.5" fill="currentColor" opacity=".8">even though equals() says they match</text>

  <line x1="14" y1="184" x2="746" y2="184" stroke="currentColor" stroke-opacity=".15"/>

  <!-- fixed -->
  <text x="14" y="208" font-size="12" font-weight="700" fill="#10b981">✔ both overridden, consistently on the same fields</text>

  <rect x="14" y="220" width="180" height="46" rx="9" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-width="1.2"/>
  <text x="30" y="240" font-size="11" fill="currentColor">put(new Key("A"), 1)</text>
  <text x="30" y="258" font-size="10.5" fill="currentColor" opacity=".7">hashCode() → 8812</text>

  <rect x="14" y="276" width="180" height="46" rx="9" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-width="1.2"/>
  <text x="30" y="296" font-size="11" fill="currentColor">get(new Key("A"))</text>
  <text x="30" y="314" font-size="10.5" fill="currentColor" opacity=".7">hashCode() → 8812</text>

  <path d="M198 242 L266 242" stroke="#10b981" stroke-width="1.5" marker-end="url(#ch2ehGreen)"/>
  <path d="M198 298 L266 298" stroke="#10b981" stroke-width="1.5" marker-end="url(#ch2ehGreen)" class="gf-dash"/>

  <rect x="274" y="230" width="230" height="80" rx="10" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".2"/>
  <rect x="288" y="244" width="202" height="24" rx="5" fill="#10b981" fill-opacity=".25"/>
  <text x="300" y="261" font-size="10.5" fill="currentColor">bucket 12  →  Key("A") = 1</text>
  <text x="288" y="292" font-size="10.5" fill="#10b981" font-weight="600">same bucket → then equals() confirms → hit</text>

  <rect x="524" y="252" width="222" height="46" rx="9" fill="#10b981" fill-opacity=".18" stroke="#10b981" stroke-width="1.3" class="gf-pulse"/>
  <text x="540" y="272" font-size="12" font-weight="700" fill="#10b981">returns 1</text>
  <text x="540" y="290" font-size="10.5" fill="currentColor" opacity=".8">hashCode finds the bucket, equals confirms the key</text>
</svg>
