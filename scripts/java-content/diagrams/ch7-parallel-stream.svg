<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch7psArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">parallelStream(): split → process on the common ForkJoinPool → combine</text>

  <rect x="290" y="34" width="180" height="30" rx="7" fill="#3b82f6" fill-opacity=".22" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="326" y="54" font-size="11" font-weight="700" fill="currentColor">source (spliterator)</text>

  <path d="M340 66 L200 92" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch7psArrow)"/>
  <path d="M380 66 L380 92" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch7psArrow)"/>
  <path d="M420 66 L560 92" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch7psArrow)"/>

  <g font-size="10.5" fill="currentColor">
    <rect x="120" y="94" width="160" height="52" rx="8" fill="#10b981" fill-opacity=".18" stroke="#10b981" stroke-width="1.1" class="gf-seq gf-s1"/>
    <text x="134" y="114" font-weight="600">worker-1</text><text x="134" y="132">chunk A</text>
    <rect x="300" y="94" width="160" height="52" rx="8" fill="#10b981" fill-opacity=".18" stroke="#10b981" stroke-width="1.1" class="gf-seq gf-s2"/>
    <text x="314" y="114" font-weight="600">worker-2</text><text x="314" y="132">chunk B</text>
    <rect x="480" y="94" width="160" height="52" rx="8" fill="#10b981" fill-opacity=".18" stroke="#10b981" stroke-width="1.1" class="gf-seq gf-s3"/>
    <text x="494" y="114" font-weight="600">worker-3</text><text x="494" y="132">chunk C</text>
  </g>

  <path d="M200 148 L340 174" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch7psArrow)"/>
  <path d="M380 148 L380 174" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch7psArrow)"/>
  <path d="M560 148 L420 174" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch7psArrow)"/>

  <rect x="290" y="176" width="180" height="30" rx="7" fill="#8b5cf6" fill-opacity=".22" stroke="#8b5cf6" stroke-width="1.2" class="gf-seq gf-s4"/>
  <text x="330" y="196" font-size="11" font-weight="700" fill="currentColor">combine → result</text>

  <rect x="14" y="220" width="360" height="72" rx="10" fill="#10b981" fill-opacity=".08" stroke="#10b981" stroke-width="1.2"/>
  <text x="30" y="240" font-size="10.5" font-weight="700" fill="#10b981">Worth it when ALL of these hold</text>
  <text x="30" y="258" font-size="10" fill="currentColor" opacity=".85">• large N (tens of thousands+) and CPU-bound work</text>
  <text x="30" y="274" font-size="10" fill="currentColor" opacity=".85">• cheaply splittable source: array, ArrayList, IntStream.range</text>
  <text x="30" y="288" font-size="10" fill="currentColor" opacity=".85">• stateless, side-effect-free, associative operations</text>

  <rect x="386" y="220" width="360" height="72" rx="10" fill="#f43f5e" fill-opacity=".08" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="402" y="240" font-size="10.5" font-weight="700" fill="#f43f5e">Actively harmful when</text>
  <text x="402" y="258" font-size="10" fill="currentColor" opacity=".85">• the work is I/O-bound — it blocks the SHARED common pool</text>
  <text x="402" y="274" font-size="10" fill="currentColor" opacity=".85">• the source splits badly: LinkedList, Stream.iterate, BufferedReader</text>
  <text x="402" y="288" font-size="10" fill="currentColor" opacity=".85">• you are inside a web request — one pool serves the whole JVM</text>
</svg>
