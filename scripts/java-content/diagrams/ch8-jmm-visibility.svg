<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch8jmmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">Visibility: a write by one thread is not automatically seen by another</text>

  <!-- without volatile -->
  <rect x="14" y="34" width="360" height="192" rx="12" fill="#f43f5e" fill-opacity=".07" stroke="#f43f5e" stroke-width="1.3"/>
  <text x="30" y="56" font-size="11.5" font-weight="700" fill="#f43f5e">✘ plain field</text>

  <rect x="30" y="68" width="150" height="60" rx="8" fill="#3b82f6" fill-opacity=".16" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="44" y="88" font-size="10.5" font-weight="600" fill="#3b82f6">Thread A · core 1</text>
  <text x="44" y="106" font-size="10" fill="currentColor">cache: running = false</text>
  <text x="44" y="120" font-size="10" fill="currentColor" opacity=".7">writes false</text>

  <rect x="210" y="68" width="150" height="60" rx="8" fill="#f59e0b" fill-opacity=".16" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="224" y="88" font-size="10.5" font-weight="600" fill="#f59e0b">Thread B · core 2</text>
  <text x="224" y="106" font-size="10" fill="currentColor">cache: running = <tspan font-weight="700" fill="#f43f5e">true</tspan></text>
  <text x="224" y="120" font-size="10" fill="currentColor" opacity=".7">still spinning</text>

  <rect x="30" y="140" width="330" height="36" rx="7" fill="currentColor" fill-opacity=".07" stroke="currentColor" stroke-opacity=".2"/>
  <text x="44" y="163" font-size="10.5" fill="currentColor" opacity=".8">main memory: running = ? (write not flushed)</text>

  <text x="30" y="196" font-size="10.5" fill="currentColor" opacity=".85">B may loop forever. The JIT is also free to hoist the</text>
  <text x="30" y="212" font-size="10.5" fill="currentColor" opacity=".85">read out of the loop entirely — it sees no reason to re-read.</text>

  <!-- with volatile -->
  <rect x="386" y="34" width="360" height="192" rx="12" fill="#10b981" fill-opacity=".07" stroke="#10b981" stroke-width="1.3"/>
  <text x="402" y="56" font-size="11.5" font-weight="700" fill="#10b981">✔ volatile field</text>

  <rect x="402" y="68" width="150" height="60" rx="8" fill="#3b82f6" fill-opacity=".16" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="416" y="88" font-size="10.5" font-weight="600" fill="#3b82f6">Thread A · core 1</text>
  <text x="416" y="106" font-size="10" fill="currentColor">writes false</text>
  <text x="416" y="120" font-size="10" fill="currentColor" opacity=".7">→ straight to memory</text>

  <rect x="582" y="68" width="150" height="60" rx="8" fill="#f59e0b" fill-opacity=".16" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="596" y="88" font-size="10.5" font-weight="600" fill="#f59e0b">Thread B · core 2</text>
  <text x="596" y="106" font-size="10" fill="currentColor">reads from memory</text>
  <text x="596" y="120" font-size="10" fill="currentColor" opacity=".7">sees false, exits</text>

  <path d="M478 132 L478 152" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ch8jmmArrow)" class="gf-dash"/>
  <path d="M658 152 L658 132" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ch8jmmArrow)" class="gf-dash"/>
  <rect x="402" y="154" width="330" height="36" rx="7" fill="#10b981" fill-opacity=".2" stroke="#10b981" stroke-width="1.1" class="gf-pulse"/>
  <text x="416" y="177" font-size="10.5" fill="currentColor">main memory: running = false — always read, never cached</text>

  <text x="402" y="212" font-size="10.5" fill="currentColor" opacity=".85">volatile also forbids reordering across the access.</text>

  <rect x="14" y="238" width="732" height="66" rx="10" fill="#8b5cf6" fill-opacity=".08" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="30" y="258" font-size="11" font-weight="700" fill="#8b5cf6">What volatile does NOT give you</text>
  <text x="30" y="278" font-size="10.5" fill="currentColor" opacity=".85"><tspan font-weight="600">Atomicity.</tspan> volatile int count; count++ is still read-modify-write and still races — visibility is not mutual exclusion.</text>
  <text x="30" y="296" font-size="10.5" fill="currentColor" opacity=".85">Use it for a flag one thread writes and others read. For a counter use AtomicInteger; for compound state use a lock.</text>
</svg>
