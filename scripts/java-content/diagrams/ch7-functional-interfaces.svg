<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">The four shapes almost every lambda in Java fits into</text>
  <text x="14" y="40" font-size="11" fill="currentColor" opacity=".7">Everything else in java.util.function is a variation on arity or primitives.</text>

  <g class="gf-seq gf-s1">
    <rect x="14" y="54" width="176" height="120" rx="11" fill="#3b82f6" fill-opacity=".12" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="30" y="76" font-size="12" font-weight="700" fill="#3b82f6">Function&lt;T,R&gt;</text>
    <text x="30" y="96" font-size="10.5" fill="currentColor" opacity=".8">R apply(T t)</text>
    <text x="30" y="118" font-size="10.5" fill="currentColor">takes one, returns another</text>
    <rect x="30" y="128" width="144" height="30" rx="6" fill="#3b82f6" fill-opacity=".2"/>
    <text x="42" y="148" font-size="10.5" fill="currentColor">s -&gt; s.length()</text>
  </g>

  <g class="gf-seq gf-s2">
    <rect x="200" y="54" width="176" height="120" rx="11" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-width="1.3"/>
    <text x="216" y="76" font-size="12" font-weight="700" fill="#10b981">Predicate&lt;T&gt;</text>
    <text x="216" y="96" font-size="10.5" fill="currentColor" opacity=".8">boolean test(T t)</text>
    <text x="216" y="118" font-size="10.5" fill="currentColor">takes one, answers yes/no</text>
    <rect x="216" y="128" width="144" height="30" rx="6" fill="#10b981" fill-opacity=".2"/>
    <text x="228" y="148" font-size="10.5" fill="currentColor">s -&gt; !s.isBlank()</text>
  </g>

  <g class="gf-seq gf-s3">
    <rect x="386" y="54" width="176" height="120" rx="11" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="402" y="76" font-size="12" font-weight="700" fill="#f59e0b">Consumer&lt;T&gt;</text>
    <text x="402" y="96" font-size="10.5" fill="currentColor" opacity=".8">void accept(T t)</text>
    <text x="402" y="118" font-size="10.5" fill="currentColor">takes one, returns nothing</text>
    <rect x="402" y="128" width="144" height="30" rx="6" fill="#f59e0b" fill-opacity=".2"/>
    <text x="414" y="148" font-size="10.5" fill="currentColor">s -&gt; log.info(s)</text>
  </g>

  <g class="gf-seq gf-s4">
    <rect x="572" y="54" width="174" height="120" rx="11" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-width="1.3"/>
    <text x="588" y="76" font-size="12" font-weight="700" fill="#8b5cf6">Supplier&lt;T&gt;</text>
    <text x="588" y="96" font-size="10.5" fill="currentColor" opacity=".8">T get()</text>
    <text x="588" y="118" font-size="10.5" fill="currentColor">takes nothing, produces one</text>
    <rect x="588" y="128" width="142" height="30" rx="6" fill="#8b5cf6" fill-opacity=".2"/>
    <text x="600" y="148" font-size="10.5" fill="currentColor">() -&gt; new User()</text>
  </g>

  <rect x="14" y="188" width="732" height="80" rx="10" fill="currentColor" fill-opacity=".04" stroke="currentColor" stroke-opacity=".18"/>
  <text x="30" y="210" font-size="11" font-weight="700" fill="currentColor">The variations you will meet</text>
  <g font-size="10.5" fill="currentColor" opacity=".85">
    <text x="30" y="230">BiFunction&lt;T,U,R&gt; · BiPredicate · BiConsumer — two arguments</text>
    <text x="30" y="248">UnaryOperator&lt;T&gt; = Function&lt;T,T&gt;   ·   BinaryOperator&lt;T&gt; = BiFunction&lt;T,T,T&gt;</text>
    <text x="400" y="230">IntPredicate · ToIntFunction · IntSupplier — <tspan font-weight="600">no boxing</tspan></text>
    <text x="400" y="248">Runnable (nothing in, nothing out) · Callable&lt;V&gt; (may throw)</text>
  </g>
</svg>
