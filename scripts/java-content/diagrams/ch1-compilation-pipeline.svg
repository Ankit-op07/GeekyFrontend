<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch1cpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="24" font-size="13" font-weight="700" fill="currentColor">Compile once, then interpret + JIT-compile at run time</text>

  <!-- .java -->
  <g class="gf-seq gf-s1">
    <rect x="14" y="48" width="140" height="70" rx="10" fill="#3b82f6" fill-opacity=".14" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="30" y="74" font-size="12.5" font-weight="600" fill="#3b82f6">Main.java</text>
    <text x="30" y="94" font-size="11" fill="currentColor" opacity=".7">Source you write</text>
    <text x="30" y="110" font-size="11" fill="currentColor" opacity=".7">(plain text)</text>
  </g>

  <line x1="158" y1="83" x2="202" y2="83" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ch1cpArrow)" class="gf-dash"/>
  <text x="152" y="72" font-size="10.5" fill="currentColor" opacity=".6">javac</text>

  <!-- .class -->
  <g class="gf-seq gf-s2">
    <rect x="206" y="48" width="150" height="70" rx="10" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-width="1.4"/>
    <text x="222" y="74" font-size="12.5" font-weight="600" fill="#8b5cf6">Main.class</text>
    <text x="222" y="94" font-size="11" fill="currentColor" opacity=".7">Bytecode — portable,</text>
    <text x="222" y="110" font-size="11" fill="currentColor" opacity=".7">not machine code</text>
  </g>

  <line x1="360" y1="83" x2="404" y2="83" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ch1cpArrow)" class="gf-dash"/>
  <text x="356" y="72" font-size="10.5" fill="currentColor" opacity=".6">java</text>

  <!-- JVM box -->
  <g class="gf-seq gf-s3">
    <rect x="408" y="40" width="338" height="140" rx="12" fill="#10b981" fill-opacity=".10" stroke="#10b981" stroke-width="1.5"/>
    <text x="424" y="62" font-size="12.5" font-weight="700" fill="#10b981">JVM</text>

    <rect x="424" y="74" width="140" height="42" rx="8" fill="#10b981" fill-opacity=".16"/>
    <text x="438" y="92" font-size="11.5" font-weight="600" fill="currentColor">Class loader</text>
    <text x="438" y="108" font-size="10.5" fill="currentColor" opacity=".7">load → link → init</text>

    <rect x="580" y="74" width="150" height="42" rx="8" fill="#10b981" fill-opacity=".16"/>
    <text x="594" y="92" font-size="11.5" font-weight="600" fill="currentColor">Interpreter</text>
    <text x="594" y="108" font-size="10.5" fill="currentColor" opacity=".7">runs bytecode now</text>

    <rect x="424" y="126" width="306" height="42" rx="8" fill="#f59e0b" fill-opacity=".18" stroke="#f59e0b" stroke-width="1"/>
    <text x="438" y="144" font-size="11.5" font-weight="600" fill="#f59e0b">JIT compiler</text>
    <text x="510" y="144" font-size="10.5" fill="currentColor" opacity=".75">— spots hot methods and compiles them</text>
    <text x="438" y="160" font-size="10.5" fill="currentColor" opacity=".75">to native code, so long-running Java approaches native speed.</text>
  </g>

  <line x1="577" y1="200" x2="577" y2="228" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ch1cpArrow)"/>
  <g class="gf-seq gf-s4">
    <rect x="408" y="196" width="338" height="0" rx="0" fill="none"/>
    <text x="424" y="212" font-size="11.5" fill="currentColor" opacity=".8">Native instructions for THIS machine</text>
  </g>

  <text x="14" y="212" font-size="11.5" fill="currentColor" opacity=".75">Java is both compiled <tspan font-weight="600">and</tspan> interpreted — the honest answer to a classic question.</text>
  <text x="14" y="232" font-size="11.5" fill="currentColor" opacity=".75">javac compiles to bytecode; the JVM interprets it, then JITs the hot paths to native code.</text>
</svg>
