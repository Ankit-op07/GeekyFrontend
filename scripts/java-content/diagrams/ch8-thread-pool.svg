<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch8tpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">ThreadPoolExecutor: the order it makes decisions is NOT what most people assume</text>

  <!-- submit -->
  <rect x="14" y="36" width="120" height="40" rx="8" fill="#3b82f6" fill-opacity=".2" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="34" y="61" font-size="11" font-weight="700" fill="currentColor">submit(task)</text>
  <path d="M138 56 L172 56" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ch8tpArrow)" class="gf-dash"/>

  <g class="gf-seq gf-s1">
    <rect x="176" y="36" width="230" height="40" rx="8" fill="#10b981" fill-opacity=".18" stroke="#10b981" stroke-width="1.2"/>
    <text x="192" y="54" font-size="10.5" font-weight="700" fill="#10b981">1 · fewer than corePoolSize threads?</text>
    <text x="192" y="70" font-size="10" fill="currentColor" opacity=".8">→ start a NEW thread, even if others are idle</text>
  </g>
  <path d="M291 80 L291 100" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ch8tpArrow)"/>

  <g class="gf-seq gf-s2">
    <rect x="176" y="104" width="230" height="40" rx="8" fill="#f59e0b" fill-opacity=".18" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="192" y="122" font-size="10.5" font-weight="700" fill="#f59e0b">2 · else QUEUE the task</text>
    <text x="192" y="138" font-size="10" fill="currentColor" opacity=".8">the queue fills before any extra thread starts</text>
  </g>
  <path d="M291 148 L291 168" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ch8tpArrow)"/>

  <g class="gf-seq gf-s3">
    <rect x="176" y="172" width="230" height="40" rx="8" fill="#8b5cf6" fill-opacity=".18" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="192" y="190" font-size="10.5" font-weight="700" fill="#8b5cf6">3 · queue full? grow to maxPoolSize</text>
    <text x="192" y="206" font-size="10" fill="currentColor" opacity=".8">extra threads die after keepAliveTime</text>
  </g>
  <path d="M291 216 L291 236" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ch8tpArrow)"/>

  <g class="gf-seq gf-s4">
    <rect x="176" y="240" width="230" height="40" rx="8" fill="#f43f5e" fill-opacity=".18" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="192" y="258" font-size="10.5" font-weight="700" fill="#f43f5e">4 · still full? RejectedExecutionHandler</text>
    <text x="192" y="274" font-size="10" fill="currentColor" opacity=".8">Abort (default) · CallerRuns · Discard · DiscardOldest</text>
  </g>

  <!-- workers -->
  <rect x="438" y="36" width="308" height="120" rx="10" fill="#10b981" fill-opacity=".08" stroke="#10b981" stroke-width="1.2"/>
  <text x="454" y="56" font-size="11" font-weight="700" fill="#10b981">worker threads</text>
  <g font-size="10" fill="currentColor">
    <rect x="454" y="66" width="130" height="34" rx="6" fill="#10b981" fill-opacity=".2"/><text x="468" y="88">pool-1-thread-1</text>
    <rect x="600" y="66" width="130" height="34" rx="6" fill="#10b981" fill-opacity=".2"/><text x="614" y="88">pool-1-thread-2</text>
    <rect x="454" y="108" width="130" height="34" rx="6" fill="#10b981" fill-opacity=".2"/><text x="468" y="130">pool-1-thread-3</text>
    <rect x="600" y="108" width="130" height="34" rx="6" fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-opacity=".2" stroke-dasharray="3 3"/><text x="614" y="130" opacity=".55">idle</text>
  </g>

  <rect x="438" y="168" width="308" height="112" rx="10" fill="#f43f5e" fill-opacity=".08" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="454" y="188" font-size="11" font-weight="700" fill="#f43f5e">Why Executors.newFixedThreadPool is a trap</text>
  <text x="454" y="208" font-size="10" fill="currentColor" opacity=".85">It uses an UNBOUNDED LinkedBlockingQueue.</text>
  <text x="454" y="224" font-size="10" fill="currentColor" opacity=".85">Step 3 therefore never happens, and step 4 never happens —</text>
  <text x="454" y="240" font-size="10" fill="currentColor" opacity=".85">the queue just grows until the heap is gone.</text>
  <text x="454" y="262" font-size="10" fill="currentColor" opacity=".85">newCachedThreadPool is worse: maxPoolSize is</text>
  <text x="454" y="276" font-size="10" fill="currentColor" opacity=".85">Integer.MAX_VALUE — unbounded THREADS.</text>

  <text x="14" y="302" font-size="10.5" fill="currentColor" opacity=".85">Construct <tspan font-weight="700">ThreadPoolExecutor</tspan> directly with a bounded queue and a rejection policy. CallerRunsPolicy gives natural backpressure.</text>
</svg>
