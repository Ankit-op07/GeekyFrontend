<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">Overloading is decided by the compiler. Overriding is decided at run time.</text>

  <!-- Overloading -->
  <rect x="14" y="40" width="356" height="242" rx="12" fill="#3b82f6" fill-opacity=".08" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="32" y="64" font-size="12.5" font-weight="700" fill="#3b82f6">Overloading — static / compile-time binding</text>
  <text x="32" y="82" font-size="10.5" fill="currentColor" opacity=".65">same name, different parameter list, same class</text>

  <rect x="32" y="94" width="320" height="26" rx="6" fill="#3b82f6" fill-opacity=".14"/>
  <text x="46" y="112" font-size="11" fill="currentColor">print(int x)</text>
  <rect x="32" y="126" width="320" height="26" rx="6" fill="#3b82f6" fill-opacity=".14"/>
  <text x="46" y="144" font-size="11" fill="currentColor">print(String s)</text>
  <rect x="32" y="158" width="320" height="26" rx="6" fill="#3b82f6" fill-opacity=".14"/>
  <text x="46" y="176" font-size="11" fill="currentColor">print(int x, int y)</text>

  <rect x="32" y="196" width="320" height="70" rx="8" fill="#3b82f6" fill-opacity=".2" stroke="#3b82f6" stroke-width="1" class="gf-pulse"/>
  <text x="46" y="216" font-size="11" font-weight="600" fill="currentColor">print(5)</text>
  <text x="46" y="234" font-size="10.5" fill="currentColor" opacity=".8">javac picks print(int) — from the STATIC type</text>
  <text x="46" y="252" font-size="10.5" fill="currentColor" opacity=".8">of the argument, before the program ever runs.</text>

  <!-- Overriding -->
  <rect x="390" y="40" width="356" height="242" rx="12" fill="#f59e0b" fill-opacity=".08" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="408" y="64" font-size="12.5" font-weight="700" fill="#f59e0b">Overriding — dynamic / run-time binding</text>
  <text x="408" y="82" font-size="10.5" fill="currentColor" opacity=".65">same signature, subclass replaces the superclass version</text>

  <rect x="408" y="94" width="320" height="26" rx="6" fill="#f59e0b" fill-opacity=".14"/>
  <text x="422" y="112" font-size="11" fill="currentColor">Animal.speak()</text>
  <rect x="408" y="126" width="320" height="26" rx="6" fill="#f59e0b" fill-opacity=".14"/>
  <text x="422" y="144" font-size="11" fill="currentColor">Dog.speak()      @Override</text>
  <rect x="408" y="158" width="320" height="26" rx="6" fill="#f59e0b" fill-opacity=".14"/>
  <text x="422" y="176" font-size="11" fill="currentColor">Cat.speak()      @Override</text>

  <rect x="408" y="196" width="320" height="70" rx="8" fill="#f59e0b" fill-opacity=".2" stroke="#f59e0b" stroke-width="1" class="gf-pulse"/>
  <text x="422" y="216" font-size="11" font-weight="600" fill="currentColor">Animal a = new Dog();  a.speak();</text>
  <text x="422" y="234" font-size="10.5" fill="currentColor" opacity=".8">The reference type is Animal, but the JVM looks at</text>
  <text x="422" y="252" font-size="10.5" fill="currentColor" opacity=".8">the OBJECT — Dog — and calls Dog.speak().</text>
</svg>
