<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch12nArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">The N+1 problem: one query to fetch the list, then one MORE per element</text>
  <text x="14" y="40" font-size="11" fill="currentColor" opacity=".7">for (Order o : orders) { o.getCustomer().getName(); }   ← the loop is innocent; the mapping is not</text>

  <!-- bad -->
  <rect x="14" y="54" width="360" height="164" rx="12" fill="#f43f5e" fill-opacity=".07" stroke="#f43f5e" stroke-width="1.3"/>
  <text x="30" y="76" font-size="11.5" font-weight="700" fill="#f43f5e">✘ lazy association, accessed in a loop</text>

  <g font-size="10" fill="currentColor">
    <rect x="30" y="86" width="328" height="24" rx="5" fill="#f43f5e" fill-opacity=".22" class="gf-seq gf-s1"/>
    <text x="42" y="103">SELECT * FROM orders                    ← 1 query</text>
    <rect x="30" y="114" width="328" height="22" rx="5" fill="#f43f5e" fill-opacity=".14" class="gf-seq gf-s2"/>
    <text x="42" y="130">SELECT * FROM customers WHERE id = 1</text>
    <rect x="30" y="140" width="328" height="22" rx="5" fill="#f43f5e" fill-opacity=".14" class="gf-seq gf-s3"/>
    <text x="42" y="156">SELECT * FROM customers WHERE id = 2</text>
    <rect x="30" y="166" width="328" height="22" rx="5" fill="#f43f5e" fill-opacity=".14" class="gf-seq gf-s4"/>
    <text x="42" y="182">… once per order                        ← N queries</text>
  </g>
  <text x="30" y="208" font-size="10.5" font-weight="700" fill="#f43f5e">100 orders → 101 round trips. Fast in dev with 5 rows.</text>

  <path d="M378 136 L406 136" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#ch12nArrow)" class="gf-dash"/>

  <!-- fixes -->
  <rect x="414" y="54" width="332" height="164" rx="12" fill="#10b981" fill-opacity=".07" stroke="#10b981" stroke-width="1.3"/>
  <text x="430" y="76" font-size="11.5" font-weight="700" fill="#10b981">✔ four fixes, best first</text>
  <g font-size="10" fill="currentColor">
    <rect x="430" y="86" width="300" height="28" rx="5" fill="#10b981" fill-opacity=".2"/>
    <text x="442" y="98" font-weight="600">JOIN FETCH in JPQL</text>
    <text x="442" y="110" opacity=".8">…FROM Order o JOIN FETCH o.customer</text>

    <rect x="430" y="118" width="300" height="28" rx="5" fill="#10b981" fill-opacity=".16"/>
    <text x="442" y="130" font-weight="600">@EntityGraph on the repository method</text>
    <text x="442" y="142" opacity=".8">declarative, no query string</text>

    <rect x="430" y="150" width="300" height="28" rx="5" fill="#10b981" fill-opacity=".16"/>
    <text x="442" y="162" font-weight="600">@BatchSize(size = 50)</text>
    <text x="442" y="174" opacity=".8">N queries → N/50 — good for collections</text>

    <rect x="430" y="182" width="300" height="26" rx="5" fill="#3b82f6" fill-opacity=".16"/>
    <text x="442" y="199" font-weight="600">a DTO projection — fetch only what you need</text>
  </g>

  <rect x="14" y="230" width="732" height="42" rx="9" fill="#f59e0b" fill-opacity=".1" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="30" y="248" font-size="10.5" font-weight="700" fill="#f59e0b">⚠ EAGER is NOT the fix</text>
  <text x="150" y="248" font-size="10.5" fill="currentColor" opacity=".85">— it just moves the N+1 to every query that touches the entity, whether you need the association or not.</text>
  <text x="30" y="265" font-size="10.5" fill="currentColor" opacity=".85">Keep associations LAZY and fetch eagerly <tspan font-weight="600">per query</tspan>. Detect it by logging SQL and counting statements in tests.</text>
</svg>
