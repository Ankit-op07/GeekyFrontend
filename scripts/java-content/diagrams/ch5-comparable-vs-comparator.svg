<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">One natural order lives inside the class. Every other order lives outside it.</text>

  <!-- Comparable -->
  <rect x="14" y="34" width="360" height="222" rx="12" fill="#8b5cf6" fill-opacity=".08" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="30" y="58" font-size="12" font-weight="700" fill="#8b5cf6">Comparable&lt;T&gt;  —  inside</text>

  <rect x="30" y="70" width="328" height="72" rx="8" fill="#8b5cf6" fill-opacity=".16"/>
  <text x="44" y="90" font-size="10.5" fill="currentColor">class Employee implements Comparable&lt;Employee&gt; {</text>
  <text x="44" y="108" font-size="10.5" fill="currentColor">    public int compareTo(Employee o) {</text>
  <text x="44" y="124" font-size="10.5" fill="currentColor">        return Integer.compare(id, o.id);</text>
  <text x="44" y="138" font-size="10.5" fill="currentColor">    } }</text>

  <g font-size="10.5" fill="currentColor">
    <text x="30" y="166">• ONE ordering per class — the "natural" one</text>
    <text x="30" y="186">• Modifies the class; needs its source</text>
    <text x="30" y="206">• Used by Collections.sort(list) with no argument,</text>
    <text x="30" y="222">  and by TreeMap / TreeSet when no Comparator is given</text>
    <text x="30" y="244" opacity=".75">Pick it only when there is an obvious, universal order.</text>
  </g>

  <!-- Comparator -->
  <rect x="386" y="34" width="360" height="222" rx="12" fill="#10b981" fill-opacity=".08" stroke="#10b981" stroke-width="1.4"/>
  <text x="402" y="58" font-size="12" font-weight="700" fill="#10b981">Comparator&lt;T&gt;  —  outside</text>

  <rect x="402" y="70" width="328" height="72" rx="8" fill="#10b981" fill-opacity=".16"/>
  <text x="416" y="90" font-size="10.5" fill="currentColor">list.sort(</text>
  <text x="416" y="108" font-size="10.5" fill="currentColor">    Comparator.comparing(Employee::dept)</text>
  <text x="416" y="124" font-size="10.5" fill="currentColor">        .thenComparing(Employee::salary).reversed()</text>
  <text x="416" y="138" font-size="10.5" fill="currentColor">);</text>

  <g font-size="10.5" fill="currentColor">
    <text x="402" y="166">• MANY orderings, chosen at the call site</text>
    <text x="402" y="186">• Needs no access to the class at all</text>
    <text x="402" y="206">• Composable: comparing → thenComparing → reversed</text>
    <text x="402" y="222">• A functional interface, so a lambda works</text>
    <text x="402" y="244" opacity=".75">The default choice in modern Java.</text>
  </g>

  <rect x="14" y="0" width="0" height="0"/>
</svg>
