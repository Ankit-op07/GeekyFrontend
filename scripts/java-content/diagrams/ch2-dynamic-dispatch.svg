<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch2ddArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/>
    </marker>
    <marker id="ch2ddGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">The reference type decides WHAT YOU MAY CALL. The object decides WHICH CODE RUNS.</text>
  <text x="14" y="42" font-size="11.5" fill="currentColor" opacity=".7">Animal a = new Dog();</text>

  <!-- reference -->
  <rect x="14" y="58" width="196" height="60" rx="10" fill="#3b82f6" fill-opacity=".14" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="30" y="80" font-size="11.5" font-weight="700" fill="#3b82f6">a  —  static type Animal</text>
  <text x="30" y="100" font-size="10.5" fill="currentColor" opacity=".75">compile-time view</text>
  <circle cx="188" cy="98" r="7" fill="#f43f5e" class="gf-pulse"/>

  <path d="M212 98 L282 98" stroke="#f43f5e" stroke-width="1.6" marker-end="url(#ch2ddArrow)" class="gf-dash"/>

  <!-- object -->
  <rect x="290" y="52" width="200" height="72" rx="10" fill="#10b981" fill-opacity=".16" stroke="#10b981" stroke-width="1.4"/>
  <text x="306" y="74" font-size="11.5" font-weight="700" fill="currentColor">Dog@1f3a</text>
  <text x="306" y="94" font-size="10.5" fill="currentColor" opacity=".75">runtime type: Dog</text>
  <text x="306" y="112" font-size="10.5" fill="currentColor" opacity=".75">the JVM asks THIS what to run</text>

  <!-- method table -->
  <rect x="522" y="52" width="224" height="150" rx="10" fill="#8b5cf6" fill-opacity=".10" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="538" y="74" font-size="11.5" font-weight="700" fill="#8b5cf6">Dog's method table</text>
  <rect x="538" y="84" width="192" height="26" rx="6" fill="#10b981" fill-opacity=".26"/>
  <text x="550" y="102" font-size="11" fill="currentColor">speak()  →  Dog.speak</text>
  <rect x="538" y="116" width="192" height="26" rx="6" fill="#94a3b8" fill-opacity=".18"/>
  <text x="550" y="134" font-size="11" fill="currentColor">eat()    →  Animal.eat</text>
  <rect x="538" y="148" width="192" height="26" rx="6" fill="#10b981" fill-opacity=".26"/>
  <text x="550" y="166" font-size="11" fill="currentColor">fetch()  →  Dog.fetch</text>

  <!-- calls -->
  <rect x="14" y="146" width="480" height="52" rx="9" fill="#10b981" fill-opacity=".14" stroke="#10b981" stroke-width="1.1"/>
  <text x="30" y="166" font-size="11.5" font-weight="600" fill="#10b981">✔ a.speak()</text>
  <text x="120" y="166" font-size="11" fill="currentColor" opacity=".8">— declared on Animal, so it compiles…</text>
  <text x="30" y="186" font-size="11" fill="currentColor" opacity=".8">…and the JVM dispatches to Dog.speak() because the OBJECT is a Dog.</text>

  <rect x="14" y="208" width="480" height="52" rx="9" fill="#f43f5e" fill-opacity=".12" stroke="#f43f5e" stroke-width="1.1"/>
  <text x="30" y="228" font-size="11.5" font-weight="600" fill="#f43f5e">✘ a.fetch()</text>
  <text x="120" y="228" font-size="11" fill="currentColor" opacity=".8">— compile error, even though the object HAS fetch().</text>
  <text x="30" y="248" font-size="11" fill="currentColor" opacity=".8">Animal declares no fetch(), and the compiler only sees the reference type.</text>

  <path d="M500 175 L518 140" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ch2ddGrey)"/>
</svg>
