<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch10vtArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">Platform threads map 1:1 onto the OS. Virtual threads are scheduled by the JVM.</text>

  <!-- platform -->
  <rect x="14" y="34" width="360" height="176" rx="12" fill="#f43f5e" fill-opacity=".07" stroke="#f43f5e" stroke-width="1.3"/>
  <text x="30" y="56" font-size="12" font-weight="700" fill="#f43f5e">Platform threads — 1:1 with the OS</text>

  <g font-size="10" fill="currentColor">
    <rect x="30" y="68" width="100" height="30" rx="6" fill="#f43f5e" fill-opacity=".2"/><text x="48" y="88">thread-1</text>
    <rect x="140" y="68" width="100" height="30" rx="6" fill="#f43f5e" fill-opacity=".2"/><text x="158" y="88">thread-2</text>
    <rect x="250" y="68" width="106" height="30" rx="6" fill="#f43f5e" fill-opacity=".2"/><text x="268" y="88">thread-3</text>
  </g>
  <path d="M80 102 L80 122" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch10vtArrow)"/>
  <path d="M190 102 L190 122" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch10vtArrow)"/>
  <path d="M303 102 L303 122" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch10vtArrow)"/>
  <g font-size="10" fill="currentColor">
    <rect x="30" y="126" width="326" height="28" rx="6" fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-opacity=".2"/>
    <text x="44" y="145">OS kernel threads — ~1 MB stack each</text>
  </g>
  <text x="30" y="172" font-size="10.5" fill="currentColor" opacity=".85">A blocked thread holds a full OS thread doing nothing.</text>
  <text x="30" y="188" font-size="10.5" fill="currentColor" opacity=".85">Ceiling is a few thousand → pools, and "never block".</text>
  <text x="30" y="204" font-size="10.5" font-weight="700" fill="#f43f5e">Concurrency is capped by memory, not by the work.</text>

  <!-- virtual -->
  <rect x="386" y="34" width="360" height="176" rx="12" fill="#10b981" fill-opacity=".07" stroke="#10b981" stroke-width="1.3"/>
  <text x="402" y="56" font-size="12" font-weight="700" fill="#10b981">Virtual threads — M:N, scheduled by the JVM</text>

  <g font-size="9" fill="currentColor">
    <rect x="402" y="66" width="60" height="24" rx="5" fill="#10b981" fill-opacity=".22" class="gf-seq gf-s1"/><text x="418" y="82">vt-1</text>
    <rect x="468" y="66" width="60" height="24" rx="5" fill="#10b981" fill-opacity=".22" class="gf-seq gf-s2"/><text x="484" y="82">vt-2</text>
    <rect x="534" y="66" width="60" height="24" rx="5" fill="#10b981" fill-opacity=".22" class="gf-seq gf-s3"/><text x="550" y="82">vt-3</text>
    <rect x="600" y="66" width="60" height="24" rx="5" fill="#10b981" fill-opacity=".22" class="gf-seq gf-s4"/><text x="616" y="82">vt-4</text>
    <rect x="666" y="66" width="64" height="24" rx="5" fill="#10b981" fill-opacity=".22"/><text x="680" y="82">… 1M</text>
  </g>
  <path d="M566 94 L566 114" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch10vtArrow)" class="gf-dash"/>
  <text x="402" y="108" font-size="9" fill="currentColor" opacity=".6">stacks live on the HEAP, grow on demand</text>

  <g font-size="10" fill="currentColor">
    <rect x="402" y="118" width="150" height="28" rx="6" fill="#3b82f6" fill-opacity=".2"/><text x="416" y="137">carrier-1</text>
    <rect x="562" y="118" width="168" height="28" rx="6" fill="#3b82f6" fill-opacity=".2"/><text x="576" y="137">carrier-2  (≈ #cores)</text>
  </g>
  <text x="402" y="172" font-size="10.5" fill="currentColor" opacity=".85">A blocking call UNMOUNTS the virtual thread and frees</text>
  <text x="402" y="188" font-size="10.5" fill="currentColor" opacity=".85">the carrier for someone else. Blocking is now cheap.</text>
  <text x="402" y="204" font-size="10.5" font-weight="700" fill="#10b981">Write plain blocking code; scale to millions.</text>

  <rect x="14" y="222" width="732" height="80" rx="10" fill="#f59e0b" fill-opacity=".08" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="30" y="242" font-size="11" font-weight="700" fill="#f59e0b">What they do NOT do</text>
  <text x="30" y="262" font-size="10.5" fill="currentColor" opacity=".85">• Not faster for <tspan font-weight="600">CPU-bound</tspan> work — you still have only N cores. They solve waiting, not computing.</text>
  <text x="30" y="280" font-size="10.5" fill="currentColor" opacity=".85">• <tspan font-weight="600">Do not pool them.</tspan> Pooling exists because threads were expensive; one virtual thread per task is the model.</text>
  <text x="30" y="296" font-size="10.5" fill="currentColor" opacity=".85">• <tspan font-weight="600">synchronized can pin</tspan> a virtual thread to its carrier (much improved in Java 24) — prefer ReentrantLock for now.</text>
</svg>
