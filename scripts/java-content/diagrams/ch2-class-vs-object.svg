<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch2cvoArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">One class, many objects — the blueprint is not the building</text>

  <!-- class -->
  <rect x="14" y="42" width="238" height="176" rx="12" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="32" y="66" font-size="12.5" font-weight="700" fill="#8b5cf6">class User</text>
  <text x="32" y="84" font-size="10.5" fill="currentColor" opacity=".65">a TYPE — lives in Metaspace</text>

  <rect x="32" y="94" width="202" height="52" rx="8" fill="#8b5cf6" fill-opacity=".14"/>
  <text x="46" y="113" font-size="11" fill="currentColor" opacity=".85">String name;</text>
  <text x="46" y="131" font-size="11" fill="currentColor" opacity=".85">int age;</text>

  <rect x="32" y="154" width="202" height="50" rx="8" fill="#8b5cf6" fill-opacity=".14"/>
  <text x="46" y="173" font-size="11" fill="currentColor" opacity=".85">User(String, int)</text>
  <text x="46" y="191" font-size="11" fill="currentColor" opacity=".85">String greet()</text>

  <path d="M256 130 L306 130" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ch2cvoArrow)" class="gf-dash"/>
  <text x="256" y="120" font-size="10.5" fill="currentColor" opacity=".65">new</text>

  <!-- objects -->
  <g class="gf-seq gf-s1">
    <rect x="314" y="48" width="200" height="76" rx="10" fill="#10b981" fill-opacity=".16" stroke="#10b981" stroke-width="1.3"/>
    <text x="330" y="70" font-size="11.5" font-weight="700" fill="currentColor">User@1f3a</text>
    <text x="330" y="90" font-size="11" fill="currentColor" opacity=".8">name = "Asha"</text>
    <text x="330" y="108" font-size="11" fill="currentColor" opacity=".8">age = 30</text>
  </g>
  <g class="gf-seq gf-s2">
    <rect x="314" y="136" width="200" height="76" rx="10" fill="#10b981" fill-opacity=".16" stroke="#10b981" stroke-width="1.3"/>
    <text x="330" y="158" font-size="11.5" font-weight="700" fill="currentColor">User@88c1</text>
    <text x="330" y="178" font-size="11" fill="currentColor" opacity=".8">name = "Ben"</text>
    <text x="330" y="196" font-size="11" fill="currentColor" opacity=".8">age = 41</text>
  </g>
  <g class="gf-seq gf-s3">
    <rect x="534" y="92" width="200" height="76" rx="10" fill="#10b981" fill-opacity=".16" stroke="#10b981" stroke-width="1.3"/>
    <text x="550" y="114" font-size="11.5" font-weight="700" fill="currentColor">User@c05e</text>
    <text x="550" y="134" font-size="11" fill="currentColor" opacity=".8">name = "Chen"</text>
    <text x="550" y="152" font-size="11" fill="currentColor" opacity=".8">age = 27</text>
  </g>

  <text x="314" y="240" font-size="11" fill="currentColor" opacity=".7">Each object gets its OWN copy of every instance field, on the heap.</text>
  <text x="314" y="256" font-size="11" fill="currentColor" opacity=".7">The method CODE is shared — stored once, with the class.</text>
</svg>
