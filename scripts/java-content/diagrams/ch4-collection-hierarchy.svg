<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch4chArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">Two separate roots: Collection and Map. Map is NOT a Collection.</text>

  <!-- Iterable / Collection side -->
  <rect x="14" y="34" width="452" height="292" rx="12" fill="#3b82f6" fill-opacity=".06" stroke="#3b82f6" stroke-width="1.3"/>

  <rect x="150" y="44" width="170" height="30" rx="7" fill="#3b82f6" fill-opacity=".24" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="188" y="64" font-size="11.5" font-weight="700" fill="currentColor">Iterable</text>

  <path d="M235 76 L235 96" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch4chArrow)"/>

  <rect x="150" y="98" width="170" height="30" rx="7" fill="#3b82f6" fill-opacity=".24" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="180" y="118" font-size="11.5" font-weight="700" fill="currentColor">Collection</text>

  <path d="M235 130 L100 154" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch4chArrow)"/>
  <path d="M235 130 L235 154" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch4chArrow)"/>
  <path d="M235 130 L370 154" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch4chArrow)"/>

  <!-- List -->
  <rect x="26" y="156" width="140" height="28" rx="6" fill="#10b981" fill-opacity=".24" stroke="#10b981" stroke-width="1.1"/>
  <text x="72" y="175" font-size="11" font-weight="700" fill="currentColor">List</text>
  <text x="26" y="196" font-size="9.5" fill="currentColor" opacity=".65">ordered · duplicates OK</text>
  <g font-size="10.5" fill="currentColor">
    <rect x="26" y="204" width="140" height="24" rx="5" fill="#10b981" fill-opacity=".12"/><text x="38" y="220">ArrayList</text>
    <rect x="26" y="232" width="140" height="24" rx="5" fill="#10b981" fill-opacity=".12"/><text x="38" y="248">LinkedList</text>
    <rect x="26" y="260" width="140" height="24" rx="5" fill="#10b981" fill-opacity=".12"/><text x="38" y="276">Vector (legacy)</text>
  </g>

  <!-- Set -->
  <rect x="166" y="156" width="140" height="28" rx="6" fill="#8b5cf6" fill-opacity=".24" stroke="#8b5cf6" stroke-width="1.1"/>
  <text x="216" y="175" font-size="11" font-weight="700" fill="currentColor">Set</text>
  <text x="166" y="196" font-size="9.5" fill="currentColor" opacity=".65">no duplicates</text>
  <g font-size="10.5" fill="currentColor">
    <rect x="166" y="204" width="140" height="24" rx="5" fill="#8b5cf6" fill-opacity=".12"/><text x="178" y="220">HashSet</text>
    <rect x="166" y="232" width="140" height="24" rx="5" fill="#8b5cf6" fill-opacity=".12"/><text x="178" y="248">LinkedHashSet</text>
    <rect x="166" y="260" width="140" height="24" rx="5" fill="#8b5cf6" fill-opacity=".12"/><text x="178" y="276">TreeSet (sorted)</text>
  </g>

  <!-- Queue -->
  <rect x="312" y="156" width="142" height="28" rx="6" fill="#f59e0b" fill-opacity=".24" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="362" y="175" font-size="11" font-weight="700" fill="currentColor">Queue</text>
  <text x="312" y="196" font-size="9.5" fill="currentColor" opacity=".65">head-first ordering</text>
  <g font-size="10.5" fill="currentColor">
    <rect x="312" y="204" width="142" height="24" rx="5" fill="#f59e0b" fill-opacity=".12"/><text x="324" y="220">ArrayDeque</text>
    <rect x="312" y="232" width="142" height="24" rx="5" fill="#f59e0b" fill-opacity=".12"/><text x="324" y="248">PriorityQueue</text>
    <rect x="312" y="260" width="142" height="24" rx="5" fill="#f59e0b" fill-opacity=".12"/><text x="324" y="276">LinkedList</text>
  </g>

  <text x="26" y="306" font-size="10" fill="currentColor" opacity=".6">LinkedList implements BOTH List and Deque — which is</text>
  <text x="26" y="320" font-size="10" fill="currentColor" opacity=".6">why it appears in two columns.</text>

  <!-- Map side -->
  <rect x="482" y="34" width="264" height="292" rx="12" fill="#f43f5e" fill-opacity=".06" stroke="#f43f5e" stroke-width="1.3"/>
  <rect x="530" y="98" width="170" height="30" rx="7" fill="#f43f5e" fill-opacity=".24" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="568" y="118" font-size="11.5" font-weight="700" fill="currentColor">Map</text>
  <text x="494" y="64" font-size="10.5" fill="currentColor" opacity=".75">A separate root — Map does</text>
  <text x="494" y="80" font-size="10.5" fill="currentColor" opacity=".75">not extend Collection.</text>

  <path d="M615 130 L615 154" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch4chArrow)"/>
  <g font-size="10.5" fill="currentColor">
    <rect x="500" y="156" width="230" height="24" rx="5" fill="#f43f5e" fill-opacity=".12"/><text x="514" y="172">HashMap — no order</text>
    <rect x="500" y="184" width="230" height="24" rx="5" fill="#f43f5e" fill-opacity=".12"/><text x="514" y="200">LinkedHashMap — insertion order</text>
    <rect x="500" y="212" width="230" height="24" rx="5" fill="#f43f5e" fill-opacity=".12"/><text x="514" y="228">TreeMap — sorted by key</text>
    <rect x="500" y="240" width="230" height="24" rx="5" fill="#f43f5e" fill-opacity=".12"/><text x="514" y="256">ConcurrentHashMap</text>
    <rect x="500" y="268" width="230" height="24" rx="5" fill="#94a3b8" fill-opacity=".14"/><text x="514" y="284">Hashtable (legacy)</text>
  </g>
  <text x="500" y="312" font-size="10" fill="currentColor" opacity=".6">A Map holds key→value PAIRS, not</text>
  <text x="500" y="326" font-size="10" fill="currentColor" opacity=".6">elements — hence the split.</text>
</svg>
