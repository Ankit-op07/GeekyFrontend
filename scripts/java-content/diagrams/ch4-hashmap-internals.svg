<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch4hmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">put(key, value): hash → spread → index → walk the bin</text>

  <!-- steps -->
  <g class="gf-seq gf-s1">
    <rect x="14" y="34" width="164" height="56" rx="9" fill="#3b82f6" fill-opacity=".16" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="28" y="54" font-size="11" font-weight="700" fill="#3b82f6">1 · key.hashCode()</text>
    <text x="28" y="72" font-size="10.5" fill="currentColor" opacity=".8">your implementation</text>
    <text x="28" y="86" font-size="10.5" fill="currentColor" opacity=".8">→ 0x7A3F19C4</text>
  </g>
  <path d="M182 62 L202 62" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ch4hmArrow)" class="gf-dash"/>

  <g class="gf-seq gf-s2">
    <rect x="206" y="34" width="196" height="56" rx="9" fill="#8b5cf6" fill-opacity=".16" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="220" y="54" font-size="11" font-weight="700" fill="#8b5cf6">2 · spread: h ^ (h &gt;&gt;&gt; 16)</text>
    <text x="220" y="72" font-size="10.5" fill="currentColor" opacity=".8">mixes the HIGH bits down, so they</text>
    <text x="220" y="86" font-size="10.5" fill="currentColor" opacity=".8">survive the mask in step 3</text>
  </g>
  <path d="M406 62 L426 62" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ch4hmArrow)" class="gf-dash"/>

  <g class="gf-seq gf-s3">
    <rect x="430" y="34" width="180" height="56" rx="9" fill="#f59e0b" fill-opacity=".16" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="444" y="54" font-size="11" font-weight="700" fill="#f59e0b">3 · index = h &amp; (n − 1)</text>
    <text x="444" y="72" font-size="10.5" fill="currentColor" opacity=".8">n is a power of 2, so this is</text>
    <text x="444" y="86" font-size="10.5" fill="currentColor" opacity=".8">a cheap mask, not a modulo</text>
  </g>

  <!-- table -->
  <text x="14" y="118" font-size="11" font-weight="700" fill="currentColor">table (Node[] of length 16)</text>
  <g font-size="10.5" fill="currentColor">
    <rect x="14" y="128" width="86" height="26" rx="5" fill="currentColor" fill-opacity=".07" stroke="currentColor" stroke-opacity=".18"/><text x="26" y="146">[0] null</text>
    <rect x="14" y="158" width="86" height="26" rx="5" fill="#10b981" fill-opacity=".2" stroke="#10b981" stroke-width="1"/><text x="26" y="176">[1] ●</text>
    <rect x="14" y="188" width="86" height="26" rx="5" fill="currentColor" fill-opacity=".07" stroke="currentColor" stroke-opacity=".18"/><text x="26" y="206">[2] null</text>
    <rect x="14" y="218" width="86" height="26" rx="5" fill="#f43f5e" fill-opacity=".2" stroke="#f43f5e" stroke-width="1"/><text x="26" y="236">[3] ●</text>
    <rect x="14" y="248" width="86" height="26" rx="5" fill="currentColor" fill-opacity=".07" stroke="currentColor" stroke-opacity=".18"/><text x="26" y="266">…</text>
  </g>

  <!-- simple bin -->
  <path d="M104 171 L134 171" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch4hmArrow)"/>
  <rect x="138" y="154" width="150" height="34" rx="7" fill="#10b981" fill-opacity=".2" stroke="#10b981" stroke-width="1"/>
  <text x="150" y="175" font-size="10.5" fill="currentColor">"apple" → 3</text>
  <text x="300" y="175" font-size="10.5" fill="currentColor" opacity=".7">one entry — the common case</text>

  <!-- collision chain -->
  <path d="M104 231 L134 231" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch4hmArrow)"/>
  <rect x="138" y="214" width="128" height="34" rx="7" fill="#f43f5e" fill-opacity=".18" stroke="#f43f5e" stroke-width="1"/>
  <text x="150" y="235" font-size="10.5" fill="currentColor">"pear" → 7</text>
  <path d="M270 231 L294 231" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch4hmArrow)" class="gf-dash"/>
  <rect x="298" y="214" width="128" height="34" rx="7" fill="#f43f5e" fill-opacity=".18" stroke="#f43f5e" stroke-width="1"/>
  <text x="310" y="235" font-size="10.5" fill="currentColor">"plum" → 9</text>
  <path d="M430 231 L454 231" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch4hmArrow)" class="gf-dash"/>
  <rect x="458" y="214" width="128" height="34" rx="7" fill="#f43f5e" fill-opacity=".18" stroke="#f43f5e" stroke-width="1"/>
  <text x="470" y="235" font-size="10.5" fill="currentColor">"fig" → 2</text>

  <text x="138" y="268" font-size="10.5" fill="currentColor" opacity=".8">A COLLISION: different keys, same index. The bin becomes a linked list, walked with equals().</text>

  <!-- treeify -->
  <rect x="14" y="284" width="732" height="58" rx="10" fill="#f59e0b" fill-opacity=".1" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="30" y="304" font-size="11" font-weight="700" fill="#f59e0b">Treeification (Java 8+)</text>
  <text x="150" y="304" font-size="10.5" fill="currentColor" opacity=".85">— when one bin reaches <tspan font-weight="700">8</tspan> nodes AND the table is at least <tspan font-weight="700">64</tspan> long,</text>
  <text x="30" y="322" font-size="10.5" fill="currentColor" opacity=".85">that bin converts from a linked list into a red-black tree: worst-case lookup drops from <tspan font-weight="700" fill="#f43f5e">O(n)</tspan> to <tspan font-weight="700" fill="#10b981">O(log n)</tspan>.</text>
  <text x="30" y="338" font-size="10.5" fill="currentColor" opacity=".85">It untreeifies back to a list below 6. Below a table length of 64 the map resizes instead — spreading is cheaper than a tree.</text>
</svg>
