<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">Hashtable / synchronizedMap lock the whole table. ConcurrentHashMap locks one bin.</text>

  <!-- Hashtable -->
  <rect x="14" y="34" width="360" height="240" rx="12" fill="#f43f5e" fill-opacity=".07" stroke="#f43f5e" stroke-width="1.3"/>
  <text x="30" y="56" font-size="12" font-weight="700" fill="#f43f5e">Hashtable · Collections.synchronizedMap</text>
  <text x="30" y="74" font-size="10.5" fill="currentColor" opacity=".7">one lock for the entire map</text>

  <rect x="30" y="86" width="328" height="112" rx="9" fill="#f43f5e" fill-opacity=".14" stroke="#f43f5e" stroke-width="1.4" class="gf-pulse"/>
  <text x="44" y="106" font-size="10.5" font-weight="700" fill="#f43f5e">🔒 ONE LOCK</text>
  <g font-size="10.5" fill="currentColor">
    <rect x="44" y="116" width="140" height="24" rx="5" fill="currentColor" fill-opacity=".08"/><text x="56" y="133">bin 0</text>
    <rect x="200" y="116" width="140" height="24" rx="5" fill="currentColor" fill-opacity=".08"/><text x="212" y="133">bin 1</text>
    <rect x="44" y="146" width="140" height="24" rx="5" fill="currentColor" fill-opacity=".08"/><text x="56" y="163">bin 2</text>
    <rect x="200" y="146" width="140" height="24" rx="5" fill="currentColor" fill-opacity=".08"/><text x="212" y="163">bin 3</text>
  </g>
  <text x="44" y="190" font-size="10" fill="currentColor" opacity=".7">every bin is behind the same lock</text>

  <text x="30" y="222" font-size="10.5" fill="currentColor" opacity=".85">Thread A writing bin 0 BLOCKS thread B</text>
  <text x="30" y="238" font-size="10.5" fill="currentColor" opacity=".85">reading bin 3 — they never touch the same</text>
  <text x="30" y="254" font-size="10.5" fill="currentColor" opacity=".85">data, yet they serialise anyway.</text>
  <text x="30" y="270" font-size="10.5" font-weight="700" fill="#f43f5e">Throughput does not scale with cores.</text>

  <!-- ConcurrentHashMap -->
  <rect x="386" y="34" width="360" height="240" rx="12" fill="#10b981" fill-opacity=".07" stroke="#10b981" stroke-width="1.3"/>
  <text x="402" y="56" font-size="12" font-weight="700" fill="#10b981">ConcurrentHashMap (Java 8+)</text>
  <text x="402" y="74" font-size="10.5" fill="currentColor" opacity=".7">CAS for empty bins · synchronized on the bin's first node otherwise</text>

  <g font-size="10.5" fill="currentColor">
    <rect x="402" y="90" width="156" height="46" rx="7" fill="#10b981" fill-opacity=".2" stroke="#10b981" stroke-width="1" class="gf-seq gf-s1"/>
    <text x="416" y="108" font-size="10" font-weight="700" fill="#10b981">🔒 bin 0</text>
    <text x="416" y="126">thread A writes</text>
    <rect x="574" y="90" width="156" height="46" rx="7" fill="#10b981" fill-opacity=".2" stroke="#10b981" stroke-width="1" class="gf-seq gf-s2"/>
    <text x="588" y="108" font-size="10" font-weight="700" fill="#10b981">🔒 bin 1</text>
    <text x="588" y="126">thread B writes</text>
    <rect x="402" y="144" width="156" height="46" rx="7" fill="#10b981" fill-opacity=".2" stroke="#10b981" stroke-width="1" class="gf-seq gf-s3"/>
    <text x="416" y="162" font-size="10" font-weight="700" fill="#10b981">🔒 bin 2</text>
    <text x="416" y="180">thread C writes</text>
    <rect x="574" y="144" width="156" height="46" rx="7" fill="currentColor" fill-opacity=".07" stroke="currentColor" stroke-opacity=".2" stroke-dasharray="3 3"/>
    <text x="588" y="170" opacity=".6">bin 3 — free</text>
  </g>

  <text x="402" y="216" font-size="10.5" fill="currentColor" opacity=".85">Writers to different bins never contend.</text>
  <text x="402" y="232" font-size="10.5" fill="currentColor" opacity=".85">READS take no lock at all — the table and</text>
  <text x="402" y="248" font-size="10.5" fill="currentColor" opacity=".85">nodes are volatile, so get() is lock-free.</text>
  <text x="402" y="268" font-size="10.5" font-weight="700" fill="#10b981">Scales with cores. Never allows null keys or values.</text>
</svg>
