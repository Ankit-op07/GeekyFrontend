<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">Abstract class = "is a", one parent, may carry state. Interface = "can do", many, no state.</text>

  <!-- abstract class -->
  <rect x="14" y="40" width="356" height="234" rx="12" fill="#8b5cf6" fill-opacity=".08" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="32" y="64" font-size="12.5" font-weight="700" fill="#8b5cf6">abstract class Animal</text>

  <rect x="32" y="76" width="320" height="60" rx="8" fill="#8b5cf6" fill-opacity=".15"/>
  <text x="46" y="96" font-size="11" fill="currentColor">protected String name;      ← real state</text>
  <text x="46" y="114" font-size="11" fill="currentColor">Animal(String n) { … }      ← constructor</text>
  <text x="46" y="130" font-size="10.5" fill="currentColor" opacity=".7">every subclass inherits BOTH</text>

  <rect x="32" y="146" width="320" height="46" rx="8" fill="#8b5cf6" fill-opacity=".15"/>
  <text x="46" y="166" font-size="11" fill="currentColor">abstract void speak();       ← no body</text>
  <text x="46" y="184" font-size="11" fill="currentColor">void sleep() { … }           ← shared body</text>

  <g font-size="11" fill="currentColor" opacity=".85">
    <text x="32" y="214">• A class extends exactly ONE.</text>
    <text x="32" y="232">• Can hold mutable instance fields.</text>
    <text x="32" y="250">• Can have constructors and any access modifier.</text>
    <text x="32" y="268">• Use when subclasses genuinely share state + identity.</text>
  </g>

  <!-- interface -->
  <rect x="390" y="40" width="356" height="234" rx="12" fill="#10b981" fill-opacity=".08" stroke="#10b981" stroke-width="1.4"/>
  <text x="408" y="64" font-size="12.5" font-weight="700" fill="#10b981">interface Swimmer</text>

  <rect x="408" y="76" width="320" height="60" rx="8" fill="#10b981" fill-opacity=".15"/>
  <text x="422" y="96" font-size="11" fill="currentColor">void swim();                 ← implicitly public abstract</text>
  <text x="422" y="114" font-size="11" fill="currentColor">default void float_() { … }  ← body, since Java 8</text>
  <text x="422" y="130" font-size="10.5" fill="currentColor" opacity=".7">static and private methods allowed too</text>

  <rect x="408" y="146" width="320" height="46" rx="8" fill="#f43f5e" fill-opacity=".12" stroke="#f43f5e" stroke-width="1"/>
  <text x="422" y="166" font-size="11" fill="currentColor">int MAX = 10;   ← implicitly public static final</text>
  <text x="422" y="184" font-size="10.5" fill="#f43f5e">a CONSTANT, not per-object state</text>

  <g font-size="11" fill="currentColor" opacity=".85">
    <text x="408" y="214">• A class implements MANY.</text>
    <text x="408" y="232">• No instance fields — so no shared mutable state.</text>
    <text x="408" y="250">• No constructor. Cannot be instantiated directly.</text>
    <text x="408" y="268">• Use for capability contracts across unrelated types.</text>
  </g>
</svg>
