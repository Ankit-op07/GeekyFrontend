<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch8dlRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/>
    </marker>
    <marker id="ch8dlGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">Deadlock is a cycle in the wait-for graph — and lock ordering breaks it</text>

  <!-- deadlock -->
  <rect x="14" y="34" width="360" height="200" rx="12" fill="#f43f5e" fill-opacity=".07" stroke="#f43f5e" stroke-width="1.3"/>
  <text x="30" y="56" font-size="11.5" font-weight="700" fill="#f43f5e">✘ inconsistent order</text>

  <rect x="34" y="72" width="120" height="42" rx="8" fill="#3b82f6" fill-opacity=".2" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="60" y="98" font-size="11" font-weight="700" fill="currentColor">Thread A</text>
  <rect x="234" y="72" width="120" height="42" rx="8" fill="#f59e0b" fill-opacity=".2" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="260" y="98" font-size="11" font-weight="700" fill="currentColor">Thread B</text>
  <rect x="34" y="164" width="120" height="42" rx="8" fill="#8b5cf6" fill-opacity=".2" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="70" y="190" font-size="11" font-weight="700" fill="currentColor">Lock 1</text>
  <rect x="234" y="164" width="120" height="42" rx="8" fill="#8b5cf6" fill-opacity=".2" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="270" y="190" font-size="11" font-weight="700" fill="currentColor">Lock 2</text>

  <path d="M94 118 L94 158" stroke="#10b981" stroke-width="1.6" marker-end="url(#ch8dlGreen)"/>
  <text x="100" y="142" font-size="9" fill="#10b981">holds</text>
  <path d="M294 118 L294 158" stroke="#10b981" stroke-width="1.6" marker-end="url(#ch8dlGreen)"/>
  <text x="300" y="142" font-size="9" fill="#10b981">holds</text>

  <path d="M158 96 C 200 96, 250 120, 280 158" fill="none" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#ch8dlRed)" class="gf-dash"/>
  <text x="176" y="120" font-size="9" fill="#f43f5e">wants L2</text>
  <path d="M232 100 C 190 110, 140 130, 112 158" fill="none" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#ch8dlRed)" class="gf-dash"/>
  <text x="150" y="152" font-size="9" fill="#f43f5e">wants L1</text>

  <text x="30" y="226" font-size="10.5" font-weight="600" fill="#f43f5e">A cycle: neither can proceed, and neither will ever give up.</text>

  <!-- fixed -->
  <rect x="386" y="34" width="360" height="200" rx="12" fill="#10b981" fill-opacity=".07" stroke="#10b981" stroke-width="1.3"/>
  <text x="402" y="56" font-size="11.5" font-weight="700" fill="#10b981">✔ global lock ordering</text>

  <rect x="406" y="72" width="120" height="42" rx="8" fill="#3b82f6" fill-opacity=".2" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="432" y="98" font-size="11" font-weight="700" fill="currentColor">Thread A</text>
  <rect x="606" y="72" width="120" height="42" rx="8" fill="#f59e0b" fill-opacity=".2" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="632" y="98" font-size="11" font-weight="700" fill="currentColor">Thread B</text>
  <rect x="406" y="164" width="120" height="42" rx="8" fill="#8b5cf6" fill-opacity=".2" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="442" y="190" font-size="11" font-weight="700" fill="currentColor">Lock 1</text>
  <rect x="606" y="164" width="120" height="42" rx="8" fill="#8b5cf6" fill-opacity=".2" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="642" y="190" font-size="11" font-weight="700" fill="currentColor">Lock 2</text>

  <path d="M466 118 L466 158" stroke="#10b981" stroke-width="1.6" marker-end="url(#ch8dlGreen)"/>
  <text x="472" y="142" font-size="9" fill="#10b981">holds L1</text>
  <path d="M640 118 C 600 130, 540 140, 520 158" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ch8dlGreen)" class="gf-dash"/>
  <text x="556" y="130" font-size="9" fill="#f59e0b">waits for L1</text>

  <text x="402" y="226" font-size="10.5" font-weight="600" fill="#10b981">Both take L1 before L2 → no cycle is possible → B simply waits, then proceeds.</text>

  <rect x="14" y="244" width="732" height="42" rx="9" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".18"/>
  <text x="30" y="262" font-size="10.5" font-weight="700" fill="currentColor">Coffman conditions — all four must hold; break ANY one and deadlock is impossible</text>
  <text x="30" y="278" font-size="10.5" fill="currentColor" opacity=".85">mutual exclusion  ·  hold and wait  ·  no preemption  ·  <tspan font-weight="700">circular wait</tspan> ← the practical one to break, via lock ordering</text>
</svg>
