<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ch11blArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">Bean lifecycle — and where the proxy that makes @Transactional work gets created</text>

  <g font-size="10" fill="currentColor">
    <g class="gf-seq gf-s1">
      <rect x="14" y="36" width="132" height="48" rx="8" fill="#3b82f6" fill-opacity=".18" stroke="#3b82f6" stroke-width="1.1"/>
      <text x="28" y="55" font-weight="700" fill="#3b82f6">1 · instantiate</text>
      <text x="28" y="73" opacity=".85">constructor runs</text>
    </g>
    <path d="M150 60 L172 60" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch11blArrow)"/>
    <g class="gf-seq gf-s2">
      <rect x="176" y="36" width="132" height="48" rx="8" fill="#3b82f6" fill-opacity=".18" stroke="#3b82f6" stroke-width="1.1"/>
      <text x="190" y="55" font-weight="700" fill="#3b82f6">2 · populate</text>
      <text x="190" y="73" opacity=".85">@Autowired fields</text>
    </g>
    <path d="M312 60 L334 60" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch11blArrow)"/>
    <g class="gf-seq gf-s3">
      <rect x="338" y="36" width="132" height="48" rx="8" fill="#8b5cf6" fill-opacity=".18" stroke="#8b5cf6" stroke-width="1.1"/>
      <text x="352" y="55" font-weight="700" fill="#8b5cf6">3 · aware callbacks</text>
      <text x="352" y="73" opacity=".85">BeanNameAware…</text>
    </g>
    <path d="M474 60 L496 60" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch11blArrow)"/>
    <g class="gf-seq gf-s4">
      <rect x="500" y="36" width="246" height="48" rx="8" fill="#f59e0b" fill-opacity=".18" stroke="#f59e0b" stroke-width="1.1"/>
      <text x="514" y="55" font-weight="700" fill="#f59e0b">4 · BeanPostProcessor — BEFORE init</text>
      <text x="514" y="73" opacity=".85">@PostConstruct is invoked from here</text>
    </g>
  </g>

  <path d="M623 88 L623 106" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch11blArrow)"/>

  <g font-size="10" fill="currentColor">
    <rect x="500" y="110" width="246" height="44" rx="8" fill="#10b981" fill-opacity=".18" stroke="#10b981" stroke-width="1.1"/>
    <text x="514" y="128" font-weight="700" fill="#10b981">5 · afterPropertiesSet / @PostConstruct</text>
    <text x="514" y="146" opacity=".85">your initialisation code runs here</text>
  </g>

  <path d="M498 132 L344 132" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch11blArrow)"/>

  <g class="gf-pulse">
    <rect x="176" y="106" width="164" height="52" rx="8" fill="#f43f5e" fill-opacity=".2" stroke="#f43f5e" stroke-width="1.3"/>
    <text x="190" y="126" font-size="10" font-weight="700" fill="#f43f5e">6 · BeanPostProcessor</text>
    <text x="190" y="142" font-size="10" font-weight="700" fill="#f43f5e">AFTER init → PROXY</text>
    <text x="190" y="154" font-size="8.5" fill="currentColor" opacity=".75">@Transactional, @Async, @Cacheable</text>
  </g>

  <path d="M172 132 L150 132" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ch11blArrow)"/>
  <rect x="14" y="106" width="132" height="52" rx="8" fill="#10b981" fill-opacity=".22" stroke="#10b981" stroke-width="1.2"/>
  <text x="28" y="128" font-size="10" font-weight="700" fill="#10b981">7 · ready</text>
  <text x="28" y="146" font-size="10" fill="currentColor" opacity=".85">in the context</text>

  <rect x="14" y="176" width="360" height="52" rx="9" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-width="1.1"/>
  <text x="30" y="196" font-size="10.5" font-weight="700" fill="#8b5cf6">8 · @PreDestroy / destroy() on shutdown</text>
  <text x="30" y="214" font-size="10" fill="currentColor" opacity=".85">singletons only — prototype beans are never destroyed by Spring</text>

  <rect x="386" y="176" width="360" height="52" rx="9" fill="#f43f5e" fill-opacity=".1" stroke="#f43f5e" stroke-width="1.1"/>
  <text x="402" y="196" font-size="10.5" font-weight="700" fill="#f43f5e">Why step 6 explains the classic bug</text>
  <text x="402" y="214" font-size="10" fill="currentColor" opacity=".85">Callers get the PROXY. A self-call bypasses it — see @Transactional.</text>

  <rect x="14" y="242" width="732" height="48" rx="9" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".18"/>
  <text x="30" y="262" font-size="10.5" font-weight="700" fill="currentColor">Scopes</text>
  <text x="100" y="262" font-size="10.5" fill="currentColor" opacity=".85">singleton (default, one per container) · prototype (new every injection) · request · session · application</text>
  <text x="30" y="280" font-size="10.5" fill="currentColor" opacity=".85">⚠ A singleton holding mutable state is shared by every request thread — the most common Spring concurrency bug.</text>
</svg>
