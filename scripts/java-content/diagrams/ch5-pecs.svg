<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <text x="14" y="20" font-size="13" font-weight="700" fill="currentColor">PECS — Producer Extends, Consumer Super</text>
  <text x="14" y="40" font-size="11" fill="currentColor" opacity=".7">Which way the data flows decides which wildcard you need.</text>

  <!-- extends -->
  <rect x="14" y="54" width="360" height="232" rx="12" fill="#10b981" fill-opacity=".08" stroke="#10b981" stroke-width="1.4"/>
  <text x="30" y="78" font-size="12" font-weight="700" fill="#10b981">? extends T  —  a PRODUCER</text>
  <text x="30" y="96" font-size="10.5" fill="currentColor" opacity=".75">List&lt;? extends Number&gt; src</text>

  <rect x="30" y="108" width="328" height="58" rx="8" fill="#10b981" fill-opacity=".16"/>
  <text x="44" y="128" font-size="10.5" fill="currentColor">Could be List&lt;Integer&gt;, List&lt;Double&gt;, List&lt;Number&gt; …</text>
  <text x="44" y="146" font-size="10.5" fill="currentColor">The compiler knows only: whatever comes OUT is a Number.</text>
  <text x="44" y="160" font-size="10.5" fill="currentColor" opacity=".7">It cannot know which subtype the list actually holds.</text>

  <g font-size="11">
    <rect x="30" y="176" width="328" height="30" rx="6" fill="#10b981" fill-opacity=".22"/>
    <text x="44" y="196" fill="currentColor"><tspan font-weight="700" fill="#10b981">✔ READ</tspan>   Number n = src.get(0);</text>
    <rect x="30" y="212" width="328" height="30" rx="6" fill="#f43f5e" fill-opacity=".16"/>
    <text x="44" y="232" fill="currentColor"><tspan font-weight="700" fill="#f43f5e">✘ WRITE</tspan>  src.add(1);   // will not compile</text>
  </g>
  <text x="30" y="262" font-size="10" fill="currentColor" opacity=".75">Why the write is banned: if src is really a List&lt;Double&gt;,</text>
  <text x="30" y="276" font-size="10" fill="currentColor" opacity=".75">adding an Integer would corrupt it. Only null is accepted.</text>

  <!-- super -->
  <rect x="386" y="54" width="360" height="232" rx="12" fill="#3b82f6" fill-opacity=".08" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="402" y="78" font-size="12" font-weight="700" fill="#3b82f6">? super T  —  a CONSUMER</text>
  <text x="402" y="96" font-size="10.5" fill="currentColor" opacity=".75">List&lt;? super Integer&gt; dst</text>

  <rect x="402" y="108" width="328" height="58" rx="8" fill="#3b82f6" fill-opacity=".16"/>
  <text x="416" y="128" font-size="10.5" fill="currentColor">Could be List&lt;Integer&gt;, List&lt;Number&gt;, List&lt;Object&gt; …</text>
  <text x="416" y="146" font-size="10.5" fill="currentColor">Whatever it is, an Integer is always a legal element.</text>
  <text x="416" y="160" font-size="10.5" fill="currentColor" opacity=".7">But reading back gives you no useful type.</text>

  <g font-size="11">
    <rect x="402" y="176" width="328" height="30" rx="6" fill="#3b82f6" fill-opacity=".22"/>
    <text x="416" y="196" fill="currentColor"><tspan font-weight="700" fill="#3b82f6">✔ WRITE</tspan>  dst.add(42);</text>
    <rect x="402" y="212" width="328" height="30" rx="6" fill="#f43f5e" fill-opacity=".16"/>
    <text x="416" y="232" fill="currentColor"><tspan font-weight="700" fill="#f43f5e">✘ READ</tspan>   Integer i = dst.get(0);  // only Object</text>
  </g>
  <text x="402" y="262" font-size="10" fill="currentColor" opacity=".75">The only thing every candidate type has in common is</text>
  <text x="402" y="276" font-size="10" fill="currentColor" opacity=".75">Object, so that is all a read can promise.</text>
</svg>
