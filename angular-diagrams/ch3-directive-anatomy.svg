<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Anatomy of a Custom Attribute Directive</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">How @HostListener, @HostBinding &amp; @Input wire up</text>

  <!-- host element -->
  <rect x="280" y="100" width="260" height="54" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Host element</text>
  <text x="410" y="143" text-anchor="middle" font-size="12" fill="#64748b">&lt;p appHighlight="red"&gt;</text>

  <defs>
    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <line x1="410" y1="154" x2="410" y2="186" stroke="#64748b" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- directive class -->
  <rect x="200" y="192" width="420" height="200" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">HighlightDirective</text>

  <rect x="224" y="234" width="372" height="42" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="240" y="252" font-size="12" font-weight="700" fill="#7e22ce">@Input() appHighlight</text>
  <text x="240" y="269" font-size="11" fill="#64748b">receives the value from the host</text>

  <rect x="224" y="286" width="372" height="42" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="240" y="304" font-size="12" font-weight="700" fill="#7e22ce">@HostBinding('style.background')</text>
  <text x="240" y="321" font-size="11" fill="#64748b">writes a property back onto the host</text>

  <rect x="224" y="338" width="372" height="42" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="240" y="356" font-size="12" font-weight="700" fill="#7e22ce">@HostListener('mouseenter')</text>
  <text x="240" y="373" font-size="11" fill="#64748b">reacts to host DOM events</text>
</svg>
