<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Structural vs Attribute Directives</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">Two ways a directive changes an element</text>

  <!-- Structural side -->
  <rect x="40" y="100" width="350" height="280" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="215" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">Structural</text>
  <text x="215" y="156" text-anchor="middle" font-size="13" fill="#64748b">changes the DOM shape</text>

  <rect x="66" y="176" width="298" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="215" y="201" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">*ngIf  *ngFor  *ngSwitch</text>

  <rect x="66" y="230" width="298" height="40" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="215" y="255" text-anchor="middle" font-size="13" fill="#334155">Adds / removes host element</text>

  <rect x="66" y="284" width="298" height="40" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="215" y="309" text-anchor="middle" font-size="13" fill="#334155">Backed by an &lt;ng-template&gt;</text>

  <rect x="66" y="338" width="298" height="30" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="215" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Leading * asterisk</text>

  <!-- Attribute side -->
  <rect x="430" y="100" width="350" height="280" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="605" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">Attribute</text>
  <text x="605" y="156" text-anchor="middle" font-size="13" fill="#64748b">changes appearance / behaviour</text>

  <rect x="456" y="176" width="298" height="40" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="605" y="201" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">ngClass  ngStyle  ngModel</text>

  <rect x="456" y="230" width="298" height="40" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="605" y="255" text-anchor="middle" font-size="13" fill="#334155">Keeps element, edits it</text>

  <rect x="456" y="284" width="298" height="40" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="605" y="309" text-anchor="middle" font-size="13" fill="#334155">No template of its own</text>

  <rect x="456" y="338" width="298" height="30" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="605" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Attribute selector [attr]</text>
</svg>
