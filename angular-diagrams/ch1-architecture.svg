<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="500" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Angular Application Architecture</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">How the building blocks fit together</text>

  <!-- NgModule / Bootstrap boundary -->
  <rect x="40" y="100" width="740" height="360" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="126" font-size="13" font-weight="600" fill="#94a3b8">Application (NgModule or Standalone bootstrap)</text>

  <!-- Component box -->
  <rect x="70" y="150" width="330" height="180" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="235" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#b91c1c">Component</text>

  <rect x="92" y="196" width="286" height="52" rx="9" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="106" y="217" font-size="13" font-weight="600" fill="#0f172a">Template (HTML)</text>
  <text x="106" y="236" font-size="12" fill="#64748b">bindings, directives, pipes &#8594; the view</text>

  <rect x="92" y="258" width="286" height="56" rx="9" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="106" y="279" font-size="13" font-weight="600" fill="#0f172a">Class (TypeScript)</text>
  <text x="106" y="298" font-size="12" fill="#64748b">state, @Input/@Output, lifecycle hooks</text>

  <!-- Metadata pill -->
  <rect x="70" y="346" width="330" height="42" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="235" y="372" text-anchor="middle" font-size="13" fill="#1d4ed8">@Component() metadata — selector, template, styles</text>

  <!-- Service / DI -->
  <rect x="450" y="150" width="300" height="120" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">Service</text>
  <text x="600" y="206" text-anchor="middle" font-size="12" fill="#166534">reusable logic, HTTP, shared state</text>
  <text x="600" y="240" text-anchor="middle" font-size="12" fill="#64748b">@Injectable({ providedIn: 'root' })</text>

  <!-- DI arrow -->
  <line x1="450" y1="230" x2="402" y2="230" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="426" y="222" text-anchor="middle" font-size="11" fill="#15803d">DI</text>

  <!-- Router -->
  <rect x="450" y="286" width="300" height="46" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="600" y="314" text-anchor="middle" font-size="13" fill="#7e22ce">Router — maps URLs &#8594; components</text>

  <!-- DOM output -->
  <rect x="450" y="348" width="300" height="42" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="600" y="374" text-anchor="middle" font-size="13" fill="#334155">Rendered DOM (the browser view)</text>

  <line x1="235" y1="388" x2="235" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="235" y="440" text-anchor="middle" font-size="12" fill="#64748b">Change detection keeps the DOM in sync with the class</text>

  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
