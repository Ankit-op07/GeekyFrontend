<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="480" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">CLI Project Structure</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">What ng new scaffolds and why</text>

  <!-- root files column -->
  <rect x="40" y="100" width="340" height="350" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="210" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Config (repo root)</text>

  <rect x="60" y="146" width="300" height="36" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="72" y="169" font-size="13" fill="#1e3a8a">angular.json — build targets</text>
  <rect x="60" y="190" width="300" height="36" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="72" y="213" font-size="13" fill="#1e3a8a">package.json — deps + scripts</text>
  <rect x="60" y="234" width="300" height="36" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="72" y="257" font-size="13" fill="#1e3a8a">tsconfig.json — TS compiler</text>
  <rect x="60" y="278" width="300" height="36" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="72" y="301" font-size="13" fill="#1e3a8a">index.html — the shell page</text>
  <rect x="60" y="322" width="300" height="36" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="72" y="345" font-size="13" fill="#1e3a8a">main.ts — bootstrap entry</text>
  <rect x="60" y="366" width="300" height="36" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="72" y="389" font-size="13" fill="#1e3a8a">styles.css — global styles</text>
  <rect x="60" y="410" width="300" height="30" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="72" y="430" font-size="12" fill="#64748b">environments/ — build-time config</text>

  <!-- src/app column -->
  <rect x="440" y="100" width="340" height="350" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="610" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">src/app (your code)</text>

  <rect x="460" y="146" width="300" height="36" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="472" y="169" font-size="13" fill="#991b1b">app.component.ts — root UI</text>
  <rect x="460" y="190" width="300" height="36" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="472" y="213" font-size="13" fill="#991b1b">app.config.ts — providers</text>
  <rect x="460" y="234" width="300" height="36" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="472" y="257" font-size="13" fill="#991b1b">app.routes.ts — route table</text>
  <rect x="460" y="278" width="300" height="36" rx="9" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="472" y="301" font-size="13" fill="#6b21a8">features/ — feature folders</text>
  <rect x="460" y="322" width="300" height="36" rx="9" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="472" y="345" font-size="13" fill="#6b21a8">core/ — singletons, guards</text>
  <rect x="460" y="366" width="300" height="36" rx="9" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="472" y="389" font-size="13" fill="#6b21a8">shared/ — reusable UI</text>
  <rect x="460" y="410" width="300" height="30" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="472" y="430" font-size="12" fill="#166534">assets/ — static files</text>
</svg>
