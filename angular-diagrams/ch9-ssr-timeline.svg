<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="340" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Loading Timeline: CSR vs SSR</text>
  <text x="410" y="68" text-anchor="middle" font-size="13" fill="#64748b">SSR paints meaningful content far sooner; both interactive after hydration</text>

  <!-- CSR row -->
  <text x="70" y="130" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c">CSR</text>
  <rect x="120" y="112" width="150" height="28" rx="6" fill="#fecaca" stroke="#dc2626"/>
  <text x="195" y="131" text-anchor="middle" font-size="11" fill="#7f1d1d">download JS</text>
  <rect x="272" y="112" width="180" height="28" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="362" y="131" text-anchor="middle" font-size="11" fill="#7f1d1d">parse + bootstrap</text>
  <rect x="454" y="112" width="130" height="28" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="519" y="131" text-anchor="middle" font-size="11" fill="#7f1d1d">render DOM</text>
  <line x1="584" y1="126" x2="640" y2="126" stroke="#94a3b8" stroke-width="2" marker-end="url(#t9)"/>
  <text x="700" y="130" text-anchor="middle" font-size="11" fill="#b91c1c">FCP + TTI (late)</text>

  <!-- SSR row -->
  <text x="70" y="210" text-anchor="start" font-size="14" font-weight="700" fill="#1d4ed8">SSR</text>
  <rect x="120" y="192" width="120" height="28" rx="6" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="180" y="211" text-anchor="middle" font-size="11" fill="#1e3a8a">server HTML</text>
  <line x1="240" y1="206" x2="285" y2="206" stroke="#16a34a" stroke-width="2" marker-end="url(#t9g)"/>
  <text x="300" y="196" text-anchor="start" font-size="10.5" fill="#15803d">FCP (early)</text>
  <rect x="368" y="192" width="150" height="28" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="443" y="211" text-anchor="middle" font-size="11" fill="#1e3a8a">download JS</text>
  <rect x="520" y="192" width="110" height="28" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="575" y="211" text-anchor="middle" font-size="11" fill="#1e3a8a">hydrate</text>
  <line x1="630" y1="206" x2="680" y2="206" stroke="#94a3b8" stroke-width="2" marker-end="url(#t9)"/>
  <text x="720" y="210" text-anchor="middle" font-size="11" fill="#1d4ed8">TTI</text>

  <!-- axis -->
  <line x1="120" y1="262" x2="760" y2="262" stroke="#94a3b8" stroke-width="2" marker-end="url(#t9)"/>
  <text x="120" y="284" text-anchor="start" font-size="12" fill="#64748b">t = 0</text>
  <text x="760" y="284" text-anchor="end" font-size="12" fill="#64748b">time &#8594;</text>
  <text x="410" y="312" text-anchor="middle" font-size="11.5" fill="#64748b">Key metrics: TTFB (server), FCP (first paint), TTI (fully interactive)</text>

  <defs>
    <marker id="t9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="t9g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
