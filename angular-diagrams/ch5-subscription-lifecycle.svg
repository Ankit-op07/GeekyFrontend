<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="380" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Subscription lifecycle &amp; the leak</text>
  <text x="410" y="68" text-anchor="middle" font-size="14" fill="#64748b">complete/error auto-teardown; an infinite source needs manual teardown</text>

  <!-- finite -->
  <rect x="40" y="90" width="740" height="120" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="116" font-size="15" font-weight="700" fill="#15803d">Finite source (http, of) — self-cleaning</text>
  <line x1="140" y1="160" x2="700" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="240" cy="160" r="8" fill="#16a34a"/>
  <text x="700" y="150" font-size="18" fill="#16a34a">|</text>
  <text x="700" y="188" text-anchor="middle" font-size="11" fill="#15803d">complete → teardown runs</text>
  <text x="160" y="150" font-size="11" fill="#64748b">subscribe</text>

  <!-- infinite -->
  <rect x="40" y="220" width="740" height="140" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="246" font-size="15" font-weight="700" fill="#b91c1c">Infinite source (interval, valueChanges, Subject) — leaks</text>
  <line x1="140" y1="292" x2="740" y2="292" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="220" cy="292" r="7" fill="#dc2626"/><circle cx="320" cy="292" r="7" fill="#dc2626"/><circle cx="420" cy="292" r="7" fill="#dc2626"/><circle cx="520" cy="292" r="7" fill="#dc2626"/><circle cx="620" cy="292" r="7" fill="#dc2626"/>
  <text x="745" y="297" font-size="16" fill="#dc2626">→</text>
  <line x1="480" y1="276" x2="480" y2="340" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="480" y="334" text-anchor="middle" font-size="11" fill="#16a34a">takeUntilDestroyed / async pipe cuts here</text>
  <text x="60" y="282" font-size="11" fill="#64748b">never completes on its own</text>
</svg>
