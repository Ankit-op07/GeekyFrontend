<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="380" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Unidirectional Data Flow</text>
  <text x="410" y="68" text-anchor="middle" font-size="13" fill="#64748b">State only changes one way, in one direction, through pure reducers</text>

  <!-- Component -->
  <rect x="320" y="92" width="180" height="52" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Component</text>
  <text x="410" y="132" text-anchor="middle" font-size="11" fill="#64748b">dispatch(action)</text>

  <!-- Action -->
  <rect x="600" y="160" width="170" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="685" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Action</text>
  <text x="685" y="200" text-anchor="middle" font-size="11" fill="#b91c1c">describes what happened</text>

  <!-- Reducer -->
  <rect x="600" y="252" width="170" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="685" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Reducer</text>
  <text x="685" y="292" text-anchor="middle" font-size="11" fill="#166534">pure (state, action) =&gt; state</text>

  <!-- Store -->
  <rect x="320" y="252" width="180" height="52" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">Store</text>
  <text x="410" y="292" text-anchor="middle" font-size="11" fill="#7e22ce">single state tree</text>

  <!-- Selector -->
  <rect x="50" y="252" width="180" height="52" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Selector</text>
  <text x="140" y="292" text-anchor="middle" font-size="11" fill="#64748b">reads a slice</text>

  <!-- arrows: component -> action -->
  <line x1="500" y1="124" x2="640" y2="158" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="560" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">dispatch</text>
  <!-- action -> reducer -->
  <line x1="685" y1="212" x2="685" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <!-- reducer -> store -->
  <line x1="600" y1="278" x2="502" y2="278" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="551" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">new state</text>
  <!-- store -> selector -->
  <line x1="320" y1="278" x2="232" y2="278" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <!-- selector -> component (up) -->
  <line x1="140" y1="252" x2="140" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="118" x2="318" y2="118" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="230" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#3b82f6">select() stream</text>

  <text x="410" y="352" text-anchor="middle" font-size="12" fill="#64748b">The only way to change state is to dispatch an action. Reducers never mutate — they return new state.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
