<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">trackBy: Reuse DOM Instead of Rebuilding</text>
  <text x="410" y="68" text-anchor="middle" font-size="13" fill="#64748b">A stable key lets @for match old and new items by identity</text>

  <!-- Without trackBy -->
  <rect x="40" y="92" width="360" height="286" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="220" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">Without trackBy</text>
  <text x="220" y="140" text-anchor="middle" font-size="11" fill="#b91c1c">new array reference → identity lost</text>

  <rect x="70" y="156" width="140" height="34" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="140" y="178" text-anchor="middle" font-size="11" fill="#334155">old #1 destroyed</text>
  <rect x="230" y="156" width="140" height="34" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="300" y="178" text-anchor="middle" font-size="11" fill="#334155">old #2 destroyed</text>
  <rect x="70" y="198" width="140" height="34" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="140" y="220" text-anchor="middle" font-size="11" fill="#334155">new #1 created</text>
  <rect x="230" y="198" width="140" height="34" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="300" y="220" text-anchor="middle" font-size="11" fill="#334155">new #2 created</text>

  <text x="220" y="266" text-anchor="middle" font-size="12" fill="#b91c1c">Every node torn down &amp; rebuilt</text>
  <text x="220" y="290" text-anchor="middle" font-size="11" fill="#b91c1c">✘ lost focus / scroll / input state</text>
  <text x="220" y="312" text-anchor="middle" font-size="11" fill="#b91c1c">✘ image flicker, wasted layout</text>
  <text x="220" y="352" text-anchor="middle" font-size="11" fill="#64748b">O(n) DOM churn on every update</text>

  <!-- With trackBy -->
  <rect x="420" y="92" width="360" height="286" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="600" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">With track item.id</text>
  <text x="600" y="140" text-anchor="middle" font-size="11" fill="#166534">stable key → items matched</text>

  <rect x="450" y="156" width="140" height="34" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="520" y="178" text-anchor="middle" font-size="11" fill="#334155">id=1 reused</text>
  <rect x="610" y="156" width="140" height="34" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="680" y="178" text-anchor="middle" font-size="11" fill="#334155">id=2 reused</text>
  <rect x="450" y="198" width="140" height="34" rx="8" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="520" y="220" text-anchor="middle" font-size="11" fill="#15803d">only id=3 added</text>
  <rect x="610" y="198" width="140" height="34" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="680" y="220" text-anchor="middle" font-size="11" fill="#334155">bindings updated</text>

  <text x="600" y="266" text-anchor="middle" font-size="12" fill="#15803d">Existing DOM kept in place</text>
  <text x="600" y="290" text-anchor="middle" font-size="11" fill="#166534">✔ focus / scroll preserved</text>
  <text x="600" y="312" text-anchor="middle" font-size="11" fill="#166534">✔ only diffs touch the DOM</text>
  <text x="600" y="352" text-anchor="middle" font-size="11" fill="#166534">minimal, targeted updates</text>
</svg>
