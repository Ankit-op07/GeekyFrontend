<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Pure vs Impure Pipes</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">When does Angular re-run transform()?</text>

  <!-- Pure -->
  <rect x="40" y="100" width="350" height="270" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="215" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">Pure (default)</text>

  <rect x="66" y="150" width="298" height="46" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="215" y="171" text-anchor="middle" font-size="12" fill="#166534" font-weight="700">Re-runs only on reference change</text>
  <text x="215" y="189" text-anchor="middle" font-size="11" fill="#64748b">new object / new array / primitive change</text>

  <rect x="66" y="210" width="298" height="40" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="215" y="235" text-anchor="middle" font-size="12" fill="#334155">Cached, memoised, cheap</text>

  <rect x="66" y="264" width="298" height="40" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="215" y="289" text-anchor="middle" font-size="12" fill="#334155">Mutation is INVISIBLE to it</text>

  <rect x="66" y="318" width="298" height="36" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="215" y="341" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Use for 99% of cases</text>

  <!-- Impure -->
  <rect x="430" y="100" width="350" height="270" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#b91c1c">Impure</text>

  <rect x="456" y="150" width="298" height="46" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="605" y="171" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="700">Re-runs EVERY change-detection cycle</text>
  <text x="605" y="189" text-anchor="middle" font-size="11" fill="#64748b">pure: false in @Pipe</text>

  <rect x="456" y="210" width="298" height="40" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="605" y="235" text-anchor="middle" font-size="12" fill="#334155">Sees mutations — but costly</text>

  <rect x="456" y="264" width="298" height="40" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="605" y="289" text-anchor="middle" font-size="12" fill="#334155">Can run hundreds of times/sec</text>

  <rect x="456" y="318" width="298" height="36" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="605" y="341" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">e.g. async pipe, avoid otherwise</text>
</svg>
