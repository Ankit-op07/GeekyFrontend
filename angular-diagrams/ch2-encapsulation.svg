<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Three View Encapsulation Modes</text>
  <text x="410" y="70" text-anchor="middle" font-size="14" fill="#64748b">How Angular scopes a component's CSS to its own DOM</text>

  <!-- Emulated -->
  <rect x="30" y="100" width="245" height="270" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="152" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Emulated (default)</text>
  <rect x="52" y="146" width="201" height="60" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="152" y="170" text-anchor="middle" font-size="12" fill="#334155">adds attribute</text>
  <text x="152" y="190" text-anchor="middle" font-size="12" fill="#334155">_ngcontent-abc</text>
  <rect x="52" y="216" width="201" height="60" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="152" y="240" text-anchor="middle" font-size="12" fill="#334155">rewrites selectors</text>
  <text x="152" y="260" text-anchor="middle" font-size="12" fill="#334155">.btn[_ngcontent-abc]</text>
  <text x="152" y="308" text-anchor="middle" font-size="12" fill="#64748b">scoped, no Shadow DOM</text>
  <text x="152" y="330" text-anchor="middle" font-size="12" fill="#64748b">global styles still leak in</text>
  <text x="152" y="352" text-anchor="middle" font-size="12" fill="#15803d" font-weight="700">use this 95% of the time</text>

  <!-- ShadowDom -->
  <rect x="288" y="100" width="245" height="270" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">ShadowDom</text>
  <rect x="310" y="146" width="201" height="60" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="410" y="170" text-anchor="middle" font-size="12" fill="#334155">real #shadow-root</text>
  <text x="410" y="190" text-anchor="middle" font-size="12" fill="#334155">browser native</text>
  <rect x="310" y="216" width="201" height="60" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="410" y="240" text-anchor="middle" font-size="12" fill="#334155">true isolation</text>
  <text x="410" y="260" text-anchor="middle" font-size="12" fill="#334155">both directions</text>
  <text x="410" y="308" text-anchor="middle" font-size="12" fill="#64748b">global CSS cannot enter</text>
  <text x="410" y="330" text-anchor="middle" font-size="12" fill="#64748b">good for web components</text>

  <!-- None -->
  <rect x="546" y="100" width="245" height="270" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="668" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">None</text>
  <rect x="568" y="146" width="201" height="60" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="668" y="170" text-anchor="middle" font-size="12" fill="#334155">no attribute added</text>
  <text x="668" y="190" text-anchor="middle" font-size="12" fill="#334155">selectors untouched</text>
  <rect x="568" y="216" width="201" height="60" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="668" y="240" text-anchor="middle" font-size="12" fill="#334155">styles go global</text>
  <text x="668" y="260" text-anchor="middle" font-size="12" fill="#334155">affect whole app</text>
  <text x="668" y="308" text-anchor="middle" font-size="12" fill="#64748b">leaks out to everything</text>
  <text x="668" y="330" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="700">use with great care</text>
</svg>
