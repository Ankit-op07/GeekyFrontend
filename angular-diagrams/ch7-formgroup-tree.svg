<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">The AbstractControl Tree</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">Validity bubbles up: a group is invalid if any child is invalid</text>
  <defs>
    <marker id="ar7t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
  </defs>

  <!-- root -->
  <rect x="300" y="96" width="220" height="56" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">FormGroup (profile)</text>
  <text x="410" y="140" text-anchor="middle" font-size="11.5" fill="#64748b">value = merged object</text>

  <line x1="410" y1="152" x2="150" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar7t)"/>
  <line x1="410" y1="152" x2="410" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar7t)"/>
  <line x1="410" y1="152" x2="670" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar7t)"/>

  <!-- children -->
  <rect x="52" y="216" width="220" height="56" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="162" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">FormControl (name)</text>
  <text x="162" y="260" text-anchor="middle" font-size="11.5" fill="#64748b">value = string</text>

  <rect x="300" y="216" width="220" height="56" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">FormControl (email)</text>
  <text x="410" y="260" text-anchor="middle" font-size="11.5" fill="#64748b">value = string</text>

  <rect x="548" y="216" width="220" height="56" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="658" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">FormArray (phones)</text>
  <text x="658" y="260" text-anchor="middle" font-size="11.5" fill="#64748b">value = array</text>

  <line x1="658" y1="272" x2="590" y2="316" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar7t)"/>
  <line x1="658" y1="272" x2="726" y2="316" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar7t)"/>
  <rect x="520" y="320" width="140" height="44" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="590" y="347" text-anchor="middle" font-size="12.5" fill="#334155">control [0]</text>
  <rect x="668" y="320" width="118" height="44" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="727" y="347" text-anchor="middle" font-size="12.5" fill="#334155">control [1]</text>

  <text x="230" y="345" text-anchor="middle" font-size="12.5" fill="#334155">get() by path: form.get('phones.0')</text>
</svg>
