<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="470" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Angular Building Blocks</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">The core pieces and how they relate</text>

  <defs>
    <marker id="bb-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Component -->
  <rect x="310" y="100" width="200" height="70" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Component</text>
  <text x="410" y="152" text-anchor="middle" font-size="12" fill="#334155">class + template</text>

  <!-- Template -->
  <rect x="60" y="220" width="200" height="70" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Template</text>
  <text x="160" y="272" text-anchor="middle" font-size="12" fill="#334155">HTML + bindings</text>

  <!-- Directive -->
  <rect x="310" y="220" width="200" height="70" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#6b21a8">Directive / Pipe</text>
  <text x="410" y="272" text-anchor="middle" font-size="12" fill="#334155">shape the DOM</text>

  <!-- Service -->
  <rect x="560" y="220" width="200" height="70" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Service</text>
  <text x="660" y="272" text-anchor="middle" font-size="12" fill="#334155">logic + state</text>

  <!-- DI -->
  <rect x="560" y="340" width="200" height="70" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Injector (DI)</text>
  <text x="660" y="392" text-anchor="middle" font-size="12" fill="#334155">provides services</text>

  <!-- Router -->
  <rect x="60" y="340" width="200" height="70" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="160" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Router</text>
  <text x="160" y="392" text-anchor="middle" font-size="12" fill="#334155">maps URL to view</text>

  <!-- arrows -->
  <line x1="360" y1="170" x2="200" y2="216" stroke="#64748b" stroke-width="1.8" marker-end="url(#bb-arrow)"/>
  <line x1="410" y1="170" x2="410" y2="216" stroke="#64748b" stroke-width="1.8" marker-end="url(#bb-arrow)"/>
  <line x1="460" y1="170" x2="620" y2="216" stroke="#64748b" stroke-width="1.8" marker-end="url(#bb-arrow)"/>
  <line x1="660" y1="290" x2="660" y2="336" stroke="#64748b" stroke-width="1.8" marker-end="url(#bb-arrow)"/>
  <line x1="160" y1="290" x2="160" y2="336" stroke="#64748b" stroke-width="1.8" marker-end="url(#bb-arrow)"/>

  <text x="410" y="440" text-anchor="middle" font-size="12" fill="#64748b">A component uses templates, directives, services; DI supplies the services; the router swaps components.</text>
</svg>
