<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="380" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Token Storage Trade-offs</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">Each option trades one attack surface for another</text>

  <rect x="40" y="100" width="240" height="250" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="160" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">localStorage</text>
  <text x="160" y="156" text-anchor="middle" font-size="12" fill="#334155">Survives refresh</text>
  <text x="160" y="178" text-anchor="middle" font-size="12" fill="#334155">Easy to read in JS</text>
  <text x="160" y="206" text-anchor="middle" font-size="12" fill="#b91c1c">Exposed to XSS</text>
  <text x="160" y="228" text-anchor="middle" font-size="12" fill="#b91c1c">Any script can steal it</text>
  <text x="160" y="256" text-anchor="middle" font-size="12" fill="#64748b">Not sent automatically,</text>
  <text x="160" y="274" text-anchor="middle" font-size="12" fill="#64748b">so no CSRF risk</text>
  <text x="160" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Convenient, riskier</text>

  <rect x="290" y="100" width="240" height="250" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">In-memory</text>
  <text x="410" y="156" text-anchor="middle" font-size="12" fill="#334155">Lives in a service</text>
  <text x="410" y="178" text-anchor="middle" font-size="12" fill="#334155">Cleared on refresh</text>
  <text x="410" y="206" text-anchor="middle" font-size="12" fill="#15803d">Smallest XSS window</text>
  <text x="410" y="228" text-anchor="middle" font-size="12" fill="#334155">Needs silent re-auth</text>
  <text x="410" y="256" text-anchor="middle" font-size="12" fill="#64748b">Good for short-lived</text>
  <text x="410" y="274" text-anchor="middle" font-size="12" fill="#64748b">access tokens</text>
  <text x="410" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Safer, more work</text>

  <rect x="540" y="100" width="240" height="250" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">HttpOnly cookie</text>
  <text x="660" y="156" text-anchor="middle" font-size="12" fill="#334155">JS cannot read it</text>
  <text x="660" y="178" text-anchor="middle" font-size="12" fill="#15803d">XSS cannot steal it</text>
  <text x="660" y="206" text-anchor="middle" font-size="12" fill="#334155">Sent automatically</text>
  <text x="660" y="228" text-anchor="middle" font-size="12" fill="#b45309">Needs CSRF defence</text>
  <text x="660" y="256" text-anchor="middle" font-size="12" fill="#64748b">Best for refresh tokens</text>
  <text x="660" y="274" text-anchor="middle" font-size="12" fill="#64748b">Secure + SameSite</text>
  <text x="660" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Strongest for secrets</text>
</svg>
