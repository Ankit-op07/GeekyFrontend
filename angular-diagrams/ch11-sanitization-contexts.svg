<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Angular's Sanitization Contexts</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">The binding type decides which sanitizer runs</text>

  <rect x="40" y="100" width="360" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">HTML context</text>
  <text x="220" y="150" text-anchor="middle" font-size="12" fill="#334155">[innerHTML]="value"</text>
  <text x="220" y="172" text-anchor="middle" font-size="12" fill="#64748b">Strips &lt;script&gt;, onerror,</text>
  <text x="220" y="188" text-anchor="middle" font-size="12" fill="#64748b">javascript: from markup</text>
  <text x="220" y="212" text-anchor="middle" font-size="12" fill="#334155">Keeps safe tags/attrs</text>

  <rect x="420" y="100" width="360" height="130" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">URL context</text>
  <text x="600" y="150" text-anchor="middle" font-size="12" fill="#334155">[href] / [src]</text>
  <text x="600" y="172" text-anchor="middle" font-size="12" fill="#64748b">Blocks javascript: and</text>
  <text x="600" y="188" text-anchor="middle" font-size="12" fill="#64748b">unsafe data: schemes</text>
  <text x="600" y="212" text-anchor="middle" font-size="12" fill="#334155">Allows http/https/mailto</text>

  <rect x="40" y="245" width="360" height="130" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="220" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">Resource URL context</text>
  <text x="220" y="295" text-anchor="middle" font-size="12" fill="#334155">[src] on iframe / script</text>
  <text x="220" y="317" text-anchor="middle" font-size="12" fill="#64748b">No sanitizer exists here</text>
  <text x="220" y="337" text-anchor="middle" font-size="12" fill="#64748b">Angular refuses binding</text>
  <text x="220" y="359" text-anchor="middle" font-size="12" fill="#334155">Must be trusted explicitly</text>

  <rect x="420" y="245" width="360" height="130" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Style context</text>
  <text x="600" y="295" text-anchor="middle" font-size="12" fill="#334155">[style] / [style.prop]</text>
  <text x="600" y="317" text-anchor="middle" font-size="12" fill="#64748b">Filters dangerous CSS</text>
  <text x="600" y="337" text-anchor="middle" font-size="12" fill="#64748b">(url(), expression())</text>
  <text x="600" y="359" text-anchor="middle" font-size="12" fill="#334155">Safe values pass through</text>
</svg>
