<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="380" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">@defer Block States</text>
  <text x="410" y="68" text-anchor="middle" font-size="13" fill="#64748b">The four sub-blocks and the order they render in</text>

  <rect x="60" y="96" width="240" height="60" rx="11" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="180" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">@placeholder</text>
  <text x="180" y="142" text-anchor="middle" font-size="10.5" fill="#64748b">shown before trigger fires</text>
  <line x1="300" y1="126" x2="360" y2="126" stroke="#94a3b8" stroke-width="2" marker-end="url(#db)"/>
  <text x="330" y="116" text-anchor="middle" font-size="10" fill="#64748b">trigger</text>

  <rect x="360" y="96" width="240" height="60" rx="11" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="480" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">@loading</text>
  <text x="480" y="142" text-anchor="middle" font-size="10.5" fill="#64748b">while chunk downloads</text>
  <line x1="600" y1="126" x2="660" y2="126" stroke="#94a3b8" stroke-width="2" marker-end="url(#db)"/>

  <rect x="660" y="96" width="120" height="60" rx="11" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="720" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">@defer</text>
  <text x="720" y="142" text-anchor="middle" font-size="10.5" fill="#64748b">main content</text>

  <line x1="480" y1="156" x2="480" y2="196" stroke="#dc2626" stroke-width="2" marker-end="url(#dbr)"/>
  <text x="540" y="180" text-anchor="middle" font-size="10.5" fill="#b91c1c">on load failure</text>
  <rect x="360" y="198" width="240" height="56" rx="11" fill="#fef2f2" stroke="#dc2626"/>
  <text x="480" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">@error</text>
  <text x="480" y="242" text-anchor="middle" font-size="10.5" fill="#64748b">shown if the chunk fails</text>

  <rect x="60" y="284" width="720" height="72" rx="12" fill="#faf5ff" stroke="#9333ea"/>
  <text x="410" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7e22ce">Timing guards</text>
  <text x="410" y="332" text-anchor="middle" font-size="11.5" fill="#334155">@placeholder (minimum 500ms) &#183; @loading (after 100ms; minimum 1s)</text>
  <text x="410" y="350" text-anchor="middle" font-size="11" fill="#64748b">prevent flicker on fast connections</text>

  <defs>
    <marker id="db" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="dbr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
