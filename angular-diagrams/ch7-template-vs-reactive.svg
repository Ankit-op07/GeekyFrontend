<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Template-driven vs Reactive Forms</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">Where the source of truth for the form model lives</text>

  <!-- Template-driven -->
  <rect x="40" y="96" width="350" height="290" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="215" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Template-driven</text>
  <rect x="64" y="140" width="302" height="52" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="80" y="162" font-size="13" fill="#334155">Model built by directives</text>
  <text x="80" y="181" font-size="12" fill="#64748b">ngModel, ngForm in the HTML</text>
  <rect x="64" y="204" width="302" height="52" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="80" y="226" font-size="13" fill="#334155">Async setup after render</text>
  <text x="80" y="245" font-size="12" fill="#64748b">controls created in ngAfterView</text>
  <text x="64" y="288" font-size="12.5" fill="#334155">+ Fast for tiny forms</text>
  <text x="64" y="310" font-size="12.5" fill="#334155">+ Little TS code</text>
  <text x="64" y="332" font-size="12.5" fill="#b91c1c">- Hard to unit-test</text>
  <text x="64" y="354" font-size="12.5" fill="#b91c1c">- Dynamic controls awkward</text>
  <text x="64" y="376" font-size="12" fill="#64748b">FormsModule</text>

  <!-- Reactive -->
  <rect x="430" y="96" width="350" height="290" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="605" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Reactive</text>
  <rect x="454" y="140" width="302" height="52" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="470" y="162" font-size="13" fill="#334155">Model built in the class</text>
  <text x="470" y="181" font-size="12" fill="#64748b">FormGroup, FormControl in TS</text>
  <rect x="454" y="204" width="302" height="52" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="470" y="226" font-size="13" fill="#334155">Sync + explicit</text>
  <text x="470" y="245" font-size="12" fill="#64748b">controls exist before template</text>
  <text x="454" y="288" font-size="12.5" fill="#334155">+ Easy to unit-test</text>
  <text x="454" y="310" font-size="12.5" fill="#334155">+ Dynamic controls, typed</text>
  <text x="454" y="332" font-size="12.5" fill="#334155">+ valueChanges / statusChanges</text>
  <text x="454" y="354" font-size="12.5" fill="#b91c1c">- More boilerplate</text>
  <text x="454" y="376" font-size="12" fill="#64748b">ReactiveFormsModule</text>
</svg>
