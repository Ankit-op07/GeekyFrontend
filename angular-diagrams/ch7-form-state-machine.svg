<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="440" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Form Control State Flags</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">Two independent axes: interaction and validity</text>

  <!-- interaction axis -->
  <rect x="40" y="96" width="360" height="150" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Interaction axis</text>
  <rect x="64" y="140" width="150" height="42" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="139" y="160" text-anchor="middle" font-size="13" fill="#334155">pristine</text>
  <text x="139" y="176" text-anchor="middle" font-size="11" fill="#64748b">value untouched</text>
  <rect x="226" y="140" width="150" height="42" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="301" y="160" text-anchor="middle" font-size="13" fill="#334155">dirty</text>
  <text x="301" y="176" text-anchor="middle" font-size="11" fill="#64748b">value changed</text>
  <rect x="64" y="192" width="150" height="42" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="139" y="212" text-anchor="middle" font-size="13" fill="#334155">untouched</text>
  <text x="139" y="228" text-anchor="middle" font-size="11" fill="#64748b">never blurred</text>
  <rect x="226" y="192" width="150" height="42" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="301" y="212" text-anchor="middle" font-size="13" fill="#334155">touched</text>
  <text x="301" y="228" text-anchor="middle" font-size="11" fill="#64748b">blurred once</text>

  <!-- validity axis -->
  <rect x="420" y="96" width="360" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Validity axis (status)</text>
  <rect x="444" y="140" width="150" height="42" rx="9" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="519" y="160" text-anchor="middle" font-size="13" fill="#334155">VALID</text>
  <text x="519" y="176" text-anchor="middle" font-size="11" fill="#64748b">errors is null</text>
  <rect x="606" y="140" width="150" height="42" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="681" y="160" text-anchor="middle" font-size="13" fill="#b91c1c">INVALID</text>
  <text x="681" y="176" text-anchor="middle" font-size="11" fill="#64748b">has errors</text>
  <rect x="444" y="192" width="150" height="42" rx="9" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="519" y="212" text-anchor="middle" font-size="13" fill="#7e22ce">PENDING</text>
  <text x="519" y="228" text-anchor="middle" font-size="11" fill="#64748b">async running</text>
  <rect x="606" y="192" width="150" height="42" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="681" y="212" text-anchor="middle" font-size="13" fill="#334155">DISABLED</text>
  <text x="681" y="228" text-anchor="middle" font-size="11" fill="#64748b">excluded</text>

  <!-- streams -->
  <rect x="40" y="262" width="740" height="150" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#7e22ce">Observable outputs</text>
  <rect x="64" y="306" width="345" height="44" rx="9" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="80" y="326" font-size="13" fill="#334155">valueChanges</text>
  <text x="80" y="343" font-size="11.5" fill="#64748b">emits new value on every keystroke</text>
  <rect x="411" y="306" width="345" height="44" rx="9" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="427" y="326" font-size="13" fill="#334155">statusChanges</text>
  <text x="427" y="343" font-size="11.5" fill="#64748b">emits VALID / INVALID / PENDING</text>
  <text x="410" y="378" text-anchor="middle" font-size="12.5" fill="#334155">Both fire AFTER the model updates. Async validators push PENDING to VALID/INVALID.</text>
  <text x="410" y="398" text-anchor="middle" font-size="12" fill="#64748b">setValue/patchValue emit unless { emitEvent: false }</text>
</svg>
