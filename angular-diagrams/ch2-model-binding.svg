<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="340" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">model() = input() + output() Combined</text>
  <text x="410" y="70" text-anchor="middle" font-size="14" fill="#64748b">One writable signal that supports two-way [(binding)]</text>

  <defs>
    <marker id="m2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/>
    </marker>
    <marker id="m2l" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#9333ea"/>
    </marker>
  </defs>

  <!-- Parent -->
  <rect x="50" y="120" width="250" height="120" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="175" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Parent</text>
  <rect x="72" y="166" width="206" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="175" y="188" text-anchor="middle" font-size="12" fill="#334155">&lt;app-rating</text>
  <text x="175" y="207" text-anchor="middle" font-size="12" fill="#334155">[(value)]="stars" /&gt;</text>

  <!-- Child -->
  <rect x="520" y="120" width="250" height="120" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Child</text>
  <rect x="542" y="166" width="206" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="645" y="188" text-anchor="middle" font-size="12" fill="#334155">value = model(0);</text>
  <text x="645" y="207" text-anchor="middle" font-size="12" fill="#334155">value.set(3)  updates parent</text>

  <!-- two-way arrows -->
  <line x1="304" y1="170" x2="516" y2="170" stroke="#9333ea" stroke-width="3" marker-end="url(#m2)"/>
  <line x1="516" y1="196" x2="304" y2="196" stroke="#9333ea" stroke-width="3" marker-end="url(#m2l)"/>
  <rect x="330" y="252" width="160" height="40" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="410" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">value + valueChange</text>
</svg>
