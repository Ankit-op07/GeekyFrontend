<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="360" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">DomSanitizer: The Bypass Decision</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">bypass returns a SafeValue that skips sanitization</text>
  <defs>
    <marker id="arbt" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>

  <rect x="300" y="100" width="220" height="54" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Value to render</text>
  <text x="410" y="143" text-anchor="middle" font-size="12" fill="#334155">Is its source trusted?</text>

  <line x1="410" y1="154" x2="200" y2="190" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arbt)"/>
  <line x1="410" y1="154" x2="620" y2="190" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arbt)"/>
  <text x="270" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">No / unknown</text>
  <text x="560" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#7e22ce">Yes, I own it</text>

  <rect x="60" y="196" width="290" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="205" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Let Angular sanitize</text>
  <text x="205" y="244" text-anchor="middle" font-size="12" fill="#334155">Plain string binding.</text>
  <text x="205" y="262" text-anchor="middle" font-size="12" fill="#334155">Default and safe path.</text>

  <rect x="470" y="196" width="290" height="80" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="615" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">bypassSecurityTrustX()</text>
  <text x="615" y="244" text-anchor="middle" font-size="12" fill="#334155">Returns SafeValue.</text>
  <text x="615" y="262" text-anchor="middle" font-size="12" fill="#334155">You now own the risk.</text>

  <rect x="470" y="288" width="290" height="46" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="615" y="316" text-anchor="middle" font-size="12" fill="#b91c1c">Never bypass user-supplied input</text>

  <rect x="60" y="288" width="290" height="46" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="205" y="316" text-anchor="middle" font-size="12" fill="#15803d">99% of bindings belong here</text>
</svg>
