<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="320" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">The Pipe Transform Pipeline</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">value | pipe:arg  →  transform(value, arg)</text>

  <defs>
    <marker id="arrowPl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect x="40" y="130" width="180" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Input value</text>
  <text x="130" y="182" text-anchor="middle" font-size="12" fill="#64748b">price = 1234.5</text>

  <line x1="222" y1="165" x2="272" y2="165" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowPl)"/>

  <rect x="275" y="130" width="270" height="70" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">transform(value, ...args)</text>
  <text x="410" y="180" text-anchor="middle" font-size="12" fill="#64748b">currency:'INR'</text>

  <line x1="547" y1="165" x2="597" y2="165" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowPl)"/>

  <rect x="600" y="130" width="180" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Output</text>
  <text x="690" y="182" text-anchor="middle" font-size="12" fill="#64748b">₹1,234.50</text>

  <rect x="120" y="238" width="580" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="410" y="266" text-anchor="middle" font-size="13" fill="#334155">Pure pipe: transform runs only when the input reference changes</text>
</svg>
