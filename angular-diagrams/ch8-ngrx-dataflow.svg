<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="470" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">NgRx One-Way Data Flow</text>
  <text x="410" y="68" text-anchor="middle" font-size="13" fill="#64748b">Component → Action → Reducer → Store → Selector → Component</text>

  <!-- Component -->
  <rect x="310" y="92" width="200" height="56" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Component</text>
  <text x="410" y="134" text-anchor="middle" font-size="11" fill="#64748b">dispatches + subscribes</text>

  <!-- Action -->
  <line x1="510" y1="120" x2="620" y2="152" stroke="#94a3b8" stroke-width="2" marker-end="url(#ng)"/>
  <text x="590" y="122" font-size="11" fill="#64748b">dispatch</text>
  <rect x="600" y="156" width="180" height="52" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="690" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">Action</text>
  <text x="690" y="197" text-anchor="middle" font-size="11" fill="#7e22ce">{ type, payload }</text>

  <!-- Reducer -->
  <line x1="690" y1="208" x2="690" y2="252" stroke="#94a3b8" stroke-width="2" marker-end="url(#ng)"/>
  <rect x="600" y="256" width="180" height="52" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Reducer</text>
  <text x="690" y="297" text-anchor="middle" font-size="11" fill="#166534">pure: (state,action)→state</text>

  <!-- Store -->
  <line x1="600" y1="282" x2="490" y2="316" stroke="#94a3b8" stroke-width="2" marker-end="url(#ng)"/>
  <rect x="310" y="320" width="200" height="56" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="410" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#0e7490">Store</text>
  <text x="410" y="362" text-anchor="middle" font-size="11" fill="#155e75">single immutable state tree</text>

  <!-- Selector back to component -->
  <line x1="310" y1="330" x2="200" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#ng)"/>
  <rect x="40" y="150" width="180" height="52" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="130" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Selector</text>
  <text x="130" y="191" text-anchor="middle" font-size="11" fill="#92400e">memoized, derived</text>
  <line x1="220" y1="150" x2="308" y2="122" stroke="#16a34a" stroke-width="2" marker-end="url(#ns)"/>
  <text x="230" y="120" font-size="11" fill="#166534">select()</text>

  <!-- Effect side branch -->
  <line x1="690" y1="208" x2="690" y2="356" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="600" y="356" width="180" height="60" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="690" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Effect</text>
  <text x="690" y="398" text-anchor="middle" font-size="11" fill="#b91c1c">side effects: HTTP, etc.</text>
  <line x1="600" y1="386" x2="512" y2="352" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#nr)"/>
  <text x="470" y="410" font-size="11" fill="#b91c1c">dispatches a new Action (success/fail)</text>

  <text x="410" y="446" text-anchor="middle" font-size="12" fill="#64748b">Data flows one way; components never mutate the Store directly.</text>

  <defs>
    <marker id="ng" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ns" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="nr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
