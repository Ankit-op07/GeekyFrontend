<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="380" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Sync vs Async Validators</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">Sync run first and gate whether async even runs</text>
  <defs>
    <marker id="ar7v" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>

  <rect x="40" y="150" width="150" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="115" y="180" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">value change</text>
  <text x="115" y="199" text-anchor="middle" font-size="11.5" fill="#64748b">keystroke</text>

  <line x1="190" y1="185" x2="234" y2="185" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar7v)"/>
  <rect x="238" y="150" width="180" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="328" y="176" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">Sync validators</text>
  <text x="328" y="195" text-anchor="middle" font-size="11.5" fill="#64748b">required, pattern</text>
  <text x="328" y="211" text-anchor="middle" font-size="11.5" fill="#64748b">return errors or null</text>

  <line x1="418" y1="185" x2="462" y2="185" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar7v)"/>
  <path d="M552 150 L612 185 L552 220 L492 185 Z" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="552" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#7e22ce">sync</text>
  <text x="552" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#7e22ce">valid?</text>

  <line x1="552" y1="220" x2="552" y2="288" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar7v)"/>
  <text x="568" y="258" font-size="11.5" fill="#b91c1c">no -&gt; stop, INVALID</text>

  <line x1="612" y1="185" x2="656" y2="185" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar7v)"/>
  <text x="634" y="176" text-anchor="middle" font-size="11.5" fill="#16a34a">yes</text>
  <rect x="660" y="150" width="120" height="70" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="720" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7e22ce">Async</text>
  <text x="720" y="194" text-anchor="middle" font-size="11" fill="#64748b">status</text>
  <text x="720" y="209" text-anchor="middle" font-size="11" fill="#64748b">PENDING</text>

  <rect x="452" y="292" width="200" height="52" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="552" y="322" text-anchor="middle" font-size="12.5" fill="#b91c1c">errors shown to user</text>

  <text x="720" y="252" text-anchor="middle" font-size="11.5" fill="#334155">emits null</text>
  <text x="720" y="270" text-anchor="middle" font-size="11.5" fill="#334155">or errors -></text>
  <text x="720" y="288" text-anchor="middle" font-size="11.5" fill="#334155">VALID/INVALID</text>
</svg>
