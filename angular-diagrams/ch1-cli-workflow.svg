<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="320" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">The Angular CLI Workflow</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">One tool from scaffold to deploy</text>

  <defs>
    <marker id="cli-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="30" y="120" width="150" height="70" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="105" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">ng new</text>
  <text x="105" y="172" text-anchor="middle" font-size="12" fill="#334155">scaffold app</text>

  <rect x="215" y="120" width="150" height="70" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="290" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">ng generate</text>
  <text x="290" y="172" text-anchor="middle" font-size="12" fill="#334155">add components</text>

  <rect x="400" y="120" width="150" height="70" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="475" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">ng serve</text>
  <text x="475" y="172" text-anchor="middle" font-size="12" fill="#334155">dev + HMR</text>

  <rect x="585" y="120" width="150" height="70" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="660" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">ng test</text>
  <text x="660" y="172" text-anchor="middle" font-size="12" fill="#334155">unit tests</text>

  <rect x="310" y="230" width="200" height="60" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">ng build</text>
  <text x="410" y="278" text-anchor="middle" font-size="12" fill="#334155">AOT + optimized bundle</text>

  <line x1="180" y1="155" x2="211" y2="155" stroke="#dc2626" stroke-width="2" marker-end="url(#cli-arrow)"/>
  <line x1="365" y1="155" x2="396" y2="155" stroke="#dc2626" stroke-width="2" marker-end="url(#cli-arrow)"/>
  <line x1="550" y1="155" x2="581" y2="155" stroke="#dc2626" stroke-width="2" marker-end="url(#cli-arrow)"/>
  <line x1="475" y1="190" x2="440" y2="226" stroke="#dc2626" stroke-width="2" marker-end="url(#cli-arrow)"/>
</svg>
