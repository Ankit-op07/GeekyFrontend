<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="440" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Built-in Control Flow (v17+)</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">Block syntax replaces the structural directives</text>

  <!-- old vs new columns -->
  <rect x="40" y="100" width="360" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="220" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Old — directives</text>
  <text x="220" y="148" text-anchor="middle" font-size="12" fill="#64748b">*ngIf  *ngFor  *ngSwitch</text>

  <rect x="420" y="100" width="360" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">New — @blocks</text>
  <text x="600" y="148" text-anchor="middle" font-size="12" fill="#64748b">@if  @for  @switch</text>

  <!-- rows -->
  <rect x="40" y="180" width="740" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="66" y="205" font-size="13" font-weight="700" fill="#1d4ed8">@if / @else if / @else</text>
  <text x="66" y="224" font-size="12" fill="#64748b">Conditional, no template ref needed</text>

  <rect x="40" y="248" width="740" height="66" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="66" y="273" font-size="13" font-weight="700" fill="#15803d">@for (item of items; track item.id)</text>
  <text x="66" y="292" font-size="12" fill="#64748b">track is MANDATORY — drives DOM diffing</text>
  <text x="66" y="309" font-size="12" fill="#64748b">@empty block for the zero-item case</text>

  <rect x="40" y="328" width="740" height="54" rx="10" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="66" y="353" font-size="13" font-weight="700" fill="#7e22ce">@switch / @case / @default</text>
  <text x="66" y="372" font-size="12" fill="#64748b">Built in — no import, tree-shakeable, faster</text>

  <text x="410" y="410" text-anchor="middle" font-size="13" font-style="italic" fill="#334155">Compiled directly — no NgIf/NgForOf runtime, smaller bundle</text>
</svg>
