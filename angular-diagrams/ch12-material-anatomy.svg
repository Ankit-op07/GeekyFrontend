<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">How a Material component reaches the screen</text>
  <text x="410" y="68" text-anchor="middle" font-size="14" fill="#64748b">Standalone import → component → CDK primitives → theme tokens</text>
  <defs>
    <marker id="a12ma" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <g font-size="13">
    <rect x="40" y="96" width="220" height="88" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="122" font-size="15" font-weight="700" fill="#1d4ed8">Your component</text>
    <text x="60" y="146" fill="#334155">imports: [MatButtonModule]</text>
    <text x="60" y="168" fill="#64748b">standalone: true</text>

    <rect x="300" y="96" width="220" height="88" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text x="320" y="122" font-size="15" font-weight="700" fill="#7e22ce">Material component</text>
    <text x="320" y="146" fill="#334155">mat-button, mat-form-field</text>
    <text x="320" y="168" fill="#64748b">renders styled DOM</text>

    <rect x="560" y="96" width="220" height="88" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="580" y="122" font-size="15" font-weight="700" fill="#15803d">CDK primitives</text>
    <text x="580" y="146" fill="#334155">Overlay, a11y, Portal</text>
    <text x="580" y="168" fill="#64748b">unstyled behaviour</text>

    <line x1="260" y1="140" x2="298" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a12ma)"/>
    <line x1="520" y1="140" x2="558" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a12ma)"/>

    <rect x="40" y="220" width="740" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="60" y="248" font-size="15" font-weight="700" fill="#b91c1c">Theme layer (once, at root)</text>
    <text x="60" y="272" fill="#334155">mat.theme() emits CSS custom properties (design tokens) into styles.scss.</text>
    <text x="60" y="292" fill="#64748b">Every Material component reads those tokens — colour, typography, density.</text>

    <rect x="40" y="330" width="740" height="66" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="60" y="358" font-size="15" font-weight="700" fill="#b45309">Key idea</text>
    <text x="60" y="382" fill="#334155">Import per-component (tree-shakeable), theme once at the root, share tokens everywhere.</text>
  </g>
</svg>
