<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">CSR vs SSR vs SSG</text>
  <text x="410" y="68" text-anchor="middle" font-size="13" fill="#64748b">Where and when the HTML for the page is produced</text>

  <!-- CSR -->
  <rect x="30" y="92" width="245" height="272" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="152" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">CSR</text>
  <rect x="52" y="138" width="200" height="34" rx="9" fill="#ffffff" stroke="#fca5a5"/>
  <text x="152" y="160" text-anchor="middle" font-size="11.5" fill="#334155">Server sends empty shell</text>
  <rect x="52" y="180" width="200" height="34" rx="9" fill="#ffffff" stroke="#fca5a5"/>
  <text x="152" y="202" text-anchor="middle" font-size="11.5" fill="#334155">Browser runs all JS</text>
  <rect x="52" y="222" width="200" height="34" rx="9" fill="#ffffff" stroke="#fca5a5"/>
  <text x="152" y="244" text-anchor="middle" font-size="11.5" fill="#334155">Then DOM is built</text>
  <text x="152" y="292" text-anchor="middle" font-size="11" fill="#b91c1c">Slow FCP, weak SEO</text>
  <text x="152" y="314" text-anchor="middle" font-size="11" fill="#64748b">Best for: app-shell dashboards</text>
  <text x="152" y="336" text-anchor="middle" font-size="11" fill="#64748b">behind a login</text>

  <!-- SSR -->
  <rect x="288" y="92" width="245" height="272" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="410" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">SSR</text>
  <rect x="310" y="138" width="200" height="34" rx="9" fill="#ffffff" stroke="#93c5fd"/>
  <text x="410" y="160" text-anchor="middle" font-size="11.5" fill="#334155">HTML rendered per request</text>
  <rect x="310" y="180" width="200" height="34" rx="9" fill="#ffffff" stroke="#93c5fd"/>
  <text x="410" y="202" text-anchor="middle" font-size="11.5" fill="#334155">Sent fully-formed</text>
  <rect x="310" y="222" width="200" height="34" rx="9" fill="#ffffff" stroke="#93c5fd"/>
  <text x="410" y="244" text-anchor="middle" font-size="11.5" fill="#334155">Hydrated on client</text>
  <text x="410" y="292" text-anchor="middle" font-size="11" fill="#1d4ed8">Fast FCP, strong SEO</text>
  <text x="410" y="314" text-anchor="middle" font-size="11" fill="#64748b">Best for: dynamic, per-user</text>
  <text x="410" y="336" text-anchor="middle" font-size="11" fill="#64748b">pages needing SEO</text>

  <!-- SSG -->
  <rect x="546" y="92" width="245" height="272" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="668" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">SSG / Prerender</text>
  <rect x="568" y="138" width="200" height="34" rx="9" fill="#ffffff" stroke="#86efac"/>
  <text x="668" y="160" text-anchor="middle" font-size="11.5" fill="#334155">HTML built at build time</text>
  <rect x="568" y="180" width="200" height="34" rx="9" fill="#ffffff" stroke="#86efac"/>
  <text x="668" y="202" text-anchor="middle" font-size="11.5" fill="#334155">Served from CDN</text>
  <rect x="568" y="222" width="200" height="34" rx="9" fill="#ffffff" stroke="#86efac"/>
  <text x="668" y="244" text-anchor="middle" font-size="11.5" fill="#334155">Hydrated on client</text>
  <text x="668" y="292" text-anchor="middle" font-size="11" fill="#15803d">Fastest TTFB, cheap</text>
  <text x="668" y="314" text-anchor="middle" font-size="11" fill="#64748b">Best for: docs, blogs,</text>
  <text x="668" y="336" text-anchor="middle" font-size="11" fill="#64748b">marketing pages</text>
</svg>
