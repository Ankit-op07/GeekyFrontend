<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Zoned vs Zoneless Change Detection</text>
  <text x="410" y="68" text-anchor="middle" font-size="13" fill="#64748b">Zoneless drops Zone.js; signals and explicit notifications schedule CD</text>

  <!-- Zoned column -->
  <rect x="40" y="92" width="360" height="272" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Zoned (default)</text>
  <rect x="70" y="138" width="300" height="36" rx="9" fill="#ffffff" stroke="#93c5fd"/>
  <text x="220" y="161" text-anchor="middle" font-size="12" fill="#334155">Any async task fires</text>
  <line x1="220" y1="174" x2="220" y2="194" stroke="#94a3b8" stroke-width="2" marker-end="url(#zf)"/>
  <rect x="70" y="196" width="300" height="36" rx="9" fill="#ffffff" stroke="#93c5fd"/>
  <text x="220" y="219" text-anchor="middle" font-size="12" fill="#334155">Zone.js signals NgZone</text>
  <line x1="220" y1="232" x2="220" y2="252" stroke="#94a3b8" stroke-width="2" marker-end="url(#zf)"/>
  <rect x="70" y="254" width="300" height="36" rx="9" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="220" y="277" text-anchor="middle" font-size="12" fill="#b91c1c">Whole app checked (broad)</text>
  <text x="220" y="322" text-anchor="middle" font-size="11" fill="#64748b">+ ~13KB Zone.js in the bundle</text>
  <text x="220" y="342" text-anchor="middle" font-size="11" fill="#64748b">+ triggers even when nothing bound changed</text>

  <!-- Zoneless column -->
  <rect x="420" y="92" width="360" height="272" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="600" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Zoneless (v18+)</text>
  <rect x="450" y="138" width="300" height="36" rx="9" fill="#ffffff" stroke="#86efac"/>
  <text x="600" y="161" text-anchor="middle" font-size="12" fill="#334155">signal set / markForCheck</text>
  <line x1="600" y1="174" x2="600" y2="194" stroke="#16a34a" stroke-width="2" marker-end="url(#zg)"/>
  <rect x="450" y="196" width="300" height="36" rx="9" fill="#ffffff" stroke="#86efac"/>
  <text x="600" y="219" text-anchor="middle" font-size="12" fill="#334155">Scheduler notified directly</text>
  <line x1="600" y1="232" x2="600" y2="252" stroke="#16a34a" stroke-width="2" marker-end="url(#zg)"/>
  <rect x="450" y="254" width="300" height="36" rx="9" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="600" y="277" text-anchor="middle" font-size="12" fill="#15803d">Only dirty views checked (fine)</text>
  <text x="600" y="322" text-anchor="middle" font-size="11" fill="#166534">provideZonelessChangeDetection()</text>
  <text x="600" y="342" text-anchor="middle" font-size="11" fill="#166534">no Zone.js — smaller, targeted CD</text>

  <defs>
    <marker id="zf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="zg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
