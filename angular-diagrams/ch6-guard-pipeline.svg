<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="300" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Guard execution order in a navigation</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">Any false cancels; a UrlTree redirects. Same-level guards run in parallel</text>

  <!-- steps -->
  <rect x="30" y="110" width="140" height="80" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="100" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">CanMatch</text>
  <text x="100" y="162" text-anchor="middle" font-size="11" fill="#64748b">during matching</text>
  <text x="100" y="178" text-anchor="middle" font-size="11" fill="#64748b">gates lazy chunk</text>

  <rect x="200" y="110" width="140" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="270" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">CanDeactivate</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#64748b">leaving old route</text>
  <text x="270" y="178" text-anchor="middle" font-size="11" fill="#64748b">unsaved changes?</text>

  <rect x="370" y="110" width="140" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">CanActivate</text>
  <text x="440" y="162" text-anchor="middle" font-size="11" fill="#64748b">+ CanActivate</text>
  <text x="440" y="178" text-anchor="middle" font-size="11" fill="#64748b">Child (entering)</text>

  <rect x="540" y="110" width="140" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Resolve</text>
  <text x="610" y="162" text-anchor="middle" font-size="11" fill="#64748b">pre-fetch data</text>
  <text x="610" y="178" text-anchor="middle" font-size="11" fill="#64748b">router waits</text>

  <rect x="710" y="110" width="90" height="80" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="755" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Activate</text>
  <text x="755" y="168" text-anchor="middle" font-size="11" fill="#64748b">render</text>

  <line x1="170" y1="150" x2="198" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#g)"/>
  <line x1="340" y1="150" x2="368" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#g)"/>
  <line x1="510" y1="150" x2="538" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#g)"/>
  <line x1="680" y1="150" x2="708" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#g)"/>

  <text x="410" y="238" text-anchor="middle" font-size="13" fill="#64748b">Functional guards run inside an injection context, so inject() is legal inside them</text>
  <text x="410" y="262" text-anchor="middle" font-size="13" fill="#64748b">A guard may return true / false / UrlTree, sync or as a Promise / Observable</text>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
