<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Resolution Modifiers</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">They change where the injector is allowed to look</text>

  <!-- Self -->
  <rect x="40" y="96" width="360" height="140" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="128" font-size="15" font-weight="700" fill="#1d4ed8">@Self()</text>
  <text x="60" y="154" font-size="12.5" fill="#334155">Look ONLY in this element's</text>
  <text x="60" y="174" font-size="12.5" fill="#334155">own injector. No walking up.</text>
  <text x="60" y="204" font-size="12" fill="#64748b">Throws if not found locally</text>
  <text x="60" y="224" font-size="12" fill="#64748b">(unless paired with Optional).</text>

  <!-- SkipSelf -->
  <rect x="420" y="96" width="360" height="140" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="440" y="128" font-size="15" font-weight="700" fill="#7e22ce">@SkipSelf()</text>
  <text x="440" y="154" font-size="12.5" fill="#334155">SKIP this injector, start the</text>
  <text x="440" y="174" font-size="12.5" fill="#334155">search at the parent.</text>
  <text x="440" y="204" font-size="12" fill="#64748b">Used to reach a shared parent</text>
  <text x="440" y="224" font-size="12" fill="#64748b">while re-providing locally.</text>

  <!-- Optional -->
  <rect x="40" y="252" width="360" height="140" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="284" font-size="15" font-weight="700" fill="#15803d">@Optional()</text>
  <text x="60" y="310" font-size="12.5" fill="#334155">Return null instead of throwing</text>
  <text x="60" y="330" font-size="12.5" fill="#334155">when no provider is found.</text>
  <text x="60" y="360" font-size="12" fill="#64748b">inject(X, { optional: true })</text>
  <text x="60" y="380" font-size="12" fill="#64748b">Use for: optional collaborators.</text>

  <!-- Host -->
  <rect x="420" y="252" width="360" height="140" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="284" font-size="15" font-weight="700" fill="#b91c1c">@Host()</text>
  <text x="440" y="310" font-size="12.5" fill="#334155">Walk up, but STOP at the host</text>
  <text x="440" y="330" font-size="12.5" fill="#334155">component boundary.</text>
  <text x="440" y="360" font-size="12" fill="#64748b">Use for: content-projection deps</text>
  <text x="440" y="380" font-size="12" fill="#64748b">shared by a host and its content.</text>
</svg>
