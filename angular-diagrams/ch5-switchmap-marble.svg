<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">switchMap marble diagram</text>
  <text x="410" y="68" text-anchor="middle" font-size="14" fill="#64748b">A new source value cancels the in-flight inner stream</text>

  <!-- source -->
  <text x="60" y="118" font-size="13" font-weight="700" fill="#334155">source</text>
  <line x1="140" y1="120" x2="740" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="220" cy="120" r="10" fill="#dc2626"/><text x="220" y="125" text-anchor="middle" font-size="11" fill="#fff">a</text>
  <circle cx="420" cy="120" r="10" fill="#dc2626"/><text x="420" y="125" text-anchor="middle" font-size="11" fill="#fff">b</text>

  <!-- inner a -->
  <text x="60" y="188" font-size="13" fill="#64748b">inner(a)</text>
  <line x1="220" y1="190" x2="520" y2="190" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="300" cy="190" r="9" fill="#f87171"/><text x="300" y="195" text-anchor="middle" font-size="10" fill="#fff">a1</text>
  <line x1="420" y1="176" x2="420" y2="300" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="460" y="215" font-size="11" fill="#dc2626">a cancelled when b arrives</text>

  <!-- inner b -->
  <text x="60" y="258" font-size="13" fill="#64748b">inner(b)</text>
  <line x1="420" y1="260" x2="740" y2="260" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="500" cy="260" r="9" fill="#3b82f6"/><text x="500" y="265" text-anchor="middle" font-size="10" fill="#fff">b1</text>
  <circle cx="600" cy="260" r="9" fill="#3b82f6"/><text x="600" y="265" text-anchor="middle" font-size="10" fill="#fff">b2</text>

  <!-- output -->
  <text x="60" y="338" font-size="13" font-weight="700" fill="#334155">output</text>
  <line x1="140" y1="340" x2="740" y2="340" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="300" cy="340" r="10" fill="#f87171"/><text x="300" y="345" text-anchor="middle" font-size="10" fill="#fff">a1</text>
  <circle cx="500" cy="340" r="10" fill="#3b82f6"/><text x="500" y="345" text-anchor="middle" font-size="10" fill="#fff">b1</text>
  <circle cx="600" cy="340" r="10" fill="#3b82f6"/><text x="600" y="345" text-anchor="middle" font-size="10" fill="#fff">b2</text>
</svg>
