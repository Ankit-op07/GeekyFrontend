<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">@defer Triggers</text>
  <text x="410" y="68" text-anchor="middle" font-size="13" fill="#64748b">When the lazy chunk is fetched and the main block swaps in</text>

  <!-- 6 trigger cards -->
  <rect x="40" y="92" width="230" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="155" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">on idle</text>
  <text x="155" y="144" text-anchor="middle" font-size="11" fill="#334155">browser is idle</text>
  <text x="155" y="164" text-anchor="middle" font-size="11" fill="#64748b">(default) requestIdleCallback</text>

  <rect x="295" y="92" width="230" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="410" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">on viewport</text>
  <text x="410" y="144" text-anchor="middle" font-size="11" fill="#334155">scrolled into view</text>
  <text x="410" y="164" text-anchor="middle" font-size="11" fill="#64748b">IntersectionObserver</text>

  <rect x="550" y="92" width="230" height="90" rx="12" fill="#faf5ff" stroke="#9333ea"/>
  <text x="665" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">on interaction</text>
  <text x="665" y="144" text-anchor="middle" font-size="11" fill="#334155">click / keydown</text>
  <text x="665" y="164" text-anchor="middle" font-size="11" fill="#64748b">on placeholder</text>

  <rect x="40" y="196" width="230" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="155" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">on hover</text>
  <text x="155" y="248" text-anchor="middle" font-size="11" fill="#334155">pointer enters</text>
  <text x="155" y="268" text-anchor="middle" font-size="11" fill="#64748b">mouseenter / focusin</text>

  <rect x="295" y="196" width="230" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="410" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">on timer</text>
  <text x="410" y="248" text-anchor="middle" font-size="11" fill="#334155">after a duration</text>
  <text x="410" y="268" text-anchor="middle" font-size="11" fill="#64748b">on timer(3s)</text>

  <rect x="550" y="196" width="230" height="90" rx="12" fill="#faf5ff" stroke="#9333ea"/>
  <text x="665" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">when / immediate</text>
  <text x="665" y="248" text-anchor="middle" font-size="11" fill="#334155">boolean expr / ASAP</text>
  <text x="665" y="268" text-anchor="middle" font-size="11" fill="#64748b">when isReady()</text>

  <!-- prefetch note -->
  <rect x="40" y="304" width="740" height="76" rx="12" fill="#fffbeb" stroke="#d97706"/>
  <text x="410" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">prefetch (separate axis)</text>
  <text x="410" y="356" text-anchor="middle" font-size="11.5" fill="#334155">prefetch on idle / on hover &#8212; fetch the chunk EARLY, render only when the main trigger fires</text>
  <text x="410" y="374" text-anchor="middle" font-size="11" fill="#64748b">so the swap is instant with no download wait</text>
</svg>
