<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="340" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">NgRx Effects: Async Side-Effect Loop</text>
  <text x="410" y="68" text-anchor="middle" font-size="13" fill="#64748b">Effects listen for actions, do async work, and dispatch result actions</text>

  <rect x="30" y="110" width="150" height="60" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="105" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">loadUsers</text>
  <text x="105" y="154" text-anchor="middle" font-size="11" fill="#7e22ce">action fired</text>

  <line x1="180" y1="140" x2="228" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#ne)"/>
  <rect x="230" y="110" width="150" height="60" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="305" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Effect</text>
  <text x="305" y="154" text-anchor="middle" font-size="11" fill="#b91c1c">ofType(loadUsers)</text>

  <line x1="380" y1="140" x2="428" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#ne)"/>
  <rect x="430" y="110" width="150" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="505" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">HTTP call</text>
  <text x="505" y="154" text-anchor="middle" font-size="11" fill="#64748b">switchMap → api</text>

  <line x1="580" y1="140" x2="628" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#ne)"/>
  <rect x="630" y="98" width="160" height="42" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="710" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">loadUsersSuccess</text>
  <rect x="630" y="146" width="160" height="42" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="710" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">loadUsersFailure</text>

  <!-- feedback loop -->
  <line x1="710" y1="188" x2="710" y2="250" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="710" y1="250" x2="105" y2="250" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="105" y1="250" x2="105" y2="172" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#nf)"/>
  <text x="410" y="244" text-anchor="middle" font-size="11" fill="#64748b">result action → reducer updates Store → selectors push new state to the view</text>

  <text x="410" y="296" text-anchor="middle" font-size="12" fill="#64748b">Effects never touch the Store directly — they return actions, keeping reducers pure.</text>

  <defs>
    <marker id="ne" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="nf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
