<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="470" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">CD Tree Traversal &amp; Dirty Marking</text>
  <text x="410" y="68" text-anchor="middle" font-size="13" fill="#64748b">A tick walks top-down; OnPush subtrees are skipped unless marked dirty</text>

  <!-- Root -->
  <rect x="345" y="92" width="130" height="46" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">AppRoot</text>
  <text x="410" y="131" text-anchor="middle" font-size="11" fill="#64748b">Default · checked</text>

  <!-- Level 2 -->
  <line x1="410" y1="138" x2="200" y2="182" stroke="#94a3b8" stroke-width="2" marker-end="url(#a8)"/>
  <line x1="410" y1="138" x2="620" y2="182" stroke="#94a3b8" stroke-width="2" marker-end="url(#a8)"/>

  <rect x="120" y="184" width="160" height="46" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Sidebar (OnPush)</text>
  <text x="200" y="223" text-anchor="middle" font-size="11" fill="#166534">not dirty · SKIPPED</text>

  <rect x="540" y="184" width="160" height="46" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="620" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">Feed (OnPush)</text>
  <text x="620" y="223" text-anchor="middle" font-size="11" fill="#7e22ce">input changed · DIRTY</text>

  <!-- Level 3 under Sidebar (skipped) -->
  <line x1="200" y1="230" x2="200" y2="270" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="120" y="272" width="160" height="42" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="200" y="293" text-anchor="middle" font-size="12" fill="#94a3b8">NavItem — not visited</text>
  <text x="200" y="308" text-anchor="middle" font-size="11" fill="#94a3b8">whole subtree pruned</text>

  <!-- Level 3 under Feed (checked) -->
  <line x1="620" y1="230" x2="620" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#a8)"/>
  <rect x="540" y="272" width="160" height="42" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="620" y="293" text-anchor="middle" font-size="12" fill="#7e22ce">PostCard — re-checked</text>
  <text x="620" y="308" text-anchor="middle" font-size="11" fill="#7e22ce">bindings compared</text>

  <!-- markForCheck path -->
  <rect x="300" y="352" width="220" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="373" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">markForCheck()</text>
  <text x="410" y="389" text-anchor="middle" font-size="11" fill="#b91c1c">marks node + all ancestors dirty</text>
  <line x1="410" y1="352" x2="410" y2="140" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>

  <text x="410" y="432" text-anchor="middle" font-size="12" fill="#64748b">Ancestors are marked so the next tick can reach the dirty leaf.</text>
  <text x="410" y="452" text-anchor="middle" font-size="12" fill="#64748b">Skipped subtrees keep their previous DOM untouched.</text>

  <defs>
    <marker id="a8" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
