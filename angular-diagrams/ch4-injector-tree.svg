<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="480" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">The Hierarchical Injector Tree</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">Angular walks UP the tree until it finds a provider</text>

  <!-- Root injector -->
  <rect x="300" y="100" width="220" height="66" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Root Injector</text>
  <text x="410" y="150" text-anchor="middle" font-size="12" fill="#166534">providedIn: 'root' → singleton</text>

  <!-- lines -->
  <line x1="410" y1="166" x2="230" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="166" x2="590" y2="210" stroke="#94a3b8" stroke-width="2"/>

  <!-- Component A injector -->
  <rect x="120" y="210" width="220" height="66" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="230" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Component A Injector</text>
  <text x="230" y="260" text-anchor="middle" font-size="12" fill="#64748b">providers: [...] → own instance</text>

  <!-- Component B injector -->
  <rect x="480" y="210" width="220" height="66" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="590" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Component B Injector</text>
  <text x="590" y="260" text-anchor="middle" font-size="12" fill="#64748b">no providers → uses root</text>

  <!-- child of A -->
  <line x1="230" y1="276" x2="230" y2="320" stroke="#94a3b8" stroke-width="2"/>
  <rect x="120" y="320" width="220" height="66" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="230" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Child of A</text>
  <text x="230" y="370" text-anchor="middle" font-size="12" fill="#64748b">inject(Service) →</text>

  <!-- resolution arrow up -->
  <line x1="345" y1="353" x2="470" y2="250" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#up)"/>
  <text x="360" y="440" font-size="13" fill="#334155">Resolution: <tspan font-weight="600">Child of A</tspan> asks for a Service → not found locally → walks up to <tspan font-weight="600" fill="#1d4ed8">A</tspan>, then <tspan font-weight="600" fill="#15803d">Root</tspan>. First provider found wins.</text>

  <defs>
    <marker id="up" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
