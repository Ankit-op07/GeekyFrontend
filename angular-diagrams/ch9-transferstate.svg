<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">TransferState: Avoiding the Double Fetch</text>
  <text x="410" y="68" text-anchor="middle" font-size="13" fill="#64748b">Server serialises HTTP results into the HTML; client reads them instead of re-fetching</text>

  <!-- without -->
  <rect x="30" y="92" width="360" height="290" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="210" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">Without TransferState</text>
  <rect x="60" y="138" width="300" height="36" rx="9" fill="#ffffff" stroke="#fca5a5"/>
  <text x="210" y="161" text-anchor="middle" font-size="11.5" fill="#334155">Server fetches /api/data</text>
  <line x1="210" y1="174" x2="210" y2="192" stroke="#94a3b8" stroke-width="2" marker-end="url(#ts)"/>
  <rect x="60" y="194" width="300" height="36" rx="9" fill="#ffffff" stroke="#fca5a5"/>
  <text x="210" y="217" text-anchor="middle" font-size="11.5" fill="#334155">Renders HTML with data</text>
  <line x1="210" y1="230" x2="210" y2="248" stroke="#94a3b8" stroke-width="2" marker-end="url(#ts)"/>
  <rect x="60" y="250" width="300" height="36" rx="9" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="210" y="273" text-anchor="middle" font-size="11.5" fill="#b91c1c">Client fetches /api/data AGAIN</text>
  <text x="210" y="316" text-anchor="middle" font-size="11" fill="#b91c1c">Double request, flicker on refetch</text>
  <text x="210" y="338" text-anchor="middle" font-size="11" fill="#64748b">wasted bandwidth + server load</text>

  <!-- with -->
  <rect x="430" y="92" width="360" height="290" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="610" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">With TransferState</text>
  <rect x="460" y="138" width="300" height="36" rx="9" fill="#ffffff" stroke="#86efac"/>
  <text x="610" y="161" text-anchor="middle" font-size="11.5" fill="#334155">Server fetches /api/data</text>
  <line x1="610" y1="174" x2="610" y2="192" stroke="#16a34a" stroke-width="2" marker-end="url(#tsg)"/>
  <rect x="460" y="194" width="300" height="36" rx="9" fill="#ffffff" stroke="#86efac"/>
  <text x="610" y="217" text-anchor="middle" font-size="11.5" fill="#334155">Embeds state in &lt;script&gt; tag</text>
  <line x1="610" y1="230" x2="610" y2="248" stroke="#16a34a" stroke-width="2" marker-end="url(#tsg)"/>
  <rect x="460" y="250" width="300" height="36" rx="9" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="610" y="273" text-anchor="middle" font-size="11.5" fill="#15803d">Client READS the cache</text>
  <text x="610" y="316" text-anchor="middle" font-size="11" fill="#15803d">No second request, no flicker</text>
  <text x="610" y="338" text-anchor="middle" font-size="11" fill="#64748b">withHttpTransferCacheOptions() is automatic</text>

  <defs>
    <marker id="ts" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="tsg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
