<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="480" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Auth Interceptor: attach token &amp; refresh on 401</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#64748b">One place adds the header; one place recovers from expiry</text>
  <defs>
    <marker id="ar7a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>

  <rect x="290" y="96" width="240" height="52" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">Outgoing request</text>
  <text x="410" y="138" text-anchor="middle" font-size="11.5" fill="#64748b">req.clone(add Authorization)</text>

  <line x1="410" y1="148" x2="410" y2="172" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar7a)"/>
  <rect x="290" y="176" width="240" height="46" rx="11" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="204" text-anchor="middle" font-size="13" fill="#15803d">Server responds</text>

  <line x1="410" y1="222" x2="410" y2="246" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar7a)"/>
  <path d="M410 250 L470 280 L410 310 L350 280 Z" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="285" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7e22ce">401?</text>

  <!-- no path -->
  <line x1="470" y1="280" x2="620" y2="280" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar7a)"/>
  <text x="545" y="272" text-anchor="middle" font-size="11.5" fill="#16a34a">no</text>
  <rect x="624" y="256" width="150" height="48" rx="11" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="699" y="285" text-anchor="middle" font-size="12.5" fill="#15803d">emit response</text>

  <!-- yes path -->
  <line x1="410" y1="310" x2="410" y2="336" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar7a)"/>
  <text x="426" y="328" font-size="11.5" fill="#b91c1c">yes</text>
  <rect x="270" y="340" width="280" height="48" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="362" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">call /refresh (once, shared)</text>
  <text x="410" y="379" text-anchor="middle" font-size="11" fill="#64748b">queue concurrent 401s behind it</text>

  <line x1="410" y1="388" x2="410" y2="412" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar7a)"/>
  <rect x="270" y="416" width="280" height="48" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="438" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">retry original with new token</text>
  <text x="410" y="455" text-anchor="middle" font-size="11" fill="#64748b">refresh fails -&gt; log out</text>
</svg>
