<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="440" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">CDK virtual scroll: render only the window</text>
  <text x="410" y="68" text-anchor="middle" font-size="14" fill="#64748b">10,000 items, but only the visible few exist in the DOM</text>
  <g font-size="13">
    <rect x="90" y="96" width="240" height="300" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="210" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Full data (10,000)</text>
    <rect x="110" y="132" width="200" height="248" rx="8" fill="#f1f5f9"/>
    <rect x="110" y="200" width="200" height="112" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="210" y="252" text-anchor="middle" font-size="12" fill="#1d4ed8">viewport window</text>
    <text x="210" y="272" text-anchor="middle" font-size="11" fill="#64748b">visible range</text>

    <rect x="440" y="96" width="300" height="300" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text x="590" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">Rendered DOM</text>
    <rect x="470" y="140" width="240" height="30" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="490" y="160" fill="#334155">item 148 (buffer)</text>
    <rect x="470" y="176" width="240" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="490" y="196" fill="#334155">item 149 (visible)</text>
    <rect x="470" y="212" width="240" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="490" y="232" fill="#334155">item 150 (visible)</text>
    <rect x="470" y="248" width="240" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="490" y="268" fill="#334155">item 151 (visible)</text>
    <rect x="470" y="284" width="240" height="30" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="490" y="304" fill="#334155">item 152 (buffer)</text>
    <text x="590" y="344" text-anchor="middle" font-size="12" fill="#64748b">~5 nodes recycled as you scroll</text>
    <text x="590" y="366" text-anchor="middle" font-size="12" fill="#64748b">transform: translateY offsets them</text>

    <rect x="40" y="410" width="740" height="20" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="410" y="425" text-anchor="middle" font-size="12" fill="#b91c1c">A tall spacer element preserves the real scrollbar height (itemSize x count).</text>
  </g>
</svg>
