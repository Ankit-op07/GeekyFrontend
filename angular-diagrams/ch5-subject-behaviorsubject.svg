<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="440" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Subject vs BehaviorSubject</text>
  <text x="410" y="68" text-anchor="middle" font-size="14" fill="#64748b">A late subscriber gets nothing from a Subject, but the current value from a BehaviorSubject</text>

  <!-- Subject -->
  <rect x="40" y="92" width="740" height="150" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="118" font-size="16" font-weight="700" fill="#b91c1c">Subject — no initial value, no replay</text>
  <text x="60" y="160" font-size="12" fill="#64748b">emits</text>
  <line x1="120" y1="162" x2="740" y2="162" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="200" cy="162" r="8" fill="#dc2626"/><text x="200" y="167" text-anchor="middle" font-size="10" fill="#fff">1</text>
  <circle cx="320" cy="162" r="8" fill="#dc2626"/><text x="320" y="167" text-anchor="middle" font-size="10" fill="#fff">2</text>
  <circle cx="560" cy="162" r="8" fill="#dc2626"/><text x="560" y="167" text-anchor="middle" font-size="10" fill="#fff">3</text>
  <line x1="420" y1="146" x2="420" y2="228" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="420" y="222" text-anchor="middle" font-size="11" fill="#16a34a">subscribe here</text>
  <text x="470" y="200" font-size="12" fill="#334155">receives only 3 (missed 1 and 2)</text>

  <!-- BehaviorSubject -->
  <rect x="40" y="252" width="740" height="160" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="278" font-size="16" font-weight="700" fill="#15803d">BehaviorSubject(0) — holds current value, replays it once</text>
  <text x="60" y="322" font-size="12" fill="#64748b">emits</text>
  <line x1="120" y1="324" x2="740" y2="324" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="140" cy="324" r="8" fill="#94a3b8"/><text x="140" y="329" text-anchor="middle" font-size="10" fill="#fff">0</text>
  <circle cx="200" cy="324" r="8" fill="#16a34a"/><text x="200" y="329" text-anchor="middle" font-size="10" fill="#fff">1</text>
  <circle cx="320" cy="324" r="8" fill="#16a34a"/><text x="320" y="329" text-anchor="middle" font-size="10" fill="#fff">2</text>
  <circle cx="560" cy="324" r="8" fill="#16a34a"/><text x="560" y="329" text-anchor="middle" font-size="10" fill="#fff">3</text>
  <line x1="420" y1="308" x2="420" y2="398" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="420" y="392" text-anchor="middle" font-size="11" fill="#dc2626">subscribe here</text>
  <text x="470" y="362" font-size="12" fill="#334155">immediately gets 2 (last value), then 3</text>
</svg>
