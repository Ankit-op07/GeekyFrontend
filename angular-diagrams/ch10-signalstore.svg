<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">SignalStore Composition</text>
  <text x="410" y="68" text-anchor="middle" font-size="13" fill="#64748b">signalStore assembles features into one reactive store</text>

  <!-- container -->
  <rect x="40" y="90" width="740" height="240" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#7e22ce">signalStore( ... )</text>

  <!-- withState -->
  <rect x="70" y="134" width="160" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">withState</text>
  <text x="150" y="180" text-anchor="middle" font-size="11" fill="#64748b">initial slices</text>
  <text x="150" y="197" text-anchor="middle" font-size="11" fill="#64748b">become signals</text>

  <!-- withComputed -->
  <rect x="250" y="134" width="160" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">withComputed</text>
  <text x="330" y="180" text-anchor="middle" font-size="11" fill="#166534">derived signals</text>
  <text x="330" y="197" text-anchor="middle" font-size="11" fill="#166534">memoized</text>

  <!-- withMethods -->
  <rect x="430" y="134" width="160" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="510" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">withMethods</text>
  <text x="510" y="180" text-anchor="middle" font-size="11" fill="#b91c1c">updaters + async</text>
  <text x="510" y="197" text-anchor="middle" font-size="11" fill="#b91c1c">call patchState</text>

  <!-- withHooks -->
  <rect x="610" y="134" width="140" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="680" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">withHooks</text>
  <text x="680" y="180" text-anchor="middle" font-size="11" fill="#64748b">onInit /</text>
  <text x="680" y="197" text-anchor="middle" font-size="11" fill="#64748b">onDestroy</text>

  <!-- patchState -->
  <rect x="250" y="244" width="320" height="60" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">patchState(store, partial)</text>
  <text x="410" y="290" text-anchor="middle" font-size="11" fill="#64748b">the only way to mutate — immutable merge</text>

  <line x1="510" y1="214" x2="450" y2="242" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="304" x2="150" y2="216" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <text x="250" y="330" text-anchor="middle" font-size="11" fill="#94a3b8">state signals update, computed re-derive</text>

  <text x="410" y="368" text-anchor="middle" font-size="12" fill="#64748b">A SignalStore is a service: inject() it in components, read signals directly in templates.</text>
  <text x="410" y="392" text-anchor="middle" font-size="12" fill="#64748b">No actions, no reducers, no boilerplate — Redux ideas without the ceremony.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#cbd5e1"/></marker>
  </defs>
</svg>
