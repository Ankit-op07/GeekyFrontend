<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Promise (eager, one value) vs Observable (lazy, many)</text>
  <text x="410" y="68" text-anchor="middle" font-size="14" fill="#64748b">A Promise runs on creation; an Observable runs only on subscribe and can re-run</text>

  <!-- Promise -->
  <rect x="40" y="92" width="740" height="130" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="118" font-size="16" font-weight="700" fill="#b91c1c">Promise</text>
  <text x="60" y="140" font-size="13" fill="#334155">Producer fires at creation. Resolves once. Result cached. No cancel.</text>
  <line x1="60" y1="180" x2="740" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="168" font-size="12" fill="#64748b">created</text>
  <circle cx="120" cy="180" r="7" fill="#dc2626"/>
  <text x="120" y="205" text-anchor="middle" font-size="11" fill="#b91c1c">work starts</text>
  <circle cx="420" cy="180" r="9" fill="#dc2626"/>
  <text x="420" y="205" text-anchor="middle" font-size="11" fill="#b91c1c">42 (resolve)</text>
  <text x="700" y="168" font-size="18" fill="#dc2626">|</text>
  <text x="720" y="205" text-anchor="middle" font-size="11" fill="#b91c1c">done</text>

  <!-- Observable -->
  <rect x="40" y="232" width="740" height="150" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="258" font-size="16" font-weight="700" fill="#1d4ed8">Observable (cold)</text>
  <text x="60" y="280" font-size="13" fill="#334155">Nothing runs at creation. On subscribe: 0..N values, then complete. Cancellable.</text>
  <line x1="60" y1="332" x2="740" y2="332" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="320" font-size="12" fill="#64748b">subscribe()</text>
  <circle cx="180" cy="332" r="8" fill="#3b82f6"/>
  <text x="180" y="358" text-anchor="middle" font-size="11" fill="#1d4ed8">1</text>
  <circle cx="320" cy="332" r="8" fill="#3b82f6"/>
  <text x="320" y="358" text-anchor="middle" font-size="11" fill="#1d4ed8">2</text>
  <circle cx="460" cy="332" r="8" fill="#3b82f6"/>
  <text x="460" y="358" text-anchor="middle" font-size="11" fill="#1d4ed8">3</text>
  <text x="600" y="338" font-size="20" fill="#1d4ed8">|</text>
  <text x="600" y="358" text-anchor="middle" font-size="11" fill="#1d4ed8">complete</text>
  <text x="700" y="320" font-size="12" fill="#64748b">unsubscribe = teardown</text>
</svg>
