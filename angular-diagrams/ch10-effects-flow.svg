<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Effects: Side Effects Loop</text>
  <text x="410" y="68" text-anchor="middle" font-size="13" fill="#64748b">An effect listens for an action, does async work, and dispatches a result action</text>

  <!-- Dispatch trigger action -->
  <rect x="40" y="100" width="180" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="130" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">loadUsers</text>
  <text x="130" y="142" text-anchor="middle" font-size="11" fill="#b91c1c">trigger action</text>

  <!-- Effect -->
  <rect x="310" y="90" width="200" height="76" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Effect</text>
  <text x="410" y="134" text-anchor="middle" font-size="11" fill="#64748b">ofType + flattening</text>
  <text x="410" y="151" text-anchor="middle" font-size="11" fill="#64748b">switchMap / concatMap</text>

  <!-- API -->
  <rect x="600" y="100" width="180" height="56" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="690" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">HTTP / API</text>
  <text x="690" y="142" text-anchor="middle" font-size="11" fill="#7e22ce">the real side effect</text>

  <!-- Success / Failure -->
  <rect x="560" y="230" width="220" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">loadUsersSuccess</text>
  <text x="670" y="270" text-anchor="middle" font-size="11" fill="#166534">map(users) result action</text>

  <rect x="560" y="298" width="220" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="670" y="321" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">loadUsersFailure</text>
  <text x="670" y="338" text-anchor="middle" font-size="11" fill="#b91c1c">catchError result action</text>

  <!-- Reducer/Store -->
  <rect x="40" y="264" width="220" height="56" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="150" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">Reducer + Store</text>
  <text x="150" y="306" text-anchor="middle" font-size="11" fill="#7e22ce">result updates state</text>

  <!-- arrows -->
  <line x1="220" y1="128" x2="308" y2="128" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="510" y1="128" x2="598" y2="128" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="690" y1="156" x2="690" y2="228" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="740" y="200" text-anchor="middle" font-size="11" fill="#64748b">resolve</text>
  <line x1="560" y1="256" x2="262" y2="286" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="410" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">dispatch result</text>
  <line x1="560" y1="324" x2="262" y2="308" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <text x="410" y="384" text-anchor="middle" font-size="12" fill="#64748b">Effects are the only place async and impurity live. Reducers stay pure; the store stays predictable.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
