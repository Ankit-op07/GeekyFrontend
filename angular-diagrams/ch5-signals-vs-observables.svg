<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="380" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Signals vs Observables — pick the right tool</text>
  <text x="410" y="68" text-anchor="middle" font-size="14" fill="#64748b">Signals = synchronous state. Observables = async events over time.</text>

  <!-- signals -->
  <rect x="40" y="90" width="360" height="250" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Signals</text>
  <g font-size="13" fill="#334155">
    <text x="60" y="148">• Always hold a current value</text>
    <text x="60" y="176">• Synchronous, pull-based (read on demand)</text>
    <text x="60" y="204">• Glitch-free, auto-tracked dependencies</text>
    <text x="60" y="232">• No unsubscribe — GC handles it</text>
    <text x="60" y="260">• Great for component/UI state</text>
    <text x="60" y="288">• No operators for async time</text>
    <text x="60" y="316" fill="#15803d">signal / computed / effect</text>
  </g>

  <!-- observables -->
  <rect x="420" y="90" width="360" height="250" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Observables</text>
  <g font-size="13" fill="#334155">
    <text x="440" y="148">• Stream of values over time</text>
    <text x="440" y="176">• Asynchronous, push-based</text>
    <text x="440" y="204">• Rich operators (switchMap, debounce…)</text>
    <text x="440" y="232">• Need teardown (leak risk)</text>
    <text x="440" y="260">• Great for events, HTTP, websockets</text>
    <text x="440" y="288">• Can be cold/hot, sync/async</text>
    <text x="440" y="316" fill="#1d4ed8">bridge: toSignal / toObservable</text>
  </g>
</svg>
