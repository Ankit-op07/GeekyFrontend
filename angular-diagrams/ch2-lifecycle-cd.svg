<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">First Pass vs Every Change-Detection Pass</text>
  <text x="410" y="70" text-anchor="middle" font-size="14" fill="#64748b">Some hooks run once; the check hooks run again and again</text>

  <!-- First pass column -->
  <rect x="40" y="96" width="350" height="270" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="215" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">First pass (once)</text>

  <rect x="66" y="140" width="298" height="30" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="80" y="160" font-size="13" fill="#1d4ed8" font-weight="700">ngOnChanges</text>
  <rect x="66" y="176" width="298" height="30" rx="7" fill="#f0fdf4" stroke="#86efac"/>
  <text x="80" y="196" font-size="13" fill="#15803d" font-weight="700">ngOnInit</text>
  <rect x="66" y="212" width="298" height="30" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="80" y="232" font-size="13" fill="#334155" font-weight="700">ngDoCheck</text>
  <rect x="66" y="248" width="298" height="30" rx="7" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="80" y="268" font-size="13" fill="#7e22ce" font-weight="700">ngAfterContentInit + Checked</text>
  <rect x="66" y="284" width="298" height="30" rx="7" fill="#fff7ed" stroke="#fdba74"/>
  <text x="80" y="304" font-size="13" fill="#c2410c" font-weight="700">ngAfterViewInit + Checked</text>
  <text x="215" y="344" text-anchor="middle" font-size="12" fill="#64748b">Init hooks fire exactly once</text>

  <!-- Every pass column -->
  <rect x="430" y="96" width="350" height="270" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="605" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Every later pass</text>

  <rect x="456" y="140" width="298" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="470" y="162" font-size="13" fill="#334155" font-weight="700">ngOnChanges (only if input changed)</text>
  <rect x="456" y="182" width="298" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="470" y="204" font-size="13" fill="#334155" font-weight="700">ngDoCheck</text>
  <rect x="456" y="224" width="298" height="34" rx="7" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="470" y="246" font-size="13" fill="#7e22ce" font-weight="700">ngAfterContentChecked</text>
  <rect x="456" y="266" width="298" height="34" rx="7" fill="#fff7ed" stroke="#fdba74"/>
  <text x="470" y="288" font-size="13" fill="#c2410c" font-weight="700">ngAfterViewChecked</text>
  <text x="605" y="344" text-anchor="middle" font-size="12" fill="#64748b">Keep these cheap — they run constantly</text>
</svg>
