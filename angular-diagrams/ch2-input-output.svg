<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Inputs Flow Down, Outputs Flow Up</text>
  <text x="410" y="70" text-anchor="middle" font-size="14" fill="#64748b">Parent passes data via input(); child notifies via output()</text>

  <defs>
    <marker id="dnA" markerWidth="12" markerHeight="12" refX="4" refY="9" orient="auto">
      <path d="M0,0 L8,0 L4,9 Z" fill="#3b82f6"/>
    </marker>
    <marker id="upA" markerWidth="12" markerHeight="12" refX="4" refY="0" orient="auto">
      <path d="M4,0 L8,9 L0,9 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Parent -->
  <rect x="210" y="98" width="400" height="110" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">Parent component</text>
  <rect x="238" y="140" width="344" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="410" y="162" text-anchor="middle" font-size="13" fill="#334155">&lt;app-child [total]="sum"</text>
  <text x="410" y="181" text-anchor="middle" font-size="13" fill="#334155">(save)="onSave($event)" /&gt;</text>

  <!-- Child -->
  <rect x="210" y="290" width="400" height="110" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">Child component</text>
  <rect x="238" y="332" width="344" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="410" y="354" text-anchor="middle" font-size="13" fill="#334155">total = input.required&lt;number&gt;();</text>
  <text x="410" y="373" text-anchor="middle" font-size="13" fill="#334155">save = output&lt;Data&gt;();</text>

  <!-- Down arrow (input) -->
  <line x1="330" y1="208" x2="330" y2="286" stroke="#3b82f6" stroke-width="3" marker-end="url(#dnA)"/>
  <rect x="120" y="228" width="150" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="195" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">input() — data down</text>

  <!-- Up arrow (output) -->
  <line x1="490" y1="286" x2="490" y2="210" stroke="#dc2626" stroke-width="3" marker-end="url(#upA)"/>
  <rect x="548" y="228" width="152" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="624" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">output() — events up</text>
</svg>
