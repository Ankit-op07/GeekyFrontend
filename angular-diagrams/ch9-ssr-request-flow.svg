<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="440" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Angular SSR Request Flow</text>
  <text x="410" y="68" text-anchor="middle" font-size="13" fill="#64748b">One request rendered to a string on the server, then hydrated on the client</text>

  <rect x="60" y="96" width="220" height="44" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="170" y="123" text-anchor="middle" font-size="13" fill="#1d4ed8">Browser requests /route</text>
  <line x1="280" y1="118" x2="330" y2="118" stroke="#94a3b8" stroke-width="2" marker-end="url(#rf)"/>

  <rect x="330" y="96" width="240" height="44" rx="10" fill="#faf5ff" stroke="#9333ea"/>
  <text x="450" y="118" text-anchor="middle" font-size="13" fill="#7e22ce">Node server (server.ts)</text>
  <text x="450" y="134" text-anchor="middle" font-size="10.5" fill="#7e22ce">AngularNodeAppEngine</text>
  <line x1="450" y1="140" x2="450" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#rf)"/>

  <rect x="290" y="172" width="320" height="44" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="450" y="194" text-anchor="middle" font-size="13" fill="#15803d">bootstrapApplication (server config)</text>
  <text x="450" y="210" text-anchor="middle" font-size="10.5" fill="#15803d">provideServerRendering()</text>
  <line x1="450" y1="216" x2="450" y2="246" stroke="#94a3b8" stroke-width="2" marker-end="url(#rf)"/>

  <rect x="290" y="248" width="320" height="44" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="450" y="270" text-anchor="middle" font-size="13" fill="#334155">App runs, resolvers/HTTP resolve</text>
  <text x="450" y="286" text-anchor="middle" font-size="10.5" fill="#64748b">renderApplication serialises DOM to string</text>
  <line x1="450" y1="292" x2="450" y2="322" stroke="#94a3b8" stroke-width="2" marker-end="url(#rf)"/>

  <rect x="290" y="324" width="320" height="44" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="450" y="346" text-anchor="middle" font-size="13" fill="#1d4ed8">Full HTML + serialized state sent</text>
  <text x="450" y="362" text-anchor="middle" font-size="10.5" fill="#64748b">TransferState embedded in &lt;script&gt;</text>
  <line x1="290" y1="346" x2="170" y2="346" stroke="#16a34a" stroke-width="2" marker-end="url(#rfg)"/>

  <rect x="60" y="324" width="150" height="44" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="135" y="346" text-anchor="middle" font-size="12.5" fill="#15803d">Paint + hydrate</text>
  <text x="135" y="362" text-anchor="middle" font-size="10.5" fill="#15803d">reuses server DOM</text>

  <text x="410" y="404" text-anchor="middle" font-size="11.5" fill="#64748b">provideClientHydration() in the browser config makes the client reuse, not rebuild, the DOM</text>

  <defs>
    <marker id="rf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="rfg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
