<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">The four Subject variants</text>
  <text x="410" y="68" text-anchor="middle" font-size="14" fill="#64748b">What a late subscriber receives on subscribe</text>

  <g font-size="13">
    <rect x="40" y="90" width="740" height="66" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="60" y="118" font-size="15" font-weight="700" fill="#b91c1c">Subject</text>
    <text x="240" y="118" fill="#334155">No initial value. Late subscriber gets only future emissions.</text>
    <text x="240" y="140" fill="#64748b">Use for: event buses, one-off notifications.</text>

    <rect x="40" y="166" width="740" height="66" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="60" y="194" font-size="15" font-weight="700" fill="#15803d">BehaviorSubject</text>
    <text x="240" y="194" fill="#334155">Requires seed. Always holds/replays the latest value. Has getValue().</text>
    <text x="240" y="216" fill="#64748b">Use for: state — current filter, logged-in user.</text>

    <rect x="40" y="242" width="740" height="66" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="270" font-size="15" font-weight="700" fill="#1d4ed8">ReplaySubject(n)</text>
    <text x="240" y="270" fill="#334155">Replays the last n values (optional time window). No seed needed.</text>
    <text x="240" y="292" fill="#64748b">Use for: buffering last N events / caching.</text>

    <rect x="40" y="318" width="740" height="66" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text x="60" y="346" font-size="15" font-weight="700" fill="#7e22ce">AsyncSubject</text>
    <text x="240" y="346" fill="#334155">Emits only the final value, and only after complete().</text>
    <text x="240" y="368" fill="#64748b">Use for: a single result computed once.</text>
  </g>
</svg>
