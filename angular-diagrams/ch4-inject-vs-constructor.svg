<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">inject() vs Constructor Injection</text>

  <!-- constructor -->
  <rect x="40" y="80" width="360" height="280" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">constructor()</text>

  <rect x="72" y="132" width="296" height="40" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="220" y="157" text-anchor="middle" font-size="12" fill="#334155">Only inside constructor params</text>

  <rect x="72" y="182" width="296" height="40" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="220" y="207" text-anchor="middle" font-size="12" fill="#334155">Needs @Optional decorators</text>

  <rect x="72" y="232" width="296" height="40" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="220" y="257" text-anchor="middle" font-size="12" fill="#334155">Hard to reuse across classes</text>

  <text x="220" y="308" text-anchor="middle" font-size="12.5" fill="#64748b">Still valid; needed for some</text>
  <text x="220" y="328" text-anchor="middle" font-size="12.5" fill="#64748b">libraries and DI edge cases</text>

  <!-- inject -->
  <rect x="420" y="80" width="360" height="280" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">inject()</text>

  <rect x="452" y="132" width="296" height="40" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="157" text-anchor="middle" font-size="12" fill="#334155">Field initializers, no boilerplate</text>

  <rect x="452" y="182" width="296" height="40" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="207" text-anchor="middle" font-size="12" fill="#334155">Options object: optional / host</text>

  <rect x="452" y="232" width="296" height="40" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="257" text-anchor="middle" font-size="12" fill="#334155">Reusable helper functions</text>

  <text x="600" y="308" text-anchor="middle" font-size="12.5" fill="#15803d">Must run in an injection context</text>
  <text x="600" y="328" text-anchor="middle" font-size="12.5" fill="#15803d">(constructor / field / factory)</text>
</svg>
