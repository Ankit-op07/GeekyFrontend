<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Signal dependency graph (glitch-free)</text>
  <text x="410" y="68" text-anchor="middle" font-size="14" fill="#64748b">computed values are lazy + memoized; the effect runs once per batch, never on a stale mix</text>

  <!-- source signals -->
  <rect x="80" y="110" width="150" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">price()</text>
  <text x="155" y="158" text-anchor="middle" font-size="11" fill="#64748b">signal — writable</text>

  <rect x="80" y="240" width="150" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">qty()</text>
  <text x="155" y="288" text-anchor="middle" font-size="11" fill="#64748b">signal — writable</text>

  <!-- computed -->
  <rect x="340" y="175" width="170" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="425" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">subtotal()</text>
  <text x="425" y="226" text-anchor="middle" font-size="11" fill="#64748b">computed — memoized</text>

  <rect x="590" y="175" width="150" height="70" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="665" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">effect()</text>
  <text x="665" y="226" text-anchor="middle" font-size="11" fill="#64748b">side effect</text>

  <!-- edges -->
  <line x1="230" y1="140" x2="340" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <line x1="230" y1="270" x2="340" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="510" y1="210" x2="590" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="588,210 578,205 578,215" fill="#94a3b8"/>

  <text x="410" y="345" text-anchor="middle" font-size="13" fill="#334155">Update price() and qty() together → subtotal recomputes ONCE, effect runs ONCE.</text>
  <text x="410" y="372" text-anchor="middle" font-size="13" fill="#64748b">No intermediate "price changed but qty stale" emission — that is glitch-free / topological.</text>
</svg>
