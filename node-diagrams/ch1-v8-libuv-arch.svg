<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="10" y="10" width="800" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">V8 runs the code, libuv handles the waiting</text>

  <rect x="55" y="80" width="330" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="220" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">V8 engine</text>
  <text x="220" y="136" text-anchor="middle" font-size="12" fill="#64748b">Parses JS to bytecode</text>
  <text x="220" y="158" text-anchor="middle" font-size="12" fill="#64748b">JIT compiles hot code</text>
  <text x="220" y="180" text-anchor="middle" font-size="12" fill="#64748b">Manages the call stack</text>
  <text x="220" y="202" text-anchor="middle" font-size="12" fill="#64748b">Garbage collects memory</text>

  <rect x="435" y="80" width="330" height="150" rx="14" fill="#fff7ed" stroke="#ea580c"/>
  <text x="600" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">libuv</text>
  <text x="600" y="136" text-anchor="middle" font-size="12" fill="#64748b">Runs the event loop</text>
  <text x="600" y="158" text-anchor="middle" font-size="12" fill="#64748b">Async file &amp; network I/O</text>
  <text x="600" y="180" text-anchor="middle" font-size="12" fill="#64748b">Thread pool (4 by default)</text>
  <text x="600" y="202" text-anchor="middle" font-size="12" fill="#64748b">Timers &amp; OS signals</text>

  <line x1="385" y1="155" x2="435" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="435" y1="175" x2="385" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="150" y="270" width="520" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="410" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">One main thread runs your JavaScript</text>
  <text x="410" y="319" text-anchor="middle" font-size="12" fill="#64748b">heavy waiting is offloaded, so the thread stays free</text>

  <line x1="220" y1="230" x2="300" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="600" y1="230" x2="520" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#a1)"/>

  <text x="410" y="368" text-anchor="middle" font-size="13" fill="#334155">Together they are the Node.js runtime</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
