<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="10" y="10" width="800" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Single thread, but never blocked</text>

  <rect x="60" y="80" width="240" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="180" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Call stack</text>
  <text x="180" y="136" text-anchor="middle" font-size="12" fill="#64748b">runs one function</text>
  <text x="180" y="154" text-anchor="middle" font-size="12" fill="#64748b">at a time</text>

  <rect x="520" y="80" width="240" height="90" rx="12" fill="#fff7ed" stroke="#ea580c"/>
  <text x="640" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Thread pool</text>
  <text x="640" y="136" text-anchor="middle" font-size="12" fill="#64748b">4 helper threads</text>
  <text x="640" y="154" text-anchor="middle" font-size="12" fill="#64748b">for slow work</text>

  <rect x="290" y="210" width="240" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="410" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Event loop</text>
  <text x="410" y="266" text-anchor="middle" font-size="12" fill="#64748b">picks finished work</text>
  <text x="410" y="284" text-anchor="middle" font-size="12" fill="#64748b">and queues callbacks</text>

  <line x1="180" y1="170" x2="330" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>
  <text x="215" y="196" font-size="11" fill="#64748b">start async task</text>

  <line x1="530" y1="125" x2="640" y2="80" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>
  <text x="548" y="120" font-size="11" fill="#64748b">offload I/O</text>

  <line x1="640" y1="170" x2="490" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>
  <text x="560" y="205" font-size="11" fill="#64748b">done</text>

  <line x1="330" y1="255" x2="200" y2="170" stroke="#16a34a" stroke-width="2" marker-end="url(#a2g)"/>
  <text x="205" y="240" font-size="11" fill="#16a34a">run callback</text>

  <rect x="130" y="330" width="560" height="80" rx="12" fill="#faf5ff" stroke="#9333ea"/>
  <text x="410" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Callback queues</text>
  <text x="410" y="384" text-anchor="middle" font-size="12" fill="#64748b">timers, I/O callbacks, setImmediate, microtasks (Promises)</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#334155"/>
    </marker>
    <marker id="a2g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
