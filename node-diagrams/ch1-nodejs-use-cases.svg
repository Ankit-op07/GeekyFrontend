<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="10" y="10" width="800" height="360" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">What people build with Node.js</text>

  <rect x="50" y="80" width="220" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="160" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Web APIs</text>
  <text x="160" y="138" text-anchor="middle" font-size="12" fill="#64748b">REST &amp; GraphQL</text>
  <text x="160" y="158" text-anchor="middle" font-size="12" fill="#64748b">servers, Express,</text>
  <text x="160" y="178" text-anchor="middle" font-size="12" fill="#64748b">Fastify, Nest</text>

  <rect x="300" y="80" width="220" height="120" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="410" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Real-time</text>
  <text x="410" y="138" text-anchor="middle" font-size="12" fill="#64748b">chat, live feeds,</text>
  <text x="410" y="158" text-anchor="middle" font-size="12" fill="#64748b">WebSockets,</text>
  <text x="410" y="178" text-anchor="middle" font-size="12" fill="#64748b">notifications</text>

  <rect x="550" y="80" width="220" height="120" rx="12" fill="#faf5ff" stroke="#9333ea"/>
  <text x="660" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Tooling / CLIs</text>
  <text x="660" y="138" text-anchor="middle" font-size="12" fill="#64748b">bundlers, linters,</text>
  <text x="660" y="158" text-anchor="middle" font-size="12" fill="#64748b">npm scripts,</text>
  <text x="660" y="178" text-anchor="middle" font-size="12" fill="#64748b">build pipelines</text>

  <rect x="50" y="220" width="220" height="120" rx="12" fill="#fff7ed" stroke="#ea580c"/>
  <text x="160" y="252" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Microservices</text>
  <text x="160" y="278" text-anchor="middle" font-size="12" fill="#64748b">small services,</text>
  <text x="160" y="298" text-anchor="middle" font-size="12" fill="#64748b">queues, jobs,</text>
  <text x="160" y="318" text-anchor="middle" font-size="12" fill="#64748b">serverless funcs</text>

  <rect x="300" y="220" width="220" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="410" y="252" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">SSR &amp; full-stack</text>
  <text x="410" y="278" text-anchor="middle" font-size="12" fill="#64748b">Next.js, Remix,</text>
  <text x="410" y="298" text-anchor="middle" font-size="12" fill="#64748b">rendering React</text>
  <text x="410" y="318" text-anchor="middle" font-size="12" fill="#64748b">on the server</text>

  <rect x="550" y="220" width="220" height="120" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="660" y="252" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Data glue</text>
  <text x="660" y="278" text-anchor="middle" font-size="12" fill="#64748b">API gateways,</text>
  <text x="660" y="298" text-anchor="middle" font-size="12" fill="#64748b">proxies, stream</text>
  <text x="660" y="318" text-anchor="middle" font-size="12" fill="#64748b">processing</text>
</svg>
