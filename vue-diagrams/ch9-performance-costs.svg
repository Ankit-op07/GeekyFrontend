<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 318" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="318" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Three costs, three sets of remedies</text>
  <text x="430" y="66" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Diagnose which one you are paying before choosing a fix</text>
  <g>
    <rect x="30" y="96" width="253" height="152" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="156.5" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">Load cost</text>
    <text x="156.5" y="142" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Slow first paint, blank screen</text>
    <text x="156.5" y="158" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">— route code splitting</text>
    <text x="156.5" y="174" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">— dependency audit</text>
    <text x="156.5" y="190" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">— Brotli / gzip</text>
    <text x="156.5" y="206" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Measure: Lighthouse, visualizer</text>
    <rect x="303" y="96" width="253" height="152" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="429.5" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Render cost</text>
    <text x="429.5" y="142" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Slow to display a page or list</text>
    <text x="429.5" y="158" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">— virtual scrolling</text>
    <text x="429.5" y="174" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">— pagination</text>
    <text x="429.5" y="190" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">— fewer components</text>
    <text x="429.5" y="206" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Measure: DevTools timeline</text>
    <rect x="576" y="96" width="253" height="152" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="702.5" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Update cost</text>
    <text x="702.5" y="142" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Laggy typing, janky interaction</text>
    <text x="702.5" y="158" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">— shallowRef, markRaw</text>
    <text x="702.5" y="174" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">— computed not method</text>
    <text x="702.5" y="190" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">— debounce, split components</text>
    <text x="702.5" y="206" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Measure: onRenderTriggered</text>
    <rect x="30" y="262" width="800" height="40" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="430" y="287" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">v-once and v-memo are LAST resorts — a missing v-memo dependency is a silently stale UI.</text>
  </g>
</svg>
