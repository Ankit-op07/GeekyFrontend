<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 398" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="398" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The reactivity loop</text>
  <text x="430" y="66" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Reads record dependencies; writes re-run what depends on them</text>
  <g>
    <rect x="30" y="100" width="180" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="120" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Effect runs</text>
    <text x="120" y="146" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">activeEffect = this</text>
    <text x="120" y="162" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">render / computed / watcher</text>
    <path d="M 214 146 L 232 146" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="201.5" y="128" width="43" height="17" rx="8" fill="#f8fafc"/>
    <text x="223" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">reads</text>
    <rect x="236" y="100" width="180" height="92" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="326" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Proxy get trap</text>
    <text x="326" y="146" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">track(target, key)</text>
    <path d="M 420 146 L 438 146" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="401.3" y="128" width="55.4" height="17" rx="8" fill="#f8fafc"/>
    <text x="429" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">records</text>
    <rect x="442" y="100" width="180" height="92" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="532" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">targetMap</text>
    <text x="532" y="146" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">WeakMap&lt;target,</text>
    <text x="532" y="162" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Map&lt;key, Set&lt;effect&gt;&gt;&gt;</text>
    <path d="M 626 146 L 644 146" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="604.2" y="128" width="61.6" height="17" rx="8" fill="#f8fafc"/>
    <text x="635" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">on write</text>
    <rect x="648" y="100" width="180" height="92" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="738" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Proxy set trap</text>
    <text x="738" y="146" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">trigger(target, key)</text>
    <path d="M 738 196 Q 429 244 120 232" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="404.4" y="211" width="49.2" height="17" rx="8" fill="#f8fafc"/>
    <text x="429" y="223" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">queues</text>
    <rect x="30" y="236" width="180" height="92" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="120" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Job queue</text>
    <text x="120" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">De-duplicated</text>
    <text x="120" y="298" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Parent before child</text>
    <path d="M 214 282 L 232 282" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="189.1" y="264" width="67.80000000000001" height="17" rx="8" fill="#f8fafc"/>
    <text x="223" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">microtask</text>
    <rect x="236" y="236" width="180" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="326" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Flush</text>
    <text x="326" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Effects re-run</text>
    <text x="326" y="298" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">DOM patched</text>
    <rect x="326" y="244" width="80" height="18" rx="9" fill="#10b981" opacity="0.15"/>
    <text x="366" y="257" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">nextTick()</text>
    <rect x="30" y="342" width="800" height="40" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="430" y="367" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">Reads OUTSIDE an effect track nothing — activeEffect is null, so track() returns early.</text>
  </g>
</svg>
