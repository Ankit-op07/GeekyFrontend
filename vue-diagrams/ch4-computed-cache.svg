<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 262" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="262" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">A computed is lazy and cached</text>
  <text x="430" y="66" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">A dependency change marks it dirty; the work happens on the next read</text>
  <g>
    <rect x="30" y="100" width="180" height="92" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="120" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Created</text>
    <text x="120" y="146" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Getter does NOT run</text>
    <text x="120" y="162" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">dirty = true</text>
    <path d="M 214 146 L 232 146" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="186" y="128" width="74" height="17" rx="8" fill="#f8fafc"/>
    <text x="223" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">first read</text>
    <rect x="236" y="100" width="180" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="326" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Evaluate</text>
    <text x="326" y="146" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Runs in an effect</text>
    <text x="326" y="162" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Dependencies tracked</text>
    <text x="326" y="178" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Result cached</text>
    <path d="M 420 146 L 438 146" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="392" y="128" width="74" height="17" rx="8" fill="#f8fafc"/>
    <text x="429" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">read again</text>
    <rect x="442" y="100" width="180" height="92" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="532" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Cache hit</text>
    <text x="532" y="146" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Returns instantly</text>
    <text x="532" y="162" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Getter never runs</text>
    <path d="M 626 146 L 644 146" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="594.9" y="128" width="80.2" height="17" rx="8" fill="#f8fafc"/>
    <text x="635" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">dep changes</text>
    <rect x="648" y="100" width="180" height="92" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="738" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Marked dirty</text>
    <text x="738" y="146" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">NOT recomputed yet</text>
    <text x="738" y="162" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Recomputes on next access</text>
    <rect x="30" y="206" width="800" height="40" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="430" y="231" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">Getters must be pure — they may run at unpredictable times, or never at all.</text>
  </g>
</svg>
