<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 396" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="396" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Props down, events up</text>
  <text x="430" y="66" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">One owner per piece of state</text>
  <g>
    <rect x="280" y="98" width="300" height="64" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="430" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Parent — owns the state</text>
    <text x="430" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">const user = ref(…)</text>
    <path d="M 430 166 L 157 212" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="275.1" y="171" width="36.8" height="17" rx="8" fill="#f8fafc"/>
    <text x="293.5" y="183" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">down</text>
    <rect x="30" y="218" width="254" height="92" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="157" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">props</text>
    <text x="157" y="264" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Read-only in the child</text>
    <text x="157" y="280" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Reactive</text>
    <text x="157" y="296" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Must be declared</text>
    <path d="M 430 166 L 429 212" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="417.3" y="171" width="24.4" height="17" rx="8" fill="#f8fafc"/>
    <text x="429.5" y="183" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">up</text>
    <rect x="302" y="218" width="254" height="92" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="429" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">emit</text>
    <text x="429" y="264" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Child reports what happened</text>
    <text x="429" y="280" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Parent decides what it means</text>
    <path d="M 430 166 L 701 212" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="574" y="218" width="254" height="92" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="701" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">direct write</text>
    <text x="701" y="264" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Child assigns to parent state</text>
    <text x="701" y="280" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Untraceable — forbidden</text>
    <rect x="771" y="226" width="47" height="18" rx="9" fill="#f43f5e" opacity="0.15"/>
    <text x="794.5" y="239" text-anchor="middle" font-size="10" font-weight="700" fill="#9f1239">NEVER</text>
    <rect x="30" y="334" width="800" height="44" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="430" y="362" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9f1239">Assigning to a prop warns. Mutating a prop OBJECT does not warn — and is the same mistake.</text>
  </g>
</svg>
