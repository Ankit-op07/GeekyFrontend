<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 382" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="382" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Anatomy of a Single-File Component</text>
  <text x="430" y="66" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">One file, three blocks, one concern</text>
  <g>
    <rect x="60" y="100" width="740" height="64" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="430" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">UserCard.vue</text>
    <path d="M 178 170 L 178 210" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="60" y="216" width="236" height="96" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="178" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">&lt;script setup&gt;</text>
    <text x="178" y="262" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">State, computeds,</text>
    <text x="178" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">functions, imports</text>
    <text x="178" y="306" text-anchor="middle" font-size="10.5" font-weight="600" fill="#065f46">→ setup() + auto return</text>
    <path d="M 430 170 L 430 210" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="312" y="216" width="236" height="96" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="430" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">&lt;template&gt;</text>
    <text x="430" y="262" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Markup.</text>
    <text x="430" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">One per file.</text>
    <text x="430" y="306" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e3a8a">→ render function</text>
    <path d="M 682 170 L 682 210" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="564" y="216" width="236" height="96" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="682" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">&lt;style scoped&gt;</text>
    <text x="682" y="262" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">CSS confined to</text>
    <text x="682" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">this component</text>
    <text x="682" y="306" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b21b6">→ [data-v-hash] selectors</text>
    <rect x="30" y="326" width="800" height="40" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="430" y="351" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">Separation of concerns by COMPONENT, not by file type — what changes together stays together.</text>
  </g>
</svg>
