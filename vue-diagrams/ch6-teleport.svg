<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 384" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="384" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Teleport separates DOM position from component position</text>
  <text x="430" y="66" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">The modal moves; the relationship does not</text>
  <g>
    <rect x="30" y="96" width="388" height="214" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="224" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">DOM position</text>
    <text x="224" y="148" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Moved to the target</text>
    <rect x="46" y="164" width="356" height="27" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="224" y="182" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">body</text>
    <rect x="46" y="198" width="356" height="27" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="224" y="216" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">  └ div#app  (overflow: hidden)</text>
    <rect x="46" y="232" width="356" height="27" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="224" y="250" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">  └ div#modals  ← rendered HERE</text>
    <rect x="46" y="266" width="356" height="27" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="224" y="284" text-anchor="middle" font-size="11.5" font-weight="600" fill="#065f46">✓  Escapes overflow, z-index, transform</text>
    <rect x="442" y="96" width="388" height="214" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="636" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">Component position</text>
    <text x="636" y="148" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Completely unchanged</text>
    <rect x="458" y="164" width="356" height="27" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="636" y="182" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">App → Page → Card → Modal</text>
    <rect x="458" y="198" width="356" height="27" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="636" y="216" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">props and emits work normally</text>
    <rect x="458" y="232" width="356" height="27" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="636" y="250" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">provide / inject resolves normally</text>
    <rect x="458" y="266" width="356" height="27" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="636" y="284" text-anchor="middle" font-size="11.5" font-weight="600" fill="#065f46">✓  Scoped-style hash still applied</text>
    <rect x="30" y="326" width="800" height="42" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="430" y="346" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">A high z-index cannot fix this: z-index only orders WITHIN a stacking context, and transform breaks</text>
    <text x="430" y="361" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">position:fixed.</text>
  </g>
</svg>
