<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 532" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="532" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Vue is adopted in layers</text>
  <text x="430" y="66" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Each ring is optional until the application needs it</text>
  <g>
    <rect x="60" y="96" width="740" height="62" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="430" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">Core runtime — a &lt;script&gt; tag on an existing page</text>
    <text x="430" y="141" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">No build step, no toolchain</text>
    
    <rect x="122" y="170" width="616" height="62" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="430" y="196" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">Components &amp; Single-File Components</text>
    <text x="430" y="215" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">Reusable units; needs a build step</text>
    
    <rect x="184" y="244" width="492" height="62" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="430" y="270" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a8a">Vue Router + Pinia</text>
    <text x="430" y="289" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">Client routing and shared state — official, still optional</text>
    
    <rect x="246" y="318" width="368" height="62" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="430" y="344" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a8a">Vite build pipeline</text>
    <text x="430" y="363" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">Bundling, TypeScript, code splitting</text>
    
    <rect x="308" y="392" width="244" height="62" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="430" y="418" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5b21b6">SSR / SSG (Nuxt)</text>
    <text x="430" y="437" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">Server rendering and hydration</text>
    
    <rect x="30" y="476" width="800" height="40" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="430" y="501" text-anchor="middle" font-size="12.5" font-weight="600" fill="#065f46">The same component model at every layer — nothing is rewritten as you climb.</text>
  </g>
</svg>
