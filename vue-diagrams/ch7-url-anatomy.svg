<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 382" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="382" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">What lives in a URL</text>
  <text x="430" y="66" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">If removing it should 404 it is a param; if it should show defaults it is a query</text>
  <g>
    <rect x="60" y="100" width="740" height="64" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="430" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/users/42?sort=name&amp;page=2#bio</text>
    <path d="M 178 170 L 178 210" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="60" y="216" width="236" height="96" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="178" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Route param</text>
    <text x="178" y="262" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">/users/:id</text>
    <text x="178" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">route.params.id</text>
    <text x="178" y="306" text-anchor="middle" font-size="10.5" font-weight="600" fill="#065f46">WHICH resource · required</text>
    <path d="M 430 170 L 430 210" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="312" y="216" width="236" height="96" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="430" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Query params</text>
    <text x="430" y="262" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">?sort=name&amp;page=2</text>
    <text x="430" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">route.query.sort</text>
    <text x="430" y="306" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e3a8a">HOW to view · optional</text>
    <path d="M 682 170 L 682 210" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="564" y="216" width="236" height="96" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="682" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Hash</text>
    <text x="682" y="262" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">#bio</text>
    <text x="682" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">route.hash</text>
    <text x="682" y="306" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b21b6">scrollBehavior target</text>
    <rect x="30" y="326" width="800" height="40" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="430" y="351" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">Every param value is a STRING — route.params.id === 42 is always false.</text>
  </g>
</svg>
