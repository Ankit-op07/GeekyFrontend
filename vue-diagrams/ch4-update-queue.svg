<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 262" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="262" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The async update queue</text>
  <text x="430" y="66" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">One microtask, three phases</text>
  <g>
    <rect x="30" y="100" width="180" height="92" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="120" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Sync mutations</text>
    <text x="120" y="146" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">count.value++ ×3</text>
    <text x="120" y="162" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">State updated immediately</text>
    <path d="M 214 146 L 232 146" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="201.5" y="128" width="43" height="17" rx="8" fill="#f8fafc"/>
    <text x="223" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">queue</text>
    <rect x="236" y="100" width="180" height="92" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="326" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">1. Pre-flush</text>
    <text x="326" y="146" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">watch (default)</text>
    <text x="326" y="162" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Can change more state</text>
    <path d="M 420 146 L 438 146" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="410.6" y="128" width="36.8" height="17" rx="8" fill="#f8fafc"/>
    <text x="429" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">then</text>
    <rect x="442" y="100" width="180" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="532" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">2. Render effects</text>
    <text x="532" y="146" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Sorted by component id</text>
    <text x="532" y="162" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">PARENT before child</text>
    <path d="M 626 146 L 644 146" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="616.6" y="128" width="36.8" height="17" rx="8" fill="#f8fafc"/>
    <text x="635" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">then</text>
    <rect x="648" y="100" width="180" height="92" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="738" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">3. Post-flush</text>
    <text x="738" y="146" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">watch flush:'post'</text>
    <text x="738" y="162" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">onUpdated · nextTick()</text>
    <rect x="30" y="206" width="800" height="40" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="430" y="231" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">Scheduled with Promise.then — a MICROTASK, so it lands before paint. setTimeout(…,0) is the wrong ordering.</text>
  </g>
</svg>
