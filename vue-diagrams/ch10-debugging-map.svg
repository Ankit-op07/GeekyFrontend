<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 554" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="554" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Symptom → usual cause → first check</text>
  <text x="430" y="66" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Most Vue bugs fall into a handful of families</text>
  <g>
    <rect x="30" y="96" width="390" height="116" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="225" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">UI does not update</text>
    <text x="225" y="142" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Broken reactivity</text>
    <text x="225" y="158" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Destructured? reassigned?</text>
    <text x="225" y="174" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">mutated the raw object?</text>
    <rect x="440" y="96" width="390" height="116" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="635" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">Wrong row after a sort</text>
    <text x="635" y="142" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Missing or index :key</text>
    <text x="635" y="158" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Check the v-for key</text>
    <rect x="30" y="232" width="390" height="116" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="225" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">DOM value is stale</text>
    <text x="225" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Async update queue</text>
    <text x="225" y="294" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Missing await nextTick()</text>
    <rect x="440" y="232" width="390" height="116" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="635" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Re-renders too often</text>
    <text x="635" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Over-broad dependencies</text>
    <text x="635" y="294" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">onRenderTriggered names the key</text>
    <rect x="30" y="368" width="390" height="116" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="225" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Template ref is null</text>
    <text x="225" y="414" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Read before mount</text>
    <text x="225" y="430" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Move it into onMounted</text>
    <rect x="440" y="368" width="390" height="116" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="635" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Hydration mismatch</text>
    <text x="635" y="414" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Server and client rendered differently</text>
    <text x="635" y="430" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Non-determinism · untransferred state</text>
    <rect x="30" y="498" width="800" height="40" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="430" y="523" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">Log toRaw(state), not the proxy — the console shows getters and evaluates them lazily.</text>
  </g>
</svg>
