<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 304" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="304" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Three built-ins, three different jobs</text>
  <text x="430" y="66" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Split the bundle · centralise loading · preserve instances</text>
  <g>
    <rect x="30" y="96" width="253" height="138" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="156.5" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">defineAsyncComponent</text>
    <text x="156.5" y="142" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">() =&gt; import("./X.vue")</text>
    <text x="156.5" y="158" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Separate chunk, loaded on first render</text>
    <text x="156.5" y="174" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">loadingComponent + delay: 200</text>
    <text x="156.5" y="190" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">errorComponent + onError retry</text>
    <rect x="303" y="96" width="253" height="138" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="429.5" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">&lt;Suspense&gt;</text>
    <text x="429.5" y="142" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">#default + #fallback</text>
    <text x="429.5" y="158" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Waits for ALL async deps</text>
    <text x="429.5" y="174" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Top-level await needs it</text>
    <text x="429.5" y="190" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Still EXPERIMENTAL</text>
    <rect x="576" y="96" width="253" height="138" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="702.5" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">&lt;KeepAlive&gt;</text>
    <text x="702.5" y="142" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Caches instead of destroying</text>
    <text x="702.5" y="158" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">onActivated / onDeactivated</text>
    <text x="702.5" y="174" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Bound with :max</text>
    <text x="702.5" y="190" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">include/exclude match name</text>
    <rect x="30" y="248" width="800" height="40" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="430" y="273" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">Never async-load a component on the first paint — that just adds a round trip to the critical path.</text>
  </g>
</svg>
